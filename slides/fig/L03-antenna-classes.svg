<text x="429" y="256" fill="#004a85" font-size="15.5" font-weight="700" text-anchor="middle">wide band</text>

<!-- panel 3 : self-scaling -->
<text x="723" y="20" fill="#004a85" font-size="17" font-weight="700" text-anchor="middle">Self-scaling</text>
<rect x="664" y="86" width="68" height="92" rx="10" fill="#1d7a4d" opacity="0.13"/>
<rect x="664" y="86" width="68" height="92" rx="10" fill="none" stroke="#1d7a4d" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="698" y="76" fill="#1d7a4d" font-size="14.5" font-weight="700" text-anchor="middle">active region</text>
<line x1="604" y1="132" x2="820" y2="132" stroke="#004a85" stroke-width="3"/>
