<line x1="494" y1="132" x2="504" y2="132" stroke="#004a85" stroke-width="2"/>
<rect x="504" y="120" width="28" height="24" fill="none" stroke="#004a85" stroke-width="2"/>
<line x1="532" y1="132" x2="556" y2="132" stroke="#004a85" stroke-width="2"/>
<line x1="556" y1="132" x2="556" y2="150" stroke="#004a85" stroke-width="2"/>
<line x1="544" y1="150" x2="568" y2="150" stroke="#004a85" stroke-width="2.4"/>
<line x1="548" y1="156" x2="564" y2="156" stroke="#004a85" stroke-width="2"/>
