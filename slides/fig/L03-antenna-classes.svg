<svg viewBox="0 0 858 276" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three antenna classes: a resonant dipole whose current reflects at the ends into a standing wave and is narrowband, a terminated wire whose current decays as it travels and never returns so it is wideband, and a log-periodic whose active section moves with frequency so it is very wideband">
<defs>
<marker id="ac-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b01e24"/></marker>
<marker id="ac-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5a5a5a"/></marker>
</defs>

<line x1="284" y1="12" x2="284" y2="266" stroke="#cddce9" stroke-width="1.4"/>
<line x1="580" y1="12" x2="580" y2="266" stroke="#cddce9" stroke-width="1.4"/>

<!-- panel 1 : resonant -->
<text x="135" y="20" fill="#004a85" font-size="17" font-weight="700" text-anchor="middle">Resonant</text>
<path d="M25 132 C 78 74, 192 74, 245 132" fill="none" stroke="#0067b9" stroke-width="2.6"/>
<text x="135" y="66" fill="#0067b9" font-size="15" font-weight="700" text-anchor="middle">standing wave</text>
<line x1="25" y1="132" x2="128" y2="132" stroke="#004a85" stroke-width="5" stroke-linecap="round"/>
<line x1="142" y1="132" x2="245" y2="132" stroke="#004a85" stroke-width="5" stroke-linecap="round"/>
<circle cx="128" cy="132" r="3.2" fill="#004a85"/>
<circle cx="142" cy="132" r="3.2" fill="#004a85"/>
<line x1="160" y1="156" x2="240" y2="156" stroke="#b01e24" stroke-width="2.2" marker-end="url(#ac-red)"/>
<line x1="240" y1="172" x2="160" y2="172" stroke="#b01e24" stroke-width="2.2" marker-end="url(#ac-red)"/>
<text x="200" y="192" fill="#b01e24" font-size="14" font-weight="700" text-anchor="middle">out, then back</text>
<text x="135" y="234" fill="#5a5a5a" font-size="14.5" text-anchor="middle">the end reflects the current</text>
<text x="135" y="256" fill="#004a85" font-size="15.5" font-weight="700" text-anchor="middle">narrow band</text>

<!-- panel 2 : traveling wave -->
<text x="429" y="20" fill="#004a85" font-size="17" font-weight="700" text-anchor="middle">Traveling-wave</text>
<text x="400" y="72" fill="#0067b9" font-size="14.5" font-weight="700" text-anchor="middle">decays as it travels</text>
