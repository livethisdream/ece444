<line x1="802" y1="67" x2="802" y2="197" stroke="#004a85" stroke-width="3" stroke-linecap="round"/>
<text x="614" y="212" fill="#5a5a5a" font-size="13.5" text-anchor="middle">high f</text>
<text x="802" y="212" fill="#5a5a5a" font-size="13.5" text-anchor="middle">low f</text>
<text x="723" y="234" fill="#5a5a5a" font-size="14.5" text-anchor="middle">active section moves with frequency</text>
<text x="723" y="256" fill="#004a85" font-size="15.5" font-weight="700" text-anchor="middle">very wide band</text>
</svg>
