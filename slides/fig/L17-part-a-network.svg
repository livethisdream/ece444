<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="560" height="400" role="img" aria-label="Part A network. The laptop, at 192.168.7.1, reaches the Pi, at 192.168.7.13, over the Ethernet cable, which carries ssh and the browser interface on port 8080. The Pi joins the AF_ACADEMY_GUEST Wi-Fi and reaches GitHub through it to run install.sh. A path from the laptop through the access point to the Pi is crossed out: the guest network can isolate its clients from each other.">
