<svg viewBox="0 0 620 264" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Faraday rotation. A linear wave enters the ionosphere and leaves tilted by an unpredictable angle, so a linear receiver fades. A circular wave keeps its rotation sense through the ionosphere, so the loss to a linear receiver is a fixed three decibels.">
<defs>
<marker id="fr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b01e24"/></marker>
<marker id="fr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d7a4d"/></marker>
<marker id="fr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5a5a5a"/></marker>
</defs>

<!-- panel A : linear in, tilted out -->
<text x="150" y="20" fill="#004a85" font-size="17" font-weight="700" text-anchor="middle">Linear wave</text>
<rect x="112" y="52" width="72" height="136" fill="#cddce9" opacity="0.55"/>
<rect x="112" y="52" width="72" height="136" fill="none" stroke="#0067b9" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="148" y="44" fill="#5a5a5a" font-size="13.5" text-anchor="middle">ionosphere</text>

<circle cx="52" cy="120" r="30" fill="none" stroke="#cddce9" stroke-width="1.6"/>
<line x1="52" y1="96" x2="52" y2="144" stroke="#b01e24" stroke-width="2.6" marker-start="url(#fr-red)" marker-end="url(#fr-red)"/>
<line x1="84" y1="120" x2="110" y2="120" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#fr-grey)"/>
<line x1="186" y1="120" x2="212" y2="120" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#fr-grey)"/>

<circle cx="244" cy="120" r="30" fill="none" stroke="#cddce9" stroke-width="1.6"/>
<line x1="244" y1="96" x2="244" y2="144" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.7"/>
<line x1="230.2" y1="139.7" x2="257.8" y2="100.3" stroke="#b01e24" stroke-width="2.6" marker-start="url(#fr-red)" marker-end="url(#fr-red)"/>
<path d="M244 104 A 16 16 0 0 1 253.2 107.0" fill="none" stroke="#b01e24" stroke-width="2"/>
<text x="264" y="98" fill="#b01e24" font-size="18" font-weight="700">?</text>

<text x="148" y="206" fill="#b01e24" font-size="14" font-weight="700" text-anchor="middle">orientation scrambled</text>
<text x="150" y="234" fill="#b01e24" font-size="15" font-weight="700" text-anchor="middle">unpredictable tilt → fading</text>
<text x="150" y="256" fill="#5a5a5a" font-size="13.5" text-anchor="middle">a linear receiver drops into deep nulls</text>

<!-- panel B : circular in, same sense out -->
<line x1="310" y1="12" x2="310" y2="254" stroke="#cddce9" stroke-width="1.4"/>
<text x="470" y="20" fill="#004a85" font-size="17" font-weight="700" text-anchor="middle">Circular wave</text>
<rect x="432" y="52" width="72" height="136" fill="#cddce9" opacity="0.55"/>
<rect x="432" y="52" width="72" height="136" fill="none" stroke="#0067b9" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="468" y="44" fill="#5a5a5a" font-size="13.5" text-anchor="middle">ionosphere</text>

<circle cx="372" cy="120" r="30" fill="none" stroke="#cddce9" stroke-width="1.6"/>
<path d="M372 101 A 19 19 0 1 1 353 120" fill="none" stroke="#1d7a4d" stroke-width="2.6" marker-end="url(#fr-green)"/>
<line x1="372" y1="120" x2="385.4" y2="106.6" stroke="#b01e24" stroke-width="2.4" marker-end="url(#fr-red)"/>
<line x1="404" y1="120" x2="430" y2="120" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#fr-grey)"/>
<line x1="506" y1="120" x2="532" y2="120" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#fr-grey)"/>

<circle cx="564" cy="120" r="30" fill="none" stroke="#cddce9" stroke-width="1.6"/>
<path d="M564 101 A 19 19 0 1 1 545 120" fill="none" stroke="#1d7a4d" stroke-width="2.6" marker-end="url(#fr-green)"/>
<line x1="564" y1="120" x2="577.4" y2="106.6" stroke="#b01e24" stroke-width="2.4" marker-end="url(#fr-red)"/>

<text x="468" y="206" fill="#1d7a4d" font-size="14" font-weight="700" text-anchor="middle">same sense out</text>
<text x="470" y="234" fill="#1d7a4d" font-size="15" font-weight="700" text-anchor="middle">sense survives → fixed 3 dB cost</text>
<text x="470" y="256" fill="#5a5a5a" font-size="13.5" text-anchor="middle">no fading, and the price is known up front</text>
</svg>
