<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" role="img" aria-label="Top view of a rectangular microstrip patch: width W across, length L down, the two edges of width W highlighted as the radiating edges, and an inset microstrip feed">
<defs>
<marker id="pa10" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#004a85"/></marker>
</defs>

<!-- substrate footprint -->
<rect x="70" y="60" width="300" height="272" rx="4" fill="#f5f9fc" stroke="#cddce9" stroke-width="1.8"/>

<!-- the patch -->
<rect x="112" y="100" width="216" height="170" fill="rgba(0,103,185,0.14)" stroke="#004a85" stroke-width="2.4"/>

<!-- the two radiating edges -->
<line x1="112" y1="100" x2="328" y2="100" stroke="#b01e24" stroke-width="7" stroke-linecap="round"/>
<line x1="112" y1="270" x2="328" y2="270" stroke="#b01e24" stroke-width="7" stroke-linecap="round"/>
<text x="220" y="88" text-anchor="middle" fill="#b01e24" font-size="16" font-weight="700">radiating edge</text>
<text x="74" y="294" fill="#b01e24" font-size="16" font-weight="700">radiating edge</text>

<!-- non-radiating side edges -->
<text x="98" y="185" text-anchor="middle" fill="#5b6573" font-size="14" transform="rotate(-90 98 185)">non-radiating</text>
<text x="344" y="185" text-anchor="middle" fill="#5b6573" font-size="14" transform="rotate(90 344 185)">non-radiating</text>

<!-- inset feed -->
<rect x="212" y="270" width="16" height="62" fill="#0067b9"/>
<rect x="194" y="238" width="18" height="32" fill="#f5f9fc" stroke="#cddce9" stroke-width="1"/>
<rect x="228" y="238" width="18" height="32" fill="#f5f9fc" stroke="#cddce9" stroke-width="1"/>
<text x="256" y="320" fill="#0067b9" font-size="15" font-weight="700">inset feed</text>

<!-- W dimension -->
<line x1="112" y1="356" x2="328" y2="356" stroke="#004a85" stroke-width="1.8" marker-start="url(#pa10)" marker-end="url(#pa10)"/>
<line x1="112" y1="336" x2="112" y2="362" stroke="#004a85" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="328" y1="336" x2="328" y2="362" stroke="#004a85" stroke-width="1" stroke-dasharray="4 3"/>
<text x="220" y="384" text-anchor="middle" fill="#004a85" font-size="22" font-weight="700" font-style="italic">W</text>

<!-- L dimension -->
<line x1="402" y1="100" x2="402" y2="270" stroke="#004a85" stroke-width="1.8" marker-start="url(#pa10)" marker-end="url(#pa10)"/>
<line x1="332" y1="100" x2="408" y2="100" stroke="#004a85" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="332" y1="270" x2="408" y2="270" stroke="#004a85" stroke-width="1" stroke-dasharray="4 3"/>
<text x="416" y="192" fill="#004a85" font-size="22" font-weight="700" font-style="italic">L</text>

<!-- what is underneath -->
<text x="70" y="46" fill="#5b6573" font-size="14">substrate and ground plane underneath</text>
</svg>
