<svg font-family="'Source Sans Pro', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The gain-comparison measurement. A transmitter sends fixed power across the range. First the standard-gain horn, of known gain 15.0 dBi, sits at the receive spot and reads minus 40.0 dBm; then the antenna under test sits in the same spot and reads minus 52.9 dBm. 12.9 dB less power means 12.9 dB less gain, so the antenna under test is 2.1 dBi">
<defs><marker id="l13hc-ah-004a85" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#004a85"/></marker><marker id="l13hc-ah-3f7d34" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3f7d34"/></marker><marker id="l13hc-ah-5a5a5a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a5a5a"/></marker></defs>
<line x1="110" y1="210" x2="110" y2="290" stroke="#5a5a5a" stroke-width="5"/>
<path d="M134 151.4 L83.4 171.2 H63.60000000000001 V188.8 H83.4 L134 208.6 Z" fill="#eaf2f9" stroke="#004a85" stroke-width="2.4" stroke-linejoin="round"/>
<text x="110.0" y="130.0" fill="#004a85" font-size="18" font-weight="700" text-anchor="middle">transmit</text>
<text x="110.0" y="150.0" fill="#5a5a5a" font-size="16" text-anchor="middle">fixed power</text>
<line x1="150" y1="180" x2="440" y2="100" stroke="#3f7d34" stroke-width="1.6" stroke-dasharray="7 5"/>
<line x1="150" y1="180" x2="440" y2="262" stroke="#3f7d34" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="292.0" y="184.0" fill="#3f7d34" font-size="16" font-weight="700" text-anchor="middle">same range, same spot</text>
<rect x="448" y="38" width="296" height="124" rx="8" fill="#fff" stroke="#b9d2e5" stroke-width="1.6"/>
<path d="M484 80.0 L530.0 98.0 H548.0 V114.0 H530.0 L484 132.0 Z" fill="#eaf2f9" stroke="#004a85" stroke-width="2.4" stroke-linejoin="round"/>
<text x="470.0" y="64.0" fill="#004a85" font-size="18" font-weight="700" text-anchor="start">1  standard-gain horn</text>
<text x="572.0" y="102.0" fill="#5a5a5a" font-size="16" text-anchor="start">known: 15.0 dBi</text>
<text x="572.0" y="130.0" fill="#004a85" font-size="17" font-weight="700" text-anchor="start">reads −40.0 dBm</text>
<rect x="448" y="200" width="296" height="124" rx="8" fill="#fff" stroke="#b9d2e5" stroke-width="1.6"/>
<line x1="492" y1="234" x2="492" y2="264" stroke="#004a85" stroke-width="5" stroke-linecap="round"/><line x1="492" y1="272" x2="492" y2="302" stroke="#004a85" stroke-width="5" stroke-linecap="round"/><circle cx="492" cy="268" r="4" fill="#fff" stroke="#8a5a00" stroke-width="2"/>
<text x="470.0" y="226.0" fill="#004a85" font-size="18" font-weight="700" text-anchor="start">2  antenna under test</text>
<text x="572.0" y="264.0" fill="#5a5a5a" font-size="16" text-anchor="start">unknown</text>
<text x="572.0" y="292.0" fill="#004a85" font-size="17" font-weight="700" text-anchor="start">reads −52.9 dBm</text>
<text x="380.0" y="350.0" fill="#004a85" font-size="19" font-weight="700" text-anchor="middle">12.9 dB less power, so 12.9 dB less gain: 2.1 dBi</text>
</svg>
