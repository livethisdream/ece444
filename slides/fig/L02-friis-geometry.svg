<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A one-way link: the transmitter's power spreads over a sphere of radius R and the receiving antenna captures the share falling on its effective aperture disk">
<defs>
<marker id="frGa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a5a5a"/></marker>
</defs>

<!-- spreading sphere around the transmitter -->
<circle cx="96" cy="100" r="58" fill="#0067b9" opacity="0.07"/>
<circle cx="96" cy="100" r="58" fill="none" stroke="#0067b9" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.65"/>
<ellipse cx="96" cy="100" rx="58" ry="19" fill="none" stroke="#cddce9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="96" y="26" fill="#004a85" font-size="13" text-anchor="middle">power spreads over a sphere</text>

<!-- outgoing wavefronts toward the receiver -->
<path d="M172.2 56 A88 88 0 0 1 172.2 144" fill="none" stroke="#0067b9" stroke-width="2" opacity="0.55"/>
<path d="M205.1 37 A126 126 0 0 1 205.1 163" fill="none" stroke="#0067b9" stroke-width="2" opacity="0.38"/>
<path d="M238 18 A164 164 0 0 1 238 182" fill="none" stroke="#0067b9" stroke-width="2" opacity="0.24"/>

<!-- transmit antenna -->
<line x1="96" y1="76" x2="96" y2="94" stroke="#004a85" stroke-width="5" stroke-linecap="round"/>
<line x1="96" y1="106" x2="96" y2="124" stroke="#004a85" stroke-width="5" stroke-linecap="round"/>
<circle cx="96" cy="94" r="3.2" fill="#004a85"/>
<circle cx="96" cy="106" r="3.2" fill="#004a85"/>
<text x="96" y="180" fill="#5a5a5a" font-size="14" text-anchor="middle">transmitter</text>

<!-- capture disk at the receiver -->
<ellipse cx="642" cy="100" rx="15" ry="44" fill="#1d7a4d" opacity="0.18"/>
<ellipse cx="642" cy="100" rx="15" ry="44" fill="none" stroke="#1d7a4d" stroke-width="1.8"/>
<line x1="642" y1="100" x2="676" y2="100" stroke="#1d7a4d" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="600" y1="44" x2="636" y2="60" stroke="#1d7a4d" stroke-width="1" opacity="0.8"/>
<text x="596" y="41" fill="#1d7a4d" font-size="13" text-anchor="end">capture disk</text>

<!-- receive antenna -->
<line x1="690" y1="76" x2="690" y2="94" stroke="#004a85" stroke-width="5" stroke-linecap="round"/>
<line x1="690" y1="106" x2="690" y2="124" stroke="#004a85" stroke-width="5" stroke-linecap="round"/>
<circle cx="690" cy="94" r="3.2" fill="#004a85"/>
<circle cx="690" cy="106" r="3.2" fill="#004a85"/>
<text x="690" y="180" fill="#5a5a5a" font-size="14" text-anchor="middle">receiver</text>

<!-- range -->
<line x1="96" y1="200" x2="690" y2="200" stroke="#5a5a5a" stroke-width="1.4" marker-start="url(#frGa)" marker-end="url(#frGa)"/>
<line x1="96" y1="188" x2="96" y2="208" stroke="#5a5a5a" stroke-width="1"/>
<line x1="690" y1="188" x2="690" y2="208" stroke="#5a5a5a" stroke-width="1"/>
<rect x="352" y="188" width="82" height="20" fill="#ffffff"/>
<text x="393" y="204" fill="#5a5a5a" font-size="14" text-anchor="middle">range R</text>
</svg>
