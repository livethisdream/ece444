<svg viewBox="0 0 790 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Five array elements on a straight line radiating toward a far-field direction tilted off broadside, with the extra path length each element adds marked in red between the element line and a common equiphase front">
<defs>
<marker id="l16arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0067b9"/></marker>
<marker id="l16grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a5a5a"/></marker>
</defs>
<g style="font-family:inherit">

<line x1="90" y1="300" x2="660" y2="300" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="96" y="288" font-size="12.5" fill="#5a5a5a">array axis</text>

<line x1="150" y1="300" x2="250.7" y2="138.9" stroke="#0067b9" stroke-width="1.6" marker-end="url(#l16arrow)"/>
<line x1="250" y1="300" x2="350.7" y2="138.9" stroke="#0067b9" stroke-width="1.6" marker-end="url(#l16arrow)"/>
<line x1="350" y1="300" x2="450.7" y2="138.9" stroke="#0067b9" stroke-width="1.6" marker-end="url(#l16arrow)"/>
<line x1="450" y1="300" x2="550.7" y2="138.9" stroke="#0067b9" stroke-width="1.6" marker-end="url(#l16arrow)"/>
<line x1="550" y1="300" x2="650.7" y2="138.9" stroke="#0067b9" stroke-width="1.6" marker-end="url(#l16arrow)"/>
<line x1="350" y1="300" x2="350" y2="110" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#l16grey)"/>
<text x="342" y="104" font-size="12.5" fill="#5a5a5a" text-anchor="end">broadside</text>
<path d="M 350 204 A 96 96 0 0 1 400.9 218.6" fill="none" stroke="#5a5a5a" stroke-width="1.2"/>
<text x="380" y="190" font-size="15" font-weight="700" fill="#1a1a1a">&#952;</text>

<line x1="150" y1="300" x2="262.3" y2="120.2" stroke="#b01e24" stroke-width="2.4"/>
<line x1="250" y1="300" x2="334.2" y2="165.2" stroke="#b01e24" stroke-width="2.4"/>
<line x1="350" y1="300" x2="406.2" y2="210.1" stroke="#b01e24" stroke-width="2.4"/>
<line x1="450" y1="300" x2="478.1" y2="255.1" stroke="#b01e24" stroke-width="2.4"/>
<line x1="550" y1="300" x2="550.0" y2="300.0" stroke="#b01e24" stroke-width="2.4"/>
<line x1="262.3" y1="120.2" x2="550" y2="300" stroke="#b01e24" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="34" y="58" font-size="13.5" font-weight="700" fill="#b01e24">equal-phase front</text>
<text x="34" y="78" font-size="12.5" fill="#b01e24">red = extra path each element adds</text>

<g>
<circle cx="150" cy="300" r="11" fill="#004a85"/><text x="150" y="340" font-size="12.5" fill="#004a85" text-anchor="middle">0</text><circle cx="250" cy="300" r="11" fill="#004a85"/><text x="250" y="340" font-size="12.5" fill="#004a85" text-anchor="middle">1</text><circle cx="350" cy="300" r="11" fill="#004a85"/><text x="350" y="340" font-size="12.5" fill="#004a85" text-anchor="middle">2</text><circle cx="450" cy="300" r="11" fill="#004a85"/><text x="450" y="340" font-size="12.5" fill="#004a85" text-anchor="middle">3</text><circle cx="550" cy="300" r="11" fill="#004a85"/><text x="550" y="340" font-size="12.5" fill="#004a85" text-anchor="middle">4</text>
</g>
<line x1="150" y1="362" x2="250" y2="362" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#l16grey)" marker-end="url(#l16grey)"/>
<text x="200.0" y="380" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">d</text>
<text x="660" y="344" font-size="12.5" fill="#5a5a5a">element number</text>
</g>
</svg>
