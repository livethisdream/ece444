<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Inter, system-ui, -apple-system, sans-serif" role="img" aria-label="Two current elements a distance d apart on the z axis, seen from far away in direction theta. The two rays to the observer are parallel; the lower element's wave travels d cos theta farther than the upper one's.">
<defs>
  <marker id="tsNavy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#004a85"/></marker>
  <marker id="tsGrey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a5a5a"/></marker>
</defs>

<!-- z axis through the two elements -->
<line x1="120" y1="285" x2="120" y2="30" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#tsGrey)"/>
<text x="130" y="38" font-size="14" font-style="italic" fill="#5a5a5a">z</text>

<!-- the two rays, parallel, toward P (theta = 75 degrees from +z) -->
<line x1="120" y1="120" x2="526" y2="11.2" stroke="#004a85" stroke-width="1.8" marker-end="url(#tsNavy)"/>
<line x1="120" y1="240" x2="526" y2="131.2" stroke="#004a85" stroke-width="1.8" marker-end="url(#tsNavy)"/>
<text x="540" y="16" font-size="13" font-weight="700" fill="#004a85">to P, far away</text>
<text x="540" y="136" font-size="13" font-weight="700" fill="#004a85">to P, far away</text>

<!-- the wavefront through element 1, perpendicular to the rays, meeting ray 2 -->
<line x1="120" y1="120" x2="150" y2="231.9" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="5 4"/>
<!-- right-angle mark at the foot -->
<path d="M141.5 227.3 L143.8 218.9 L152.3 221.2" fill="none" stroke="#5a5a5a" stroke-width="1"/>

<!-- the extra path, from element 2 to the foot: d cos theta -->
<line x1="120" y1="240" x2="150" y2="231.9" stroke="#b01e24" stroke-width="4.5" stroke-linecap="round"/>
<text x="158" y="258" font-size="14" font-weight="700" fill="#b01e24">d cos θ</text>

<!-- the angle theta at element 2, from +z to the ray -->
<path d="M120 200 A40 40 0 0 1 158.6 229.6" fill="none" stroke="#0067b9" stroke-width="1.4"/>
<text x="136" y="204" font-size="15" font-style="italic" fill="#0067b9">θ</text>

<!-- the two elements -->
<circle cx="120" cy="120" r="6" fill="#b01e24"/>
<circle cx="120" cy="240" r="6" fill="#b01e24"/>
<text x="96" y="125" font-size="13" font-weight="700" fill="#b01e24">1</text>
<text x="96" y="245" font-size="13" font-weight="700" fill="#b01e24">2</text>

<!-- the spacing d -->
<line x1="66" y1="120" x2="66" y2="240" stroke="#5a5a5a" stroke-width="1.2" marker-start="url(#tsGrey)" marker-end="url(#tsGrey)"/>
<text x="44" y="185" font-size="15" font-style="italic" fill="#5a5a5a">d</text>
</svg>
