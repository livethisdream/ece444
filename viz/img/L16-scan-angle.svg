<svg font-family="'Source Sans Pro', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An array on a horizontal axis with broadside straight up. One ray leaves at 35 degrees from broadside. The scan angle is measured from broadside to the ray; the Module 1 polar angle is measured from the array axis to the same ray, 55 degrees">
<defs>
<marker id="l16sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0067b9"/></marker>
<marker id="l16sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a5a5a"/></marker>
</defs>
<line x1="70" y1="300" x2="590" y2="300" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#l16sg)"/>
<text x="580" y="326" font-size="13" fill="#5a5a5a" text-anchor="end">array axis (+z in Module 1)</text>
<circle cx="192" cy="300" r="8" fill="#004a85"/><circle cx="238" cy="300" r="8" fill="#004a85"/><circle cx="284" cy="300" r="8" fill="#004a85"/><circle cx="330" cy="300" r="8" fill="#004a85"/><circle cx="376" cy="300" r="8" fill="#004a85"/><circle cx="422" cy="300" r="8" fill="#004a85"/><circle cx="468" cy="300" r="8" fill="#004a85"/>
<line x1="330" y1="300" x2="330" y2="70" stroke="#5a5a5a" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#l16sg)"/>
<text x="320" y="130" font-size="13" fill="#5a5a5a" text-anchor="end">broadside</text>
<line x1="330" y1="300" x2="450.5" y2="128.0" stroke="#0067b9" stroke-width="2.4" marker-end="url(#l16sa)"/>
<text x="460.5" y="132.0" font-size="13" fill="#0067b9">toward the observer</text>
<path d="M 330 208 A 92 92 0 0 1 382.8 224.6" fill="none" stroke="#004a85" stroke-width="2"/>
<text x="364.3" y="191.3" font-size="15" font-weight="700" fill="#004a85" text-anchor="middle">&#952;</text>
<path d="M 470 300 A 140 140 0 0 0 410.3 185.3" fill="none" stroke="#8a5a00" stroke-width="2"/>
<text x="475.5" y="224.3" font-size="15" font-weight="700" fill="#8a5a00">&#952;<tspan font-size="11" dy="4">polar</tspan></text>
<text x="40" y="44" font-size="13.5" font-weight="700" fill="#004a85">&#952;: scan angle, from broadside (Module 3)</text>
<text x="40" y="66" font-size="13.5" font-weight="700" fill="#8a5a00">&#952;<tspan font-size="10.5" dy="3">polar</tspan><tspan dy="-3">: from the array axis (Module 1)</tspan></text>
<text x="40" y="88" font-size="12.5" fill="#5a5a5a">The two angles add to 90&#176;. Here 35&#176; and 55&#176;.</text>
</svg>
