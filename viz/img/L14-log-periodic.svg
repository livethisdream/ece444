<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="513.792pt" height="358.56pt" viewBox="0 0 513.792 358.56" xmlns="http://www.w3.org/2000/svg" version="1.1" role="img" aria-label="The same log-periodic dipole array, ten dipoles shrinking toward the front, drawn at two frequencies. At the low frequency the few long elements near half a wavelength radiate and the shorter ones ahead act as directors; at the high frequency the active region has slid to the short end and the longer ones behind act as reflectors. The beam points toward the short end both times">
