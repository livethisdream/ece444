<line x1="338" y1="170" x2="462" y2="170" stroke="#004a85" stroke-width="3"/>
<text x="400" y="210" fill="#5a5a5a" font-size="17" text-anchor="middle">patch</text>

<!-- 4. pyramidal horn (cx 560) -->
<rect x="498" y="94" width="38" height="32" fill="rgba(0,103,185,0.08)" stroke="#004a85" stroke-width="2.4"/>
<path d="M536 94 L616 52 L616 168 L536 126 Z" fill="rgba(0,103,185,0.08)" stroke="#004a85" stroke-width="2.4" stroke-linejoin="round"/>
