<line x1="80" y1="119" x2="58" y2="119" stroke="#004a85" stroke-width="1.8"/>
<text x="80" y="210" fill="#5a5a5a" font-size="17" text-anchor="middle">dipole</text>

<!-- 2. monopole over ground (cx 240) -->
<line x1="240" y1="48" x2="240" y2="146" stroke="#004a85" stroke-width="6" stroke-linecap="round"/>
<circle cx="240" cy="146" r="3.6" fill="#004a85"/>
