<line x1="232" y1="152" x2="224" y2="164"/>
<line x1="254" y1="152" x2="246" y2="164"/>
<line x1="268" y1="152" x2="260" y2="164"/>
<line x1="282" y1="152" x2="274" y2="164"/>
<line x1="296" y1="152" x2="288" y2="164"/>
</g>
<line x1="240" y1="152" x2="240" y2="176" stroke="#004a85" stroke-width="1.8"/>
<circle cx="240" cy="176" r="3.2" fill="none" stroke="#004a85" stroke-width="1.8"/>
<text x="240" y="210" fill="#5a5a5a" font-size="17" text-anchor="middle">monopole</text>

<!-- 3. microstrip patch (cx 400) -->
<rect x="338" y="52" width="124" height="112" rx="3" fill="rgba(0,103,185,0.06)" stroke="#cddce9" stroke-width="2"/>
