<!-- 5. Yagi-Uda (cx 720) -->
<line x1="664" y1="110" x2="782" y2="110" stroke="#004a85" stroke-width="3.4" stroke-linecap="round"/>
<g stroke="#004a85" stroke-width="5" stroke-linecap="round">
