<svg font-family="'Source Sans Pro', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A dipole beside its complement, a slot in a conducting sheet. On the dipole the current runs along the wire, largest at the center feed and zero at the open ends. On the slot the electric field runs across the gap, largest at the center feed and zero at the ends, where the metal shorts the gap">
