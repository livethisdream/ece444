<svg font-family="'Source Sans Pro', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three horns with the same flare length and mouths too narrow, optimum, and too wide. Their edges lag the center by a sixteenth, a quarter, and three quarters of a wavelength. Under each, the strips of the mouth add as arrows head to tail, each turned by its lag: the narrow mouth has few arrows in a straight line, the optimum has more arrows that curve a little, and the too-wide mouth has so many that the chain curls back and the total shrinks. The optimum has the highest gain; the narrow mouth is about 2 dB lower and the wide one about 6 dB lower">
