<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yagi, switched on</title>
<!-- Time-domain superposition of prescribed element currents, not a coupled
     solution. Each parasite switches on when the driven element's wavefront
     reaches it; the reflector's phase is the back-null phase of the
     two-element frame (108 degrees at 0.2 wavelength), and the directors'
     phases make a wave along the boom slightly slower than light. -->
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573;
          --amber:#8a5a00; --red:#b01e24; --grn:#3f7d34; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:flex; flex-direction:column; gap:10px; padding:14px; }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px; }
  /* Field map and strip chart side by side above ~650px; stacked on a phone,
     where each gets a shorter design box so the stack still fits. */
  .cv2 { display:grid; grid-template-columns:1.25fr 1fr; gap:10px; }
  @media (max-width:650px) { .cv2 { grid-template-columns:1fr; } }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px;
              padding:7px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  .seg { display:flex; border:1px solid var(--edge2); border-radius:5px; overflow:hidden; }
  .seg button { font:inherit; font-size:11.5px; font-weight:600; color:var(--navy); background:#fff;
                border:0; border-right:1px solid var(--edge2); padding:4px 9px; cursor:pointer; white-space:nowrap; }
  .seg button:last-child { border-right:0; }
  .seg button[aria-pressed="true"] { background:var(--navy); color:#fff; }
  .btn { font:inherit; font-size:11.5px; font-weight:600; color:var(--navy); background:#fff;
         border:1px solid var(--edge2); border-radius:5px; padding:4px 10px; cursor:pointer; white-space:nowrap; }
  .btn:hover, .seg button:hover:not([aria-pressed="true"]) { background:#eef4fa; }
  .ctl { display:flex; align-items:center; gap:6px; flex:1 1 150px; min-width:0; }
  .ctl label { font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl input[type=range] { flex:1 1 auto; min-width:40px; width:0; margin:0; }
  .ctl .val { color:var(--navy); font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:600; font-size:12px; min-width:5.5ch; text-align:right; }
  .readouts { display:grid; gap:8px; grid-template-columns:repeat(4, minmax(0,1fr)); }
  @media (max-width:640px) { .readouts { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .ro { display:flex; flex-direction:column; align-items:center; gap:4px; padding:7px 8px 8px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  @media (max-width:600px) { .ro { gap:2px; padding:5px 6px 6px; } }
  .ro .k { display:block; text-align:center; height:15px; line-height:15px; font-size:10.5px; font-weight:700;
           text-transform:uppercase; letter-spacing:0.045em; color:var(--ink3); white-space:nowrap; overflow:hidden; }
  .ro .v { height:19px; line-height:19px; font-size:14.5px; font-weight:700; white-space:nowrap;
           font-variant-numeric:tabular-nums; text-align:center; color:var(--navy); }
  .ro.fw { background:rgba(63,125,52,0.10); border-color:rgba(63,125,52,0.30); }
  .ro.fw .v { color:var(--grn); }
  .ro.bk { background:rgba(138,90,0,0.10); border-color:rgba(138,90,0,0.30); }
  .ro.bk .v { color:var(--amber); }
</style>
</head>
<body>
<div class="app">
  <div class="cv2">
    <canvas id="map" aria-label="Top view of the antenna with the instantaneous radiated field drawn in color: the driven element switches on first, and each parasitic element switches on when the driven element's wave reaches it"></canvas>
    <canvas id="chart" aria-label="Field against time at a probe in front of the antenna and at a probe behind it"></canvas>
  </div>

  <div class="controls">
    <div class="seg" role="group" aria-label="Elements">
      <button type="button" data-mode="driven" aria-pressed="false">driven only</button>
      <button type="button" data-mode="reflector" aria-pressed="true">+ reflector</button>
      <button type="button" data-mode="yagi" aria-pressed="false">full Yagi</button>
    </div>
    <button type="button" class="btn" id="play">pause</button>
    <button type="button" class="btn" id="restart">restart</button>
    <div class="ctl">
      <label for="spd">Speed</label>
      <input type="range" id="spd" min="0.1" max="1.0" step="0.05" value="0.4">
      <span class="val" id="spd-val">0.40×</span>
    </div>
  </div>

  <div class="readouts">
    <div class="ro"><span class="k">time</span><span class="v" id="r-t">&#8212;</span></div>
    <div class="ro fw"><span class="k">front probe</span><span class="v" id="r-f">&#8212;</span></div>
    <div class="ro bk"><span class="k">back probe</span><span class="v" id="r-b">&#8212;</span></div>
    <div class="ro"><span class="k">front-to-back</span><span class="v" id="r-fb">&#8212;</span></div>
  </div>
</div>

<script>
'use strict';
const SANS = "Inter, system-ui, -apple-system, sans-serif";
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const el = id => document.getElementById(id);
const D2R = Math.PI / 180, TAU = 2 * Math.PI;
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));

// ---- the model -------------------------------------------------------------
// Units: wavelength = 1, period = 1, so c = 1. The beam is toward +x.
// Element i at x_i carries I_i(tau) = a_i cos(2 pi tau + alpha_i), switched on
// (over half a period) at t_on_i = |x_i|, the moment the driven element's
// wavefront reaches it. Its field at distance r is I_i(t - r) / sqrt(r): a 2-D
// cylindrical wave, since the elements stand out of the page.
const SPACING = 0.25, DELTA = 20;   // director spacing (wavelengths), extra lag per director (deg)
function elements(mode) {
  const els = [{ x: 0, a: 1, al: 0, kind: 'driven' }];
  if (mode !== 'driven') els.push({ x: -0.2, a: 1, al: 108, kind: 'reflector' });
  if (mode === 'yagi') [0.8, 0.7, 0.6].forEach((a, i) => {
    const n = i + 1, x = n * SPACING;
    els.push({ x, a, al: -360 * x - n * DELTA, kind: 'director' });
  });
  els.forEach(e => { e.ton = Math.abs(e.x); e.alr = e.al * D2R; });
  return els;
}
const ramp = s => s <= 0 ? 0 : s >= 0.5 ? 1 : 0.5 - 0.5 * Math.cos(TAU * s);
function current(e, tau) { return e.a * Math.cos(TAU * tau + e.alr) * ramp(tau - e.ton); }
function fieldAt(els, x, y, t) {
  let s = 0;
  for (const e of els) {
    const r = Math.hypot(x - e.x, y);
    const tau = t - r;
    if (tau <= e.ton) continue;
    s += current(e, tau) / Math.sqrt(r + 0.15);
  }
  return s;
}
// steady-state amplitude toward the front (+x) and the back (-x)
function steady(els, dir) {
  let re = 0, im = 0;
  for (const e of els) { const p = e.alr + dir * TAU * e.x; re += e.a * Math.cos(p); im += e.a * Math.sin(p); }
  return Math.hypot(re, im);
}

// ---- state -----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const state = {
  mode: ['driven', 'reflector', 'yagi'].includes(params.get('mode')) ? params.get('mode') : 'reflector',
  t: 0, speed: 0.4, playing: true, visible: true,
};
let ELS = elements(state.mode);
const TMAX = 9;                     // periods shown on the strip chart
let hist = [];                      // [t, front, back]
let PROBE = 2;                      // probe distance, set from the map's extent

function setMode(m) {
  state.mode = m; ELS = elements(m);
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  restart();
}
function restart() { state.t = 0; hist = []; draw(); }
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
el('restart').addEventListener('click', () => { restart(); if (!state.playing) togglePlay(); });
function togglePlay() { state.playing = !state.playing; el('play').textContent = state.playing ? 'pause' : 'play'; if (state.playing) kick(); }
el('play').addEventListener('click', togglePlay);
el('spd').addEventListener('input', e => { state.speed = +e.target.value; el('spd-val').textContent = state.speed.toFixed(2) + '×'; });

// ---- canvases ----------------------------------------------------------------
const map = el('map'), mctx = map.getContext('2d');
const chart = el('chart'), cctx = chart.getContext('2d');
const PHONE = window.matchMedia ? window.matchMedia('(max-width:650px)') : null;
const stacked = () => !!(PHONE && PHONE.matches);
function fitOne(cv, h) {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(200, cv.clientWidth || Math.floor(cv.getBoundingClientRect().width));
  h = Math.round(h);
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  cv.style.height = h + 'px';
  const bh = cv.offsetHeight - cv.clientHeight;
  if (bh) cv.style.height = (h + bh) + 'px';
  cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w, h };
}
function heights() {
  const w = map.clientWidth || 300;
  if (stacked()) return { hm: clamp(w * 0.52, 170, 205), hc: clamp(w * 0.42, 135, 160) };
  const H = clamp(w * 0.62, 220, 280);
  return { hm: H, hc: H };
}
window.addEventListener('resize', () => draw());

// low-resolution field buffer, scaled up with smoothing
const buf = document.createElement('canvas'), bctx = buf.getContext('2d');
const CELL = 3;
function vmax() { return Math.max(1.1, 0.75 * steady(ELS, +1)); }
function colorOf(v, lim) {
  const u = clamp(v / lim, -1, 1), m = Math.abs(u);
  // red for positive, navy for negative, white at zero
  return u >= 0 ? [255 - m * (255 - 176), 255 - m * (255 - 30), 255 - m * (255 - 36)]
                : [255 - m * 255, 255 - m * (255 - 74), 255 - m * (255 - 133)];
}

function drawMap(hDesign) {
  const { w, h } = fitOne(map, hDesign);
  const ctx = mctx;
  const keyH = 22;                                  // legend strip along the bottom
  const fh = h - keyH;
  const X = Math.max(2.0, 2.4 * w / Math.max(w, fh * 1.6)), sc = w / (2 * X);   // px per wavelength
  const Y = fh / 2 / sc;
  PROBE = X - 0.35;
  const bw = Math.ceil(w / CELL), bhh = Math.ceil(fh / CELL);
  if (buf.width !== bw || buf.height !== bhh) { buf.width = bw; buf.height = bhh; }
  const img = bctx.createImageData(bw, bhh), d = img.data, lim = vmax();
  for (let j = 0; j < bhh; j++) {
    const y = Y - (j + 0.5) * CELL / sc;
    for (let i = 0; i < bw; i++) {
      const x = -X + (i + 0.5) * CELL / sc;
      const r0 = Math.hypot(x, y);
      const v = fieldAt(ELS, x, y, state.t) * Math.sqrt(r0 + 0.15);
      const [R, G, B] = colorOf(v, lim), k = 4 * (j * bw + i);
      d[k] = R; d[k + 1] = G; d[k + 2] = B; d[k + 3] = 255;
    }
  }
  bctx.putImageData(img, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(buf, 0, 0, bw * CELL, bhh * CELL);
  const px = x => w / 2 + x * sc, cy = fh / 2;

  // boom, elements (hollow until switched on), probes
  ctx.strokeStyle = 'rgba(21,32,43,0.35)'; ctx.lineWidth = 1.2;
  const xs = ELS.map(e => e.x);
  ctx.beginPath(); ctx.moveTo(px(Math.min(...xs)) - 4, cy); ctx.lineTo(px(Math.max(...xs)) + 4, cy); ctx.stroke();
  const colOf = k => k === 'driven' ? cssVar('--navy') : k === 'reflector' ? cssVar('--amber') : cssVar('--grn');
  for (const e of ELS) {
    const on = state.t > e.ton;
    ctx.beginPath(); ctx.arc(px(e.x), cy, 4.2, 0, 7);
    ctx.fillStyle = on ? colOf(e.kind) : '#fff'; ctx.fill();
    ctx.lineWidth = 1.6; ctx.strokeStyle = colOf(e.kind); ctx.stroke();
  }
  ctx.font = '700 11px ' + SANS; ctx.textBaseline = 'middle';
  [[+1, 'front'], [-1, 'back']].forEach(([s, t]) => {
    const x = px(s * PROBE);
    ctx.strokeStyle = cssVar('--ink'); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x - 5, cy - 5); ctx.lineTo(x + 5, cy + 5); ctx.moveTo(x + 5, cy - 5); ctx.lineTo(x - 5, cy + 5); ctx.stroke();
    ctx.textAlign = 'center';
    const tx = clamp(x, 34, w - 34);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round';
    ctx.strokeText(t + ' probe', tx, cy - 15); ctx.fillStyle = s > 0 ? cssVar('--grn') : cssVar('--amber');
    ctx.fillText(t + ' probe', tx, cy - 15);
  });
  // one wavelength, for scale
  ctx.strokeStyle = cssVar('--ink3'); ctx.lineWidth = 1.2;
  const lx = 10, ly = fh - 10;
  ctx.beginPath(); ctx.moveTo(lx, ly - 3); ctx.lineTo(lx, ly + 3); ctx.moveTo(lx, ly); ctx.lineTo(lx + sc, ly);
  ctx.moveTo(lx + sc, ly - 3); ctx.lineTo(lx + sc, ly + 3); ctx.stroke();
  ctx.font = '10.5px ' + SANS; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = cssVar('--ink');
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.strokeText('one wavelength', lx + sc / 2, ly - 4); ctx.fillText('one wavelength', lx + sc / 2, ly - 4);
  ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.fillStyle = cssVar('--ink3');
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.strokeText('top view', w - 7, 6); ctx.fillText('top view', w - 7, 6);

  // key: hollow = not yet reached, filled = radiating
  ctx.fillStyle = '#fff'; ctx.fillRect(0, fh, w, keyH);
  ctx.strokeStyle = cssVar('--edge'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, fh + 0.5); ctx.lineTo(w, fh + 0.5); ctx.stroke();
  const keys = [['driven', 'driven'], ['reflector', 'reflector']];
  if (state.mode === 'yagi') keys.push(['director', 'directors']);
  ctx.font = '600 11px ' + SANS; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  let kx = 10; const ky = fh + keyH / 2;
  keys.forEach(([k, t]) => {
    if (k === 'reflector' && state.mode === 'driven') return;
    ctx.fillStyle = colOf(k); ctx.beginPath(); ctx.arc(kx + 4, ky, 4, 0, 7); ctx.fill();
    ctx.fillText(t, kx + 12, ky + 0.5); kx += 20 + ctx.measureText(t).width;
  });
  ctx.fillStyle = cssVar('--ink3'); ctx.font = '10.5px ' + SANS;
  const note = 'hollow: not reached yet';
  if (kx + ctx.measureText(note).width + 10 < w) { ctx.textAlign = 'right'; ctx.fillText(note, w - 8, ky + 0.5); }
}

function drawChart(hDesign) {
  const { w, h } = fitOne(chart, hDesign);
  const ctx = cctx;
  ctx.clearRect(0, 0, w, h);
  const mL = 30, mR = 10, mT = 24, mB = 30;
  const pw = w - mL - mR, ph = h - mT - mB;
  const lim = Math.ceil(Math.max(1.2, steady(ELS, +1) * 1.1) * 2) / 2;
  const t1 = Math.max(TMAX, state.t), t0 = t1 - TMAX;
  const X = t => mL + (t - t0) / TMAX * pw, Y = v => mT + ph / 2 - v / lim * ph / 2;
  ctx.strokeStyle = '#e6edf3'; ctx.lineWidth = 1;
  ctx.font = '10.5px ' + SANS; ctx.fillStyle = cssVar('--ink3');
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let k = Math.ceil(t0); k <= t1 + 1e-9; k++) {
    ctx.beginPath(); ctx.moveTo(X(k), mT); ctx.lineTo(X(k), mT + ph); ctx.stroke();
    if (k % (pw < 220 ? 2 : 1) === 0) ctx.fillText(String(k), X(k), mT + ph + 4);
  }
  ctx.fillText('time (periods)', mL + pw / 2, mT + ph + 16);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  [-lim, 0, lim].forEach(v => {
    ctx.strokeStyle = v === 0 ? '#c9d6e3' : '#e6edf3';
    ctx.beginPath(); ctx.moveTo(mL, Y(v)); ctx.lineTo(mL + pw, Y(v)); ctx.stroke();
    ctx.fillText(String(v).replace('-', '−'), mL - 4, Y(v));
  });
  ctx.save(); ctx.beginPath(); ctx.rect(mL, mT, pw, ph); ctx.clip();
  [[1, cssVar('--grn'), 2], [2, cssVar('--amber'), 2]].forEach(([k, c, lw]) => {
    ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.beginPath();
    let started = false;
    for (const p of hist) { if (p[0] < t0) continue; const x = X(p[0]), y = Y(p[k]); started ? ctx.lineTo(x, y) : ctx.moveTo(x, y); started = true; }
    ctx.stroke();
  });
  ctx.restore();
  ctx.font = '700 11px ' + SANS; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillStyle = cssVar('--grn'); ctx.fillText('front probe', mL, 11);
  const fw = ctx.measureText('front probe').width;
  ctx.fillStyle = cssVar('--amber'); ctx.fillText('back probe', mL + fw + 16, 11);
}

// envelope over the last period at each probe
function envelope(k) {
  let m = 0;
  for (let i = hist.length - 1; i >= 0 && hist[i][0] > state.t - 1; i--) m = Math.max(m, Math.abs(hist[i][k]));
  return m;
}
function updateReadouts() {
  el('r-t').textContent = state.t.toFixed(1) + ' periods';
  const f = envelope(1), b = envelope(2);
  el('r-f').textContent = f.toFixed(2);
  el('r-b').textContent = b.toFixed(2);
  // measured at the probes, once every element's wave has reached both of
  // them; until then the ratio is not yet defined
  const settled = state.t > PROBE + Math.max(...ELS.map(e => e.ton)) + 1.5;
  let fb = '\u2014';
  if (settled) fb = b < 1e-2 * f ? '> 40 dB' : (20 * Math.log10(f / b)).toFixed(1).replace('-', '\u2212') + ' dB';
  el('r-fb').textContent = fb;
}

function sample() {
  const c = Math.sqrt(PROBE + 0.15);
  hist.push([state.t, fieldAt(ELS, PROBE, 0, state.t) * c, fieldAt(ELS, -PROBE, 0, state.t) * c]);
  while (hist.length && hist[0][0] < state.t - TMAX - 1) hist.shift();
}
function draw() {
  const H = heights();
  drawMap(H.hm);
  if (!hist.length || hist[hist.length - 1][0] !== state.t) sample();
  drawChart(H.hc); updateReadouts();
}

// ---- animation: runs only while playing and on screen -----------------------
let last = null, raf = 0;
function frame(ts) {
  raf = 0;
  if (!state.playing || !state.visible) { last = null; return; }
  if (last !== null) {
    const dt = Math.min(0.1, (ts - last) / 1000) * state.speed;
    // sample the probes finely so the chart is smooth at any speed
    const n = Math.max(1, Math.ceil(dt / 0.02));
    for (let i = 0; i < n; i++) { state.t += dt / n; sample(); }
  }
  last = ts;
  draw();
  kick();
}
function kick() { if (!raf) raf = requestAnimationFrame(frame); }
if ('IntersectionObserver' in window) {
  new IntersectionObserver(es => { state.visible = es[0].isIntersecting; if (state.visible) kick(); })
    .observe(document.querySelector('.app'));
}
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) togglePlay();
setMode(state.mode);
kick();
</script>
</body>
</html>
