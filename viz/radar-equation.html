<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar equation and SNR versus range</title>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573;
          --pr:#004a85; --noise:#b01e24; --thr:#8a5a00; --marker:#1d7a4d; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:flex; flex-direction:column; gap:8px; padding:12px; }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px; }
  .controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:6px 18px; align-items:center;
              padding:8px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  .ctl { display:flex; align-items:center; gap:8px; min-width:0; overflow:hidden; }
  .ctl label { font-size:12.5px; color:var(--ink3); font-weight:700; white-space:nowrap; min-width:30px; }
  .ctl .val { color:var(--navy); font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:64px; text-align:right; }
  .ctl input[type=range]{ flex:1 1 auto; min-width:56px; accent-color:var(--mid); }
  .ctl select { flex:1 1 auto; min-width:0; font:600 12.5px Inter,system-ui,sans-serif; color:var(--navy);
                padding:4px 6px; border:1px solid var(--edge2); border-radius:6px; background:#fff; }
  @media (min-width:640px) { .ctl.wide { grid-column:span 2; } }
  .readouts { display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); }
  .ro { display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 8px 7px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  .ro .k { display:block; text-align:center; height:15px; line-height:15px; font-size:10.5px; font-weight:700;
           text-transform:uppercase; letter-spacing:0.045em; color:var(--ink3); white-space:nowrap; overflow:hidden; }
  .ro .v { height:19px; line-height:19px; font-size:14.5px; font-weight:700; white-space:nowrap;
           font-variant-numeric:tabular-nums; text-align:center; color:var(--navy); }
  .ro.snr { background:rgba(29,122,77,0.10); border-color:rgba(29,122,77,0.30); }
  .ro.snr .v { color:var(--marker); }
</style>
</head>
<body>
<div class="app">
  <canvas id="plot" aria-label="Received power and noise floor versus range"></canvas>

  <div class="controls">
    <div class="ctl wide">
      <label for="tgt">Target</label>
      <select id="tgt">
        <option value="corner" selected>Corner, 10 cm</option>
        <option value="plate">Plate, 10 cm</option>
        <option value="sphere">Sphere, 10 cm</option>
        <option value="person">Person</option>
        <option value="drone">Small drone</option>
      </select>
      <span class="val" id="tgt-v">&minus;3.3 dBsm</span>
    </div>
    <div class="ctl">
      <label for="rng"><i>R</i></label>
      <input type="range" id="rng" min="0" max="1000" step="1" value="477">
      <span class="val" id="rng-v">3.0 m</span>
    </div>
    <div class="ctl">
      <label for="pt"><i>P</i><sub>t</sub></label>
      <input type="range" id="pt" min="-30" max="30" step="1" value="-16">
      <span class="val" id="pt-v">&minus;16 dBm</span>
    </div>
    <div class="ctl">
      <label for="gr"><i>G</i><sub>r</sub></label>
      <input type="range" id="gr" min="0" max="30" step="0.5" value="15">
      <span class="val" id="gr-v">15.0 dBi</span>
    </div>
    <div class="ctl">
      <label for="nf"><i>F</i></label>
      <input type="range" id="nf" min="0" max="10" step="0.5" value="2">
      <span class="val" id="nf-v">2.0 dB</span>
    </div>
    <div class="ctl">
      <label for="bw"><i>B</i></label>
      <input type="range" id="bw" min="0" max="4" step="1" value="3">
      <span class="val" id="bw-v">1 MHz</span>
    </div>
  </div>

  <div class="readouts">
    <div class="ro"><span class="k">received</span><span class="v" id="r-pr">&mdash;</span></div>
    <div class="ro"><span class="k">noise</span><span class="v" id="r-n">&mdash;</span></div>
    <div class="ro snr"><span class="k">SNR</span><span class="v" id="r-snr">&mdash;</span></div>
    <div class="ro"><span class="k">max range</span><span class="v" id="r-rmax">&mdash;</span></div>
  </div>
</div>

<script>
'use strict';
/* The radar equation in decibels, for the course setup of Lesson 25:
     Pr = Pt + Gt + Gr + 10 log(lambda^2) + sigma - 10 log((4 pi)^3) - 40 log R
     N  = 10 log(k T0) + 10 log B + F           (antenna sees 290 K)
   10 GHz (COURSE_SPEC M8), the 6 dBi transmit antenna fixed. The detection threshold is
   SNR = 13 dB, and max range is where Pr crosses N + 13 dB. Query string
   presets: ?target=person&R=10 */
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const el = id => document.getElementById(id);
const db = x => 10*Math.log10(x);
const C = 3e8, F0 = 10.0e9, LAM = C/F0, GT = 6.0, KT0 = db(1.380649e-23*290*1e3), THR = 13;
const FOURPI3 = db(Math.pow(4*Math.PI,3));
const RMIN = 0.3, RMAX = 100;                  // m, log axis
const SIGMA = { corner:-3.32, plate:1.45, sphere:-21.049, person:0.0, drone:-20.0 };   // 10 cm shapes at 10 GHz, unrounded
const BWS = [1e3, 1e4, 1e5, 1e6, 1e7];
const BWL = ['1 kHz','10 kHz','100 kHz','1 MHz','10 MHz'];
const state = { tgt:'corner', R:3.0, Pt:-16, Gr:15, F:2, bw:3 };

const sliderToR = v => RMIN*Math.pow(RMAX/RMIN, v/1000);
const rToSlider = R => Math.round(1000*Math.log(R/RMIN)/Math.log(RMAX/RMIN));
const fmtDb = (x,u) => (x<0?'−':'')+Math.abs(x).toFixed(1)+' '+u;
const fmtR = R => R<100 ? R.toFixed(1)+' m' : R<1000 ? R.toFixed(0)+' m' : (R/1000).toFixed(1)+' km';

function pr(R){ return state.Pt + GT + state.Gr + db(LAM*LAM) + SIGMA[state.tgt] - FOURPI3 - 40*Math.log10(R); }
function noise(){ return KT0 + db(BWS[state.bw]) + state.F; }
function rmax(){ return Math.pow(10, (pr(1) - noise() - THR)/40); }

(function preset(){
  const q = new URLSearchParams(location.search);
  if (q.has('target') && SIGMA[q.get('target')]!==undefined) state.tgt = q.get('target');
  if (q.has('R')) { const r=parseFloat(q.get('R')); if (r>=RMIN && r<=RMAX) state.R=r; }
  el('tgt').value = state.tgt; el('rng').value = rToSlider(state.R);
})();

el('tgt').addEventListener('change', e => { state.tgt = e.target.value; draw(); });
el('rng').addEventListener('input', e => { state.R = sliderToR(+e.target.value); draw(); });
el('pt').addEventListener('input', e => { state.Pt = +e.target.value; draw(); });
el('gr').addEventListener('input', e => { state.Gr = +e.target.value; draw(); });
el('nf').addEventListener('input', e => { state.F = +e.target.value; draw(); });
el('bw').addEventListener('input', e => { state.bw = +e.target.value; draw(); });

const canvas = el('plot'), ctx = canvas.getContext('2d');
function cvWidth(cv){ return Math.max(240, cv.clientWidth || Math.floor(cv.getBoundingClientRect().width)); }
function setSize(cv,wCss,hCss,dpr){
  cv.width=Math.round(wCss*dpr); cv.height=Math.round(hCss*dpr);
  cv.style.height=hCss+'px';
  const bh=cv.offsetHeight-cv.clientHeight;
  if(bh) cv.style.height=(hCss+bh)+'px';
}
/* Below DESIGN_W the whole composition scales down together. On a phone the
   controls stack into one column, so the canvas takes a shorter design box. */
const DESIGN_W=360;
let SCL=1;
const NARROW = window.matchMedia ? window.matchMedia('(max-width:430px)') : null;
function fit(){
  const dpr=window.devicePixelRatio||1;
  const wCss=cvWidth(canvas);
  SCL=Math.min(1, wCss/DESIGN_W);
  const w=wCss/SCL;
  let h=Math.max(250, Math.min(w*0.42, 300));
  if (NARROW && NARROW.matches) h = 230;
  setSize(canvas,wCss,h*SCL,dpr);
  ctx.setTransform(dpr*SCL,0,0,dpr*SCL,0,0); draw();
}
window.addEventListener('resize',fit);

function draw(){
  const dpr=window.devicePixelRatio||1, w=canvas.width/(dpr*SCL), h=canvas.height/(dpr*SCL);
  ctx.clearRect(0,0,w,h);
  const mL=50,mR=14,mT=12,mB=38, pW=w-mL-mR, pH=h-mT-mB;
  const YMAX=-20, YMIN=-160;
  const xFor=R=>mL+Math.log(R/RMIN)/Math.log(RMAX/RMIN)*pW;
  const yFor=p=>mT+(YMAX-Math.max(YMIN,Math.min(YMAX,p)))/(YMAX-YMIN)*pH;
  const N=noise(), Rm=rmax(), P=pr(state.R);

  // grid: decades and 20 dB steps
  ctx.strokeStyle='#eef3f8'; ctx.lineWidth=1;
  const decs=[0.3,1,3,10,30,100];
  decs.forEach(R=>{ ctx.beginPath(); ctx.moveTo(xFor(R),mT); ctx.lineTo(xFor(R),mT+pH); ctx.stroke(); });
  for(let p=YMIN;p<=YMAX;p+=20){ ctx.beginPath(); ctx.moveTo(mL,yFor(p)); ctx.lineTo(mL+pW,yFor(p)); ctx.stroke(); }
  ctx.strokeStyle='#cddce9'; ctx.strokeRect(mL,mT,pW,pH);

  ctx.font='10.5px Inter,sans-serif'; ctx.fillStyle='#5b6573';
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let p=YMIN;p<=YMAX;p+=20) ctx.fillText((p<0?'−':'')+Math.abs(p), mL-5, yFor(p));
  ctx.textAlign='center'; ctx.textBaseline='top';
  decs.forEach(R=>ctx.fillText(String(R), xFor(R), mT+pH+4));
  ctx.fillStyle='#3b4651'; ctx.font='600 11.5px Inter,sans-serif';
  ctx.fillText('range (m)', mL+pW/2, mT+pH+19);
  ctx.save(); ctx.translate(12,mT+pH/2); ctx.rotate(-Math.PI/2); ctx.textBaseline='middle';
  ctx.fillText('power (dBm)',0,0); ctx.restore();

  ctx.save(); ctx.beginPath(); ctx.rect(mL,mT,pW,pH); ctx.clip();
  // noise floor and threshold
  ctx.lineWidth=2; ctx.strokeStyle=cssVar('--noise'); ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(mL,yFor(N)); ctx.lineTo(mL+pW,yFor(N)); ctx.stroke();
  ctx.strokeStyle=cssVar('--thr'); ctx.setLineDash([2,3]); ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(mL,yFor(N+THR)); ctx.lineTo(mL+pW,yFor(N+THR)); ctx.stroke();
  ctx.setLineDash([]);
  // received power, -40 dB per decade
  ctx.strokeStyle=cssVar('--pr'); ctx.lineWidth=2.6;
  ctx.beginPath(); ctx.moveTo(xFor(RMIN),yFor(pr(RMIN))); ctx.lineTo(xFor(RMAX),yFor(pr(RMAX))); ctx.stroke();
  // max range
  if (Rm>RMIN && Rm<RMAX){
    ctx.strokeStyle=cssVar('--thr'); ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(xFor(Rm),yFor(N+THR)); ctx.lineTo(xFor(Rm),mT+pH); ctx.stroke();
    ctx.fillStyle=cssVar('--thr'); ctx.beginPath(); ctx.arc(xFor(Rm),yFor(N+THR),3.5,0,7); ctx.fill();
  }
  // SNR bracket at the chosen range
  const x=xFor(state.R);
  ctx.strokeStyle=cssVar('--marker'); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x,yFor(N)); ctx.lineTo(x,yFor(P)); ctx.stroke();
  ctx.fillStyle=cssVar('--marker'); ctx.beginPath(); ctx.arc(x,yFor(P),4.5,0,7); ctx.fill();
  ctx.restore();

  // line labels, kept inside the plot and on the side away from the crossing
  ctx.font='700 11px Inter,sans-serif';
  const yN=yFor(N), yT=yFor(N+THR);
  const leftSide = xFor(Math.min(Math.max(Rm,RMIN),RMAX)) > mL+pW/2;
  const lx = leftSide ? mL+6 : mL+pW-6;
  ctx.textAlign = leftSide ? 'left' : 'right';
  ctx.fillStyle=cssVar('--noise'); ctx.textBaseline='top';
  if (yN+14 < mT+pH) ctx.fillText('noise kT\u2080BF', lx, yN+3);
  ctx.fillStyle=cssVar('--thr'); ctx.textBaseline='bottom';
  if (yT-14 > mT) ctx.fillText('threshold, SNR 13 dB', lx, yT-3);
  // slope label above the line, where the line falls away from it
  ctx.textAlign='left'; ctx.fillStyle=cssVar('--pr');
  const lab = '\u221240 dB per decade';
  const tw = ctx.measureText(lab).width;
  for (const xs of [mL+8, mL+pW-tw-8]) {
    const Rl = RMIN*Math.pow(RMAX/RMIN,(xs-mL)/pW), yl=yFor(pr(Rl));
    const lo = leftSide ? lx : lx-140, hi = leftSide ? lx+140 : lx;   // the line labels' span
    const clear = y => Math.abs(yl-12-y) > 16 || xs+tw < lo || xs > hi;
    if (yl-20 > mT && yl < mT+pH && clear(yT) && clear(yN)) { ctx.fillText(lab, xs, yl-6); break; }
  }

  el('r-pr').textContent = fmtDb(P,'dBm');
  el('r-n').textContent = fmtDb(N,'dBm');
  el('r-snr').textContent = fmtDb(P-N,'dB');
  el('r-rmax').textContent = fmtR(Rm);
  el('rng-v').textContent = fmtR(state.R);
  el('tgt-v').textContent = (SIGMA[state.tgt]>0?'+':'')+fmtDb(SIGMA[state.tgt],'dBsm');
  el('pt-v').textContent = (state.Pt<0?'−':'')+Math.abs(state.Pt)+' dBm';
  el('gr-v').textContent = state.Gr.toFixed(1)+' dBi';
  el('nf-v').textContent = state.F.toFixed(1)+' dB';
  el('bw-v').textContent = BWL[state.bw];
}

fit();
</script>
</body>
</html>
