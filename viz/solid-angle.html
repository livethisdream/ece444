<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radiation intensity — solid angle</title>
<script src="mjlabel.js"></script>
<style>
  :root {
    --navy: #004a85;
    --mid:  #0067b9;
    --edge: #cddce9;
    --edge2:#b9d2e5;
    --bg:   #f5f9fc;
    --ink:  #15202b;
    --ink3: #5b6573;
    --wire: #b9cbdb;
    --cone: #0067b9;
    --cap:  #0067b9;
    --axis: #004a85;
    --pow:  #b3213a;
  }
  html, body { margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif;
               color: var(--ink); background: #fff; }
  .app { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  canvas { display: block; width: 100%; height: auto; background: #fff;
           border: 1px solid var(--edge); border-radius: 6px; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  .panel { font-size: 13.5px; line-height: 1.4; display: grid;
           grid-template-columns: minmax(210px,1fr) minmax(210px,1fr) minmax(200px,1.1fr);
           gap: 12px; align-items: start; }
  @media (max-width: 720px) { .panel { grid-template-columns: 1fr; } }
  .panel h2 { font-size: 12px; font-weight: 700; text-transform: uppercase;
              letter-spacing: 0.08em; color: var(--navy); margin: 0 0 8px; }
  .block { padding: 8px 10px; background: var(--bg); border: 1px solid var(--edge); border-radius: 4px; }
  .block label { display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em;
                 color:var(--ink3); font-weight:700; margin-bottom:4px; }
  .block .val { font-size:13px; font-weight:600; color:var(--navy); font-variant-numeric:tabular-nums; }
  .block input[type=range]{ width:100%; margin:4px 0 0; }
  .btns { display:flex; gap:8px; margin-top:10px; }
  .btns button { flex:1 1 auto; font:600 12px/1 Inter,sans-serif; padding:7px 8px;
                 border:1px solid var(--edge2); border-radius:4px; background:#fff; color:var(--navy); cursor:pointer; }
  .btns button:hover { background: var(--bg); }
  .readout dl { display:grid; grid-template-columns:auto 1fr; gap:5px 10px; margin:0; }
  .readout dt { font-size:11px; text-transform:uppercase; letter-spacing:0.05em; font-weight:700; color:var(--ink3); align-self:center; }
  .readout dd { margin:0; font-size:13.5px; font-weight:700; color:var(--navy); font-variant-numeric:tabular-nums; }
  .note { font-size:11.5px; color:var(--ink3); line-height:1.45; }
  .eq { font-size:13px; color:var(--navy); font-weight:600; margin:2px 0 6px; }
</style>
</head>
<body>
<div class="app">
  <canvas id="scene" aria-label="Sphere with solid-angle cone"></canvas>

  <div class="panel">
    <div class="block">
      <h2>Cone</h2>
      <label>Half-angle \(\alpha\) = <span class="val" id="a-val">20</span>°</label>
      <input type="range" id="alpha" min="3" max="60" step="1" value="20">
      <div class="btns"><button id="reset">Reset view</button></div>
      <div class="note" style="margin-top:8px;">Drag to rotate.</div>
    </div>

    <div class="readout">
      <h2>Solid angle</h2>
      <dl>
        <dt>Half-angle \(\alpha\)</dt>  <dd id="r-a">—</dd>
        <dt>\(\Omega = 2\pi(1-\cos\alpha)\)</dt><dd id="r-omega">—</dd>
        <dt>Patch area</dt>    <dd id="r-area">—</dd>
        <dt>\(\Omega/4\pi\)</dt>        <dd id="r-frac">—</dd>
      </dl>
    </div>

    <div class="readout">
      <h2>Radiation intensity</h2>
      <div class="eq">\(U(\theta,\phi) = dP/d\Omega\) [W/sr]</div>
    </div>
  </div>
</div>

<script>
'use strict';
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---- labels: MathJax for math, sans UI font for words/units ----
const SANS='Inter, system-ui, -apple-system, sans-serif';
const mtext=(ctx,tex,x,y,h,color,align)=>MJ.draw(ctx,tex,x,y,h,color,align);
function stext(ctx,str,x,y,px,color,align,bold){ ctx.fillStyle=color; ctx.font=(bold?'700 ':'')+px+'px '+SANS; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(str,x,y); }

const R = 1.0;                 // sphere radius (world units)
const state = { alpha: 20 * Math.PI / 180, yaw: 0.7, pitch: 0.5 };

// rotate world point by yaw (about Y) then pitch (about X)
function rot(p) {
  const cy = Math.cos(state.yaw),  sy = Math.sin(state.yaw);
  const cx = Math.cos(state.pitch), sx = Math.sin(state.pitch);
  let x = p[0] * cy + p[2] * sy;
  let z = -p[0] * sy + p[2] * cy;
  let y = p[1];
  const y2 = y * cx - z * sx;
  const z2 = y * sx + z * cx;
  return [x, y2, z2];   // z2 = depth toward viewer (+ = front)
}

// ---- controls ----
const alphaEl = document.getElementById('alpha');
const aVal = document.getElementById('a-val');
alphaEl.addEventListener('input', () => {
  state.alpha = parseFloat(alphaEl.value) * Math.PI / 180;
  aVal.textContent = alphaEl.value;
  draw();
});
document.getElementById('reset').addEventListener('click', () => {
  state.yaw = 0.7; state.pitch = 0.5; draw();
});

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

// drag to rotate
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  state.yaw += (e.clientX - lastX) * 0.01;
  state.pitch += (e.clientY - lastY) * 0.01;
  state.pitch = Math.max(-1.4, Math.min(1.4, state.pitch));
  lastX = e.clientX; lastY = e.clientY;
  draw();
});
canvas.addEventListener('pointerup', e => { dragging = false; });
canvas.addEventListener('pointercancel', () => { dragging = false; });

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(360, rect.width);
  const h = Math.max(340, Math.min(w * 0.62, 520));
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.height = `${h}px`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
window.addEventListener('resize', fit);

let CX, CY, S;
function toScreen(p) { const r = rot(p); return [CX + S * r[0], CY - S * r[1], r[2]]; }

function depthAlpha(z) { return 0.12 + 0.88 * ((z / R) + 1) / 2; }

function poly3(points, color, width, closed) {
  // draw a polyline, modulating alpha per segment by midpoint depth
  for (let i = 0; i < points.length - (closed ? 0 : 1); i++) {
    const a = points[i], b = points[(i + 1) % points.length];
    const sa = toScreen(a), sb = toScreen(b);
    ctx.strokeStyle = color;
    ctx.globalAlpha = depthAlpha((sa[2] + sb[2]) / 2);
    ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(sa[0], sa[1]); ctx.lineTo(sb[0], sb[1]); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// boresight axis = +Y (world up). Cap sits at the +Y pole.
function capBoundary(n) {
  const pts = [];
  const ca = Math.cos(state.alpha), sa = Math.sin(state.alpha);
  for (let i = 0; i < n; i++) {
    const ph = (i / n) * 2 * Math.PI;
    pts.push([R * sa * Math.cos(ph), R * ca, R * sa * Math.sin(ph)]);
  }
  return pts;
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width / dpr, h = canvas.height / dpr;
  ctx.clearRect(0, 0, w, h);
  CX = w / 2; CY = h / 2 + 6; S = Math.min(w, h) * 0.34;

  // ---- sphere wireframe (latitudes + longitudes) ----
  const NLAT = 9, NLONG = 12, SEG = 60;
  for (let i = 1; i < NLAT; i++) {
    const th = i * Math.PI / NLAT;
    const y = R * Math.cos(th), rc = R * Math.sin(th);
    const pts = [];
    for (let j = 0; j <= SEG; j++) { const ph = j / SEG * 2 * Math.PI; pts.push([rc * Math.cos(ph), y, rc * Math.sin(ph)]); }
    poly3(pts, cssVar('--wire'), 1, false);
  }
  for (let j = 0; j < NLONG; j++) {
    const ph = j * 2 * Math.PI / NLONG;
    const pts = [];
    for (let i = 0; i <= SEG; i++) { const th = i / SEG * Math.PI; pts.push([R * Math.sin(th) * Math.cos(ph), R * Math.cos(th), R * Math.sin(th) * Math.sin(ph)]); }
    poly3(pts, cssVar('--wire'), 1, false);
  }

  // silhouette outline
  ctx.strokeStyle = cssVar('--edge2'); ctx.globalAlpha = 1; ctx.lineWidth = 1.25;
  ctx.beginPath(); ctx.arc(CX, CY, S * R, 0, 2 * Math.PI); ctx.stroke();

  // ---- cone spokes (origin -> cap boundary) ----
  const bnd = capBoundary(48);
  const oS = toScreen([0, 0, 0]);
  for (let i = 0; i < bnd.length; i += 3) {
    const p = toScreen(bnd[i]);
    ctx.strokeStyle = cssVar('--cone'); ctx.globalAlpha = 0.30 * depthAlpha(p[2]) + 0.1; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(oS[0], oS[1]); ctx.lineTo(p[0], p[1]); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // ---- filled cap patch ----
  ctx.beginPath();
  bnd.forEach((p, i) => { const s = toScreen(p); if (i === 0) ctx.moveTo(s[0], s[1]); else ctx.lineTo(s[0], s[1]); });
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,103,185,0.22)'; ctx.fill();
  // cap boundary circle (bold)
  poly3(bnd, cssVar('--cap'), 2.25, true);

  // two clean cone edges (leftmost/rightmost boundary pts in screen X)
  let iMin = 0, iMax = 0, xMin = Infinity, xMax = -Infinity;
  bnd.forEach((p, i) => { const s = toScreen(p); if (s[0] < xMin) { xMin = s[0]; iMin = i; } if (s[0] > xMax) { xMax = s[0]; iMax = i; } });
  for (const idx of [iMin, iMax]) {
    const s = toScreen(bnd[idx]);
    ctx.strokeStyle = cssVar('--cone'); ctx.globalAlpha = 1; ctx.lineWidth = 1.75;
    ctx.beginPath(); ctx.moveTo(oS[0], oS[1]); ctx.lineTo(s[0], s[1]); ctx.stroke();
  }

  // ---- boresight axis arrow (origin -> +Y, extended) ----
  const tip = toScreen([0, R * 1.22, 0]);
  ctx.strokeStyle = cssVar('--axis'); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(oS[0], oS[1]); ctx.lineTo(tip[0], tip[1]); ctx.stroke();
  // arrowhead
  const base = toScreen([0, R * 1.05, 0]);
  const dx = tip[0] - base[0], dy = tip[1] - base[1], L = Math.hypot(dx, dy) || 1;
  const ux = dx / L, uy = dy / L, px = -uy, py = ux, hs = 8;
  ctx.fillStyle = cssVar('--axis');
  ctx.beginPath();
  ctx.moveTo(tip[0], tip[1]);
  ctx.lineTo(tip[0] - ux * hs + px * hs * 0.55, tip[1] - uy * hs + py * hs * 0.55);
  ctx.lineTo(tip[0] - ux * hs - px * hs * 0.55, tip[1] - uy * hs - py * hs * 0.55);
  ctx.closePath(); ctx.fill();

  // origin dot
  ctx.fillStyle = cssVar('--navy');
  ctx.beginPath(); ctx.arc(oS[0], oS[1], 3.5, 0, 2 * Math.PI); ctx.fill();

  // ---- on-canvas labels ----
  ctx.globalAlpha = 1;
  ctx.font = '700 12px Inter, sans-serif'; ctx.textBaseline = 'bottom'; ctx.textAlign = 'center';
  ctx.fillStyle = cssVar('--axis');
  ctx.fillText('boresight', tip[0], tip[1] - 6);
  // Ω near cap centre
  const capMid = toScreen([0, R, 0]);
  MJ.draw(ctx, '\\Omega', capMid[0] + 8, capMid[1], 13, cssVar('--cone'), 'left');
  // antenna label
  ctx.fillStyle = cssVar('--ink3'); ctx.font = '600 11px Inter, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('antenna', oS[0] + 6, oS[1] + 4);

  updateReadout();
}

function updateReadout() {
  const a = state.alpha;
  const omega = 2 * Math.PI * (1 - Math.cos(a));
  document.getElementById('r-a').textContent = `${(a * 180 / Math.PI).toFixed(0)}°`;
  document.getElementById('r-omega').textContent = `${omega.toFixed(3)} sr`;
  document.getElementById('r-area').textContent = `${omega.toFixed(3)} r²`;
  document.getElementById('r-frac').textContent = `${(omega / (4 * Math.PI) * 100).toFixed(1)}%`;
}

fit();

MJ.setRedraw(()=>draw());
MJ.onReady(()=>{ MJ.typeset(document.body).then(()=>draw()); draw(); });
</script>
</body>
</html>
