<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steering predictor — PHASER beam sweep and element phases</title>
<script src="mjlabel.js"></script>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573;
          --amber:#8a5a00; --red:#b01e24; --grn:#3f7d34; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { box-sizing:border-box; width:100%; max-width:820px; margin:0 auto; padding:10px 10px 12px; }
  canvas { display:block; width:100%; border:1px solid var(--edge); border-radius:6px; background:#fff; }

  /* The two phase rows share one 8-column grid, so element n's prediction sits
     directly over what Phase Control shows for it. Each row's caption spans
     the grid: no label column, so the eight cells fit a 320 px phone. */
  .ptab { margin-top:9px; display:grid; grid-template-columns:repeat(8, minmax(0, 1fr));
          gap:3px 4px; font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  .ptab .cap { grid-column:1 / -1; font-size:12px; color:var(--ink3); margin-top:3px; }
  .ptab .cap b { font-weight:600; }
  .ptab .cap.ramp b { color:var(--navy); }
  .ptab .cap.pc b { color:var(--red); }
  .ptab .en { font-size:10.5px; font-weight:600; color:var(--ink3); text-align:center;
              letter-spacing:.02em; }
  .ptab .v { box-sizing:border-box; border:1px solid var(--edge); border-radius:5px;
             background:#fff; text-align:center; font-size:13.5px; font-weight:600;
             padding:2px 0; white-space:nowrap; overflow:hidden; }
  .ptab .v.ramp { color:var(--navy); }
  .ptab .v.ramp.wrapped { color:var(--amber); background:#fdf6e8; border-color:var(--edge2); }
  .ptab .v.pc { color:var(--red); }

  .controls { margin-top:10px; display:flex; flex-wrap:wrap; gap:8px 18px;
              background:var(--bg); border:1px solid var(--edge); border-radius:6px;
              padding:8px 11px; }
  .ctl { flex:1 1 260px; display:flex; flex-wrap:wrap; align-items:center; gap:6px 9px; font-size:13px; }
  .ctl label { flex:0 0 auto; color:var(--ink); }
  .ctl input[type=range] { flex:1 1 90px; min-width:60px; accent-color:var(--mid); }
  .ctl output { flex:0 0 auto; min-width:56px; text-align:right; font-weight:600;
                color:var(--navy); font-variant-numeric:tabular-nums; }

  /* Readouts as a row of instruments: equal-width cells on one grid, labels and
     values on shared baselines, edges flush with the canvas above. Three fit
     side by side down to a 320 px phone. */
  .readouts { margin-top:8px; display:grid; gap:6px; grid-template-columns:repeat(3, minmax(0, 1fr)); }
  .ro { display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
        gap:3px; padding:6px 4px 7px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  /* block, not flex: a flex container drops the whitespace between an inline
     MathJax symbol and the words that follow it, welding them together. */
  .ro .k { display:block; text-align:center; max-width:100%;
           height:15px; line-height:15px; font-size:10.5px; font-weight:700;
           text-transform:uppercase; letter-spacing:0.045em; color:var(--ink3);
           white-space:nowrap; overflow:hidden; }
  .ro .k mjx-container { font-size:inherit !important; }
  .ro .v { height:19px; line-height:19px; font-size:14.5px; font-weight:700; white-space:nowrap;
           font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
           text-align:center; color:var(--navy); }
  /* A phone: eight cells share ~300 px, so a five-character value ("206.9",
     "-1073" at 60 deg) needs the smaller face and no side padding to fit. */
  @media (max-width:430px) {
    .ptab { gap:3px 2px; }
    .ptab .v { font-size:11.5px; border-radius:4px; }
    .ro .k { letter-spacing:0; }
  }
  @media (max-width:360px) {
    .ptab .v { font-size:10.5px; }
    .ro .k { text-transform:none; }
  }
  .note { margin-top:8px; font-size:12px; color:var(--ink3); line-height:1.4; }
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="cv"></canvas>

  <div class="ptab" id="ptab"></div>

  <div class="controls" id="panel">
    <div class="ctl">
      <label for="f">HB100 frequency</label>
      <input type="range" id="f" min="10.1" max="10.7" step="0.005" value="10.525">
      <output id="fo">10.525 GHz</output>
    </div>
    <div class="ctl">
      <label for="t">Source angle on the arc</label>
      <input type="range" id="t" min="-60" max="60" step="1" value="30">
      <output id="to">+30&deg;</output>
    </div>
  </div>

  <div class="readouts">
    <div class="ro"><span class="k">\(\Delta\phi\) per element</span><span class="v" id="pdphi">88.4&deg;</span></div>
    <div class="ro"><span class="k">HPBW</span><span class="v" id="php">15.1&deg;</span></div>
    <div class="ro"><span class="k">Peak drop</span><span class="v" id="pdrop">&minus;0.6 dB</span></div>
  </div>

  <div class="note">N = 8, d = 14 mm. Dots: the sweep's samples, one 2.8125&deg; phase
  step apart. Moving the source drops the trace by the element pattern
  (cos&nbsp;&theta;, ideal); Apply with the source at boresight does not.</div>
</div>

<script>
(function () {
  "use strict";
  // Course constants: the prediction rows use c = 3e8 (lambda = 28.50 mm, 88.4 deg
  // per element at 30 deg), as the lesson does.
  var C = 3e8, N = 8, D = 0.014;
  // The instrument's own constants (phaser_headless.py do_sweep and
  // ConvertPhaseToSteerAngle; main.js btn-apply-steer): c = 299792458, the
  // truncated 3.14159, a 2.8125 deg phase step with Use Bits on, and phases
  // computed at Signal Freq - Signal BW (10 MHz in Lab Preset 1).
  var CG = 299792458, SPI = 3.14159, LSB = 2.8125, BW = 10e6;
  var FLOOR = -23;
  var XMIN = -80, XMAX = 80, YMIN = -30, YMAX = 4;

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var fIn = document.getElementById('f'), tIn = document.getElementById('t');
  var fOut = document.getElementById('fo'), tOut = document.getElementById('to');
  var ptab = document.getElementById('ptab');
  var pd = document.getElementById('pdphi'), ph = document.getElementById('php'),
      pdrop = document.getElementById('pdrop');

  var NAVY = '#004a85', MID = '#0067b9', GRN = '#3f7d34', AMB = '#8a5a00', RED = '#b01e24',
      INK = '#15202b', INK3 = '#5b6573', EDGE = '#cddce9', GRID = '#e6eef6';
  var RAD = Math.PI / 180;

  function state() {
    var f = parseFloat(fIn.value) * 1e9;
    return { f: f, ts: parseFloat(tIn.value) };
  }

  /* ---------- the instrument's sweep ---------- */
  // The angle the GUI plots a sweep step dphi (deg) at.
  function axisOf(dphi, f) {
    var v = CG * Math.abs(dphi) * RAD / (2 * SPI * (f - BW) * D);
    var th = Math.asin(Math.min(1, v)) / RAD;
    return dphi >= 0 ? th : -th;
  }
  // The sweep step the GUI plots at angle x (the inverse of axisOf).
  function dphiOf(x, f) {
    return Math.sin(x * RAD) * 2 * SPI * (f - BW) * D / CG / RAD;
  }
  // |AF|^2 at sweep step dphi for a source at ts: real physics, exact c and pi.
  function af2(dphi, ts, f) {
    var kd = 360 * D * f / CG;
    var psi = (kd * Math.sin(ts * RAD) - dphi) * RAD;
    var den = N * Math.sin(psi / 2);
    if (Math.abs(den) < 1e-12) return 1;
    var r = Math.sin(N * psi / 2) / den;
    return r * r;
  }
  // The trace: the element pattern at the source (a constant) times |AF|^2,
  // clamped at the sweep's noise floor.
  function traceDb(x, ts, f) {
    var p = Math.cos(ts * RAD) * af2(dphiOf(x, f), ts, f);
    return Math.max(10 * Math.log10(Math.max(p, 1e-12)), FLOOR);
  }
  // Half-power width on the GUI's axis: bisect for |AF|^2 = 1/2 either side of
  // the peak, in sweep-step units, then convert each crossing to an angle.
  function hpbw(ts, f) {
    var p0 = 360 * D * f / CG * Math.sin(ts * RAD);
    function cross(a, b) {             // af2 > 0.5 at a, < 0.5 at b
      for (var i = 0; i < 60; i++) {
        var m = 0.5 * (a + b);
        if (af2(m, ts, f) > 0.5) a = m; else b = m;
      }
      return 0.5 * (a + b);
    }
    var lo = cross(p0, p0 - 45), hi = cross(p0, p0 + 45);
    var lim = 2 * SPI * (f - BW) * D / CG / RAD;     // the step that reads 90 deg
    if (Math.abs(lo) >= lim || Math.abs(hi) >= lim) return null;
    var a = axisOf(lo, f), b = axisOf(hi, f);
    return { lo: a, hi: b, w: b - a };
  }

  /* ---------- the phases ---------- */
  function phases(ts, f) {
    var dphi = 360 * D * f / C * Math.sin(ts * RAD);
    // Apply: round(k * phDeltaDeg), phDeltaDeg = -(360 d sin(theta) f / c)
    var pcd = -(360 * D * Math.sin(ts * RAD) * f / CG);
    var out = [];
    for (var n = 0; n < N; n++) {
      var raw = n * dphi;
      var wrapped = ((raw % 360) + 360) % 360;
      out.push({ wrapped: wrapped, turned: Math.abs(raw - wrapped) > 1e-9,
                 pc: Math.round(n * pcd) });
    }
    return { dphi: dphi, el: out };
  }

  function fmtDeg(v, dp) { return (v >= 0 ? '' : '−') + Math.abs(v).toFixed(dp) + '°'; }
  function fmtInt(v) { return v < 0 ? '−' + Math.abs(v) : String(v); }

  /* ---------- canvas ---------- */
  var M = { l: 52, r: 14, t: 16, b: 36 };

/* Narrow: the canvas, the phase rows, the controls and the readouts stack, so
   the parts ADD -- which puts the widget past the phone budget and makes it
   scroll inside its own iframe. Every curve and control stays; the canvas
   just gets a shorter design box. Shrinking the design height rather than
   the bitmap keeps text full size and the composition undistorted. */
var __SQ_MQ = window.matchMedia ? window.matchMedia('(max-width:430px)') : null;
function SQ(h){ return (__SQ_MQ && __SQ_MQ.matches) ? Math.round(h * 0.82) : h; }

  function sizeCanvas() {
    var w = cv.clientWidth || cv.parentNode.clientWidth || 700;
    var h = SQ(Math.round(Math.max(190, Math.min(240, w * 0.32))));
    cv.style.height = h + 'px';
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w: w, h: h };
  }

  function drawAll() {
    var s = state(), sz = sizeCanvas(), w = sz.w, h = sz.h;
    var small = w < 470;
    var fs = small ? 10.5 : 11.5;
    M.l = small ? 50 : 56; M.b = small ? 32 : 36;
    var x0 = M.l, x1 = w - M.r, y0 = M.t, y1 = h - M.b;
    var X = function (deg) { return x0 + (deg - XMIN) / (XMAX - XMIN) * (x1 - x0); };
    var Y = function (db) { return y1 - (db - YMIN) / (YMAX - YMIN) * (y1 - y0); };

    ctx.clearRect(0, 0, w, h);
    ctx.font = fs + "px 'Inter',system-ui,sans-serif";
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';

    // grid
    ctx.strokeStyle = GRID; ctx.lineWidth = 1;
    var xt, db;
    for (xt = XMIN; xt <= XMAX; xt += 20) {
      ctx.beginPath(); ctx.moveTo(X(xt), y0); ctx.lineTo(X(xt), y1); ctx.stroke();
    }
    for (db = 0; db >= YMIN; db -= 10) {
      ctx.beginPath(); ctx.moveTo(x0, Y(db)); ctx.lineTo(x1, Y(db)); ctx.stroke();
    }

    // frame
    ctx.strokeStyle = EDGE; ctx.lineWidth = 1.2;
    ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);

    // tick labels
    ctx.fillStyle = INK3; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (xt = XMIN; xt <= XMAX; xt += 20) {
      if (small && (xt % 40 !== 0)) continue;
      ctx.fillText(fmtInt(xt), X(xt), y1 + 5);
    }
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (db = 0; db >= YMIN; db -= 10) ctx.fillText(fmtInt(db), x0 - 6, Y(db));

    // axis titles
    ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('sweep steering angle (deg)', (x0 + x1) / 2, h - 2);
    ctx.save();
    // the title's left edge is fixed and the tick labels end 6 px short of the
    // frame, so the margin leaves a gap between them at any width
    ctx.translate(3, (y0 + y1) / 2); ctx.rotate(-Math.PI / 2);
    ctx.textBaseline = 'top';
    ctx.fillText('power (dB)', 0, 0);
    ctx.restore();

    // the noise floor
    ctx.save();
    ctx.setLineDash([5, 4]); ctx.strokeStyle = INK3; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, Y(FLOOR)); ctx.lineTo(x1, Y(FLOOR)); ctx.stroke();
    ctx.restore();

    // the half-power span, 3 dB below this trace's own peak
    var drop = 10 * Math.log10(Math.cos(s.ts * RAD));
    var y3 = Y(drop - 3.0103);
    var bw = hpbw(s.ts, s.f);
    if (bw) {
      ctx.strokeStyle = GRN; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(X(bw.lo), y3); ctx.lineTo(X(bw.hi), y3); ctx.stroke();
      [bw.lo, bw.hi].forEach(function (a) {
        ctx.beginPath(); ctx.moveTo(X(a), y3 - 5); ctx.lineTo(X(a), y3 + 5); ctx.stroke();
      });
      ctx.fillStyle = GRN; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(bw.w.toFixed(1) + '°', X((bw.lo + bw.hi) / 2), y3 + 7);
    }

    // trace
    ctx.strokeStyle = NAVY; ctx.globalAlpha = 0.6; ctx.lineWidth = 1.6;
    ctx.beginPath();
    var px = Math.max(400, Math.round((x1 - x0) * 3)), i, a, v;
    for (i = 0; i <= px; i++) {
      a = XMIN + (XMAX - XMIN) * i / px;
      v = traceDb(a, s.ts, s.f);
      if (i === 0) ctx.moveTo(X(a), Y(v)); else ctx.lineTo(X(a), Y(v));
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // the samples the instrument takes: one 2.8125 deg phase step apart,
    // each plotted at the angle it steers to (Use Bits on)
    ctx.fillStyle = NAVY;
    for (i = -81; i < 81; i++) {
      a = axisOf(i * LSB, s.f);
      if (a < XMIN || a > XMAX || Math.abs(a) >= 89.999) continue;
      v = af2(i * LSB, s.ts, s.f) * Math.cos(s.ts * RAD);
      v = Math.max(10 * Math.log10(Math.max(v, 1e-12)), FLOOR);
      ctx.beginPath(); ctx.arc(X(a), Y(v), small ? 1.8 : 2.2, 0, 2 * Math.PI); ctx.fill();
    }

    // the source marker at the top of the plot, its label on whichever side
    // has room
    var xs = X(s.ts), yt = Y(YMAX) + 1;
    ctx.fillStyle = AMB;
    ctx.beginPath();
    ctx.moveTo(xs, yt + 9); ctx.lineTo(xs - 5, yt); ctx.lineTo(xs + 5, yt);
    ctx.closePath(); ctx.fill();
    ctx.textBaseline = 'top';
    var lab = 'source', lw = ctx.measureText(lab).width;
    if (xs + 8 + lw <= x1 - 2) { ctx.textAlign = 'left'; ctx.fillText(lab, xs + 8, yt); }
    else { ctx.textAlign = 'right'; ctx.fillText(lab, xs - 8, yt); }
  }

  /* ---------- readouts ---------- */
  function drawReadouts() {
    var s = state(), p = phases(s.ts, s.f), bw = hpbw(s.ts, s.f);
    fOut.textContent = parseFloat(fIn.value).toFixed(3) + ' GHz';
    tOut.textContent = (s.ts > 0 ? '+' : (s.ts < 0 ? '−' : '')) + Math.abs(s.ts).toFixed(0) + '°';

    var html = '', n;
    for (n = 0; n < N; n++) html += '<div class="en">E' + (n + 1) + '</div>';
    html += '<div class="cap ramp"><b>Beam ramp +nΔφ</b>, wrapped to 0–360 (deg)</div>';
    for (n = 0; n < N; n++) {
      html += '<div class="v ramp' + (p.el[n].turned ? ' wrapped' : '') + '">' +
              p.el[n].wrapped.toFixed(1) + '</div>';
    }
    html += '<div class="cap pc"><b>Phase Control shows</b> after Apply at this angle (deg)</div>';
    for (n = 0; n < N; n++) html += '<div class="v pc">' + fmtInt(p.el[n].pc) + '</div>';
    ptab.innerHTML = html;

    pd.textContent = fmtDeg(p.dphi, 1);
    ph.textContent = bw ? bw.w.toFixed(1) + '°' : 'off scale';
    var drop = 10 * Math.log10(Math.cos(s.ts * RAD));
    pdrop.textContent = (drop < -0.05 ? '−' + Math.abs(drop).toFixed(1) : '0.0') + ' dB';
  }

  function update() { drawReadouts(); drawAll(); }

  fIn.addEventListener('input', update);
  tIn.addEventListener('input', update);
  window.addEventListener('resize', update);

  if (window.MJ) {
    MJ.setRedraw(drawAll);
    MJ.onReady(function () { MJ.typeset(document.getElementById('app')); update(); });
  }
  update();
})();
</script>
</body>
</html>
