<text x="28.0" y="36.0" font-size="17" fill="#004a85" font-weight="700">The reflector shapes phase, not power</text>
<circle cx="424" cy="107" r="8" fill="#004a85"/>
<text x="450.0" y="117.0" font-size="15" fill="#004a85" font-weight="700">Feed at the focus</text>
<text x="450.0" y="136.0" font-size="13" fill="#5b6573">a spherical wave heads for the dish</text>
<path d="M 415 195 A 16 16 0 0 1 415 167" fill="none" stroke="#8a5a00" stroke-width="2.4"/>
<text x="450.0" y="187.0" font-size="15" fill="#8a5a00" font-weight="700">Edge angle</text>
<text x="450.0" y="206.0" font-size="13" fill="#5b6573">the sky the feed has to cover — set by f/D</text>
<line x1="424" y1="238" x2="424" y2="262" stroke="#b01e24" stroke-width="2.6"/>
<text x="450.0" y="257.0" font-size="15" fill="#b01e24" font-weight="700">Plane wave off the dish</text>
<text x="450.0" y="276.0" font-size="13" fill="#5b6573">curvature removed, amplitude untouched</text>
<line x1="424" y1="308" x2="424" y2="332" stroke="#3f7d34" stroke-width="2.6" stroke-dasharray="6 4"/>
<text x="450.0" y="327.0" font-size="15" fill="#3f7d34" font-weight="700">Aperture plane</text>
<text x="450.0" y="346.0" font-size="13" fill="#5b6573">every ray arrives in phase — the whole trick</text>
<text x="395.0" y="448.0" font-size="17" fill="#15202b" text-anchor="middle" font-weight="700">Every path feed → surface → plane is the same length</text>
<text x="395.0" y="470.0" font-size="14" fill="#5b6573" text-anchor="middle" font-style="italic">FP + PA = f + z(plane), independent of which ray you follow</text>
