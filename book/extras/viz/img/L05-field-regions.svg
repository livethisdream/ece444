<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 0 660 430" font-family="Inter, system-ui, -apple-system, sans-serif">
  <!-- viewBox starts at -20, not 0: the outer circle is cx=175 r=188,
       so it reaches x=-13 and was being clipped down its left side.
       -->
  <!-- concentric field regions centered on the antenna -->
  <circle cx="175" cy="215" r="188" fill="rgba(0,74,133,0.045)" stroke="#b9d2e5"/>
  <circle cx="175" cy="215" r="126" fill="rgba(0,103,185,0.10)" stroke="#0067b9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <circle cx="175" cy="215" r="56"  fill="rgba(138,90,0,0.14)" stroke="#8a5a00" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- antenna (dipole) at center -->
  <line x1="175" y1="201" x2="175" y2="183" stroke="#004a85" stroke-width="3.5"/>
  <line x1="175" y1="229" x2="175" y2="247" stroke="#004a85" stroke-width="3.5"/>
  <circle cx="175" cy="215" r="3.2" fill="#004a85"/>
  <text x="175" y="266" text-anchor="middle" font-size="11" fill="#5b6573">antenna</text>

  <!-- distance axis with boundary ticks -->
  <line x1="175" y1="215" x2="368" y2="215" stroke="#5b6573" stroke-width="1"/>
  <line x1="231" y1="208" x2="231" y2="222" stroke="#8a5a00" stroke-width="1.8"/>
  <line x1="301" y1="208" x2="301" y2="222" stroke="#0067b9" stroke-width="1.8"/>
  <text x="366" y="206" text-anchor="end" font-size="11" fill="#5b6573">increasing r &#8594;</text>

  <!-- legend -->
  <g transform="translate(410,72)">
    <rect x="0" y="0" width="13" height="13" rx="2" fill="rgba(138,90,0,0.35)" stroke="#8a5a00"/>
    <text x="21" y="11" font-size="13" font-weight="700" fill="#004a85">Reactive near-field</text>
    <text x="21" y="29" font-size="11.5" fill="#5b6573">r &lt; 0.62&#8730;(D&#179;/&#955;)</text>

    <rect x="0" y="54" width="13" height="13" rx="2" fill="rgba(0,103,185,0.28)" stroke="#0067b9"/>
    <text x="21" y="65" font-size="13" font-weight="700" fill="#004a85">Radiating near-field</text>
    <text x="21" y="83" font-size="11.5" fill="#5b6573">0.62&#8730;(D&#179;/&#955;) &#8804; r &lt; 2D&#178;/&#955;</text>

    <rect x="0" y="108" width="13" height="13" rx="2" fill="rgba(0,74,133,0.12)" stroke="#b9d2e5"/>
    <text x="21" y="119" font-size="13" font-weight="700" fill="#004a85">Far-field</text>
    <text x="21" y="137" font-size="11.5" fill="#5b6573">r &#8805; 2D&#178;/&#955;</text>
  </g>
</svg>
