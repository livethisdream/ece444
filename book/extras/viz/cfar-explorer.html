<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFAR threshold on a range profile</title>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573;
          --amber:#8a5a00; --red:#b01e24; --grn:#1d7a4d; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  *, *::before, *::after { box-sizing:border-box; }
  .app { max-width:820px; margin:0 auto; padding:10px 10px 14px; }
  .card { border:1px solid var(--edge); border-radius:6px; background:#fff; padding:6px 8px 2px; margin-bottom:10px; }
  canvas { display:block; width:100%; }
  .controls { display:grid; grid-template-columns:1fr; gap:7px 18px;
              background:var(--bg); border:1px solid var(--edge); border-radius:6px;
              padding:8px 12px; margin-bottom:10px; }
  @media (min-width:560px) { .controls { grid-template-columns:1fr 1fr; } }
  .ctl { display:flex; align-items:center; gap:8px; min-width:0; }
  .ctl label { font-size:13.5px; color:var(--ink); white-space:nowrap; min-width:82px; }
  .ctl input[type=range] { flex:1 1 80px; min-width:70px; accent-color:var(--navy); }
  .ctl select, .ctl button { font:inherit; font-size:13.5px; padding:2px 6px; border:1px solid var(--edge2);
                             border-radius:4px; background:#fff; color:var(--ink); }
  .ctl button { cursor:pointer; margin-left:auto; }
  .val { font-variant-numeric:tabular-nums; font-size:13.5px; color:var(--navy);
         font-weight:600; min-width:52px; text-align:right; }
  .readouts { display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(110px, 1fr)); }
  .ro { display:flex; flex-direction:column; align-items:center; gap:4px; padding:7px 8px 8px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  .ro .k { display:block; text-align:center; height:15px; line-height:15px; font-size:10.5px; font-weight:700;
           text-transform:uppercase; letter-spacing:0.045em; color:var(--ink3); white-space:nowrap; overflow:hidden; }
  .ro .v { height:19px; line-height:19px; font-size:14.5px; font-weight:700; white-space:nowrap;
           font-variant-numeric:tabular-nums; text-align:center; color:var(--navy); }
  .ro.dgr { background:rgba(176,30,36,0.10); border-color:rgba(176,30,36,0.28); }
  .ro.dgr .v { color:var(--red); }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="card"><canvas id="prof"></canvas></div>

  <div class="controls">
    <div class="ctl">
      <label for="gd">Guard cells</label>
      <input id="gd" type="range" min="0" max="8" step="1" value="2">
      <span class="val" id="gdv"></span>
    </div>
    <div class="ctl">
      <label for="rf">Reference</label>
      <input id="rf" type="range" min="2" max="32" step="1" value="16">
      <span class="val" id="rfv"></span>
    </div>
    <div class="ctl">
      <label for="bs">Bias</label>
      <input id="bs" type="range" min="0" max="25" step="0.1" value="12.4">
      <span class="val" id="bsv"></span>
    </div>
    <div class="ctl">
      <label for="kd">Method</label>
      <select id="kd">
        <option value="ca" selected>cell averaging</option>
        <option value="go">greatest-of</option>
        <option value="so">smallest-of</option>
      </select>
      <button id="nw" type="button">New noise</button>
    </div>
  </div>

  <div class="readouts">
    <div class="ro"><span class="k">design P<sub>fa</sub></span><span class="v" id="rPfa"></span></div>
    <div class="ro"><span class="k">targets found</span><span class="v" id="rHit"></span></div>
    <div class="ro dgr"><span class="k">false alarms</span><span class="v" id="rFa"></span></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // One range profile of square-law cells, powers relative to the quiet noise.
  // The scene: quiet noise, then clutter 15 dB higher from cell CL on. Five
  // steady targets, each with a Hann window's -6 dB neighbors: a pair eight
  // cells apart (masking), one alone in the clear, one in the clear just short
  // of the clutter edge, and one inside the clutter (its SNR is over the clutter).
  const N = 240, CL = 168, CLUT_DB = 15;
  const TARGETS = [ { k: 52, snr: 18 }, { k: 60, snr: 24 }, { k: 104, snr: 17 },
                    { k: 160, snr: 18 }, { k: 206, snr: 18 } ];
  const $ = id => document.getElementById(id);
  const cv = $('prof'), cx = cv.getContext('2d');
  const gdEl = $('gd'), rfEl = $('rf'), bsEl = $('bs'), kdEl = $('kd');

  let seed = 7;
  function rand() {                           // mulberry32: repeatable noise for one seed
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  function gauss() {
    let u = 0; while (u === 0) u = rand();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rand());
  }

  let P = [], isTgt = [];
  function makeScene() {
    const re = [], im = [];
    for (let i = 0; i < N; i++) {
      const s = Math.sqrt((i >= CL ? 10 ** (CLUT_DB / 10) : 1) / 2);
      re.push(s * gauss()); im.push(s * gauss());
    }
    isTgt = new Array(N).fill(false);
    TARGETS.forEach(t => {
      const a = Math.sqrt(10 ** (t.snr / 10) * (t.k >= CL ? 10 ** (CLUT_DB / 10) : 1));
      [[-1, 0.5], [0, 1], [1, 0.5]].forEach(([d, h]) => { re[t.k + d] += a * h; isTgt[t.k + d] = true; });
    });
    P = re.map((r, i) => r * r + im[i] * im[i]);
  }

  // Design Pfa of each method for 2n reference cells and a bias a (linear):
  // CA (1 + a/2n)^-2n; SO and GO from the closed forms for n cells a side.
  function binom(n, k) { let c = 1; for (let i = 1; i <= k; i++) c = c * (n - k + i) / i; return c; }
  function pfaSO(a, n) { let s = 0; for (let k = 0; k < n; k++) s += binom(n - 1 + k, k) * (2 + a / n) ** (-(n + k)); return 2 * s; }
  function designPfa(kind, a, n) {
    if (kind === 'ca') return (1 + a / (2 * n)) ** (-2 * n);
    const so = pfaSO(a, n);
    return kind === 'so' ? so : 2 * (1 + a / n) ** (-n) - so;
  }

  const st = {};
  function compute() {
    const g = +gdEl.value, n = +rfEl.value, bdb = +bsEl.value, kind = kdEl.value;
    const a = 10 ** (bdb / 10);
    const T = new Array(N).fill(NaN), det = new Array(N).fill(false);
    for (let i = 0; i < N; i++) {
      // the ends of the profile: use whichever side exists, same bias
      let lo = 0, nl = 0, hi = 0, nh = 0;
      for (let j = i - g - n; j < i - g; j++) if (j >= 0) { lo += P[j]; nl++; }
      for (let j = i + g + 1; j <= i + g + n; j++) if (j < N) { hi += P[j]; nh++; }
      let est;
      if (!nl) est = hi / nh; else if (!nh) est = lo / nl;
      else if (kind === 'ca') est = (lo + hi) / (nl + nh);
      else if (kind === 'go') est = Math.max(lo / nl, hi / nh);
      else est = Math.min(lo / nl, hi / nh);
      T[i] = a * est;
      det[i] = P[i] > T[i];
    }
    // a target counts as found when its center cell is declared; a declared
    // cell that is not part of any target is a false alarm
    let hits = 0, fa = 0;
    TARGETS.forEach(t => { if (det[t.k]) hits++; });
    for (let i = 0; i < N; i++) if (det[i] && !isTgt[i]) fa++;
    Object.assign(st, { g, n, bdb, kind, T, det, hits, fa, pfa: designPfa(kind, a, n) });

    $('gdv').textContent = g + ' a side';
    $('rfv').textContent = n + ' a side';
    $('bsv').textContent = bdb.toFixed(1) + ' dB';
    $('rPfa').textContent = fmtP(st.pfa);
    $('rHit').textContent = hits + ' of ' + TARGETS.length;
    $('rFa').textContent = fa;
  }

  function fmtP(p) {
    if (!(p > 0)) return '0';
    if (p >= 0.01) return p.toFixed(2);
    const e = Math.floor(Math.log10(p)), m = p / 10 ** e;
    return m.toFixed(1) + '×10' + sup(e);
  }
  function sup(n) {
    const d = '⁰¹²³⁴⁵⁶⁷⁸⁹';
    return (n < 0 ? '⁻' : '') + String(Math.abs(n)).split('').map(c => d[+c]).join('');
  }

  // ---- canvas plumbing (see detection-threshold.html for SQ) ----
  var __SQ_MQ = window.matchMedia ? window.matchMedia('(max-width:659px)') : null;
  function SQ(h) { return (__SQ_MQ && __SQ_MQ.matches) ? Math.round(h * 0.66) : h; }
  function fit(c, ctx, h) {
    h = SQ(h);
    const dpr = window.devicePixelRatio || 1;
    const w = c.parentNode.clientWidth - 16;
    c.style.height = h + 'px';
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    return { w: w, h: h };
  }
  const F = (s, w) => (w || '') + ' ' + s + 'px Inter, system-ui, sans-serif';
  const db = v => 10 * Math.log10(v);

  function draw() {
    const g = fit(cv, cx, 280);
    const L = 34, R = 8, T = 20, B = 30;
    const Y0 = -25, Y1 = 40;
    const x = i => L + (i + 0.5) / N * (g.w - L - R);
    const y = d => T + (Y1 - Math.max(Y0, Math.min(Y1, d))) / (Y1 - Y0) * (g.h - T - B);

    cx.strokeStyle = '#e6eef6'; cx.lineWidth = 1;
    cx.fillStyle = '#8792a2'; cx.font = F(11); cx.textAlign = 'right';
    for (let d = -20; d <= 40; d += 10) {
      cx.beginPath(); cx.moveTo(L, y(d)); cx.lineTo(g.w - R, y(d)); cx.stroke();
      cx.fillText(d, L - 5, y(d) + 4);
    }
    cx.textAlign = 'center';
    for (let i = 0; i <= N; i += 40) {
      cx.textAlign = i === N ? 'right' : 'center';
      cx.fillText(i, i === N ? g.w - R : x(i) - (g.w - L - R) / N / 2, g.h - B + 15);
    }
    cx.textAlign = 'center';
    cx.fillStyle = '#5b6573'; cx.font = F(11.5);
    cx.fillText('range cell', (L + g.w - R) / 2, g.h - 3);
    cx.textAlign = 'left';
    cx.fillText('power (dB)', L, T - 7);

    // the clutter region
    cx.fillStyle = 'rgba(91,101,115,0.07)';
    cx.fillRect(x(CL) - (g.w - L - R) / N / 2, T, g.w - R - x(CL) + (g.w - L - R) / N / 2, g.h - T - B);
    cx.fillStyle = '#5b6573'; cx.font = F(11); cx.textAlign = 'right';
    if (g.w > 420) cx.fillText('clutter', g.w - R - 4, g.h - B - 6);

    // profile
    cx.beginPath();
    for (let i = 0; i < N; i++) { const P0 = [x(i), y(db(P[i]))]; i ? cx.lineTo(...P0) : cx.moveTo(...P0); }
    cx.strokeStyle = '#004a85'; cx.lineWidth = 1; cx.lineJoin = 'round'; cx.stroke();

    // threshold
    cx.beginPath();
    for (let i = 0; i < N; i++) { const P0 = [x(i), y(db(st.T[i]))]; i ? cx.lineTo(...P0) : cx.moveTo(...P0); }
    cx.strokeStyle = '#1d7a4d'; cx.lineWidth = 2; cx.stroke();

    // detections: targets ring, false alarms filled red
    for (let i = 0; i < N; i++) {
      if (!st.det[i]) continue;
      cx.beginPath(); cx.arc(x(i), y(db(P[i])), 4, 0, 2 * Math.PI);
      if (isTgt[i]) { cx.strokeStyle = '#004a85'; cx.lineWidth = 1.8; cx.stroke(); }
      else { cx.fillStyle = '#b01e24'; cx.fill(); }
    }
    // the target positions, so a miss is visible as well as a hit
    cx.fillStyle = '#004a85';
    TARGETS.forEach(t => {
      const xx = x(t.k);
      cx.beginPath(); cx.moveTo(xx, T + 2); cx.lineTo(xx - 4, T - 5); cx.lineTo(xx + 4, T - 5); cx.closePath();
      cx.fillStyle = st.det[t.k] ? '#004a85' : '#b8c4d2'; cx.fill();
    });
  }

  function update() { compute(); draw(); }
  [gdEl, rfEl, bsEl, kdEl].forEach(el => el.addEventListener('input', update));
  $('nw').addEventListener('click', () => { seed = (Math.random() * 2 ** 31) | 0; makeScene(); update(); });
  window.addEventListener('resize', draw);
  makeScene();
  update();
})();
</script>
</body>
</html>
