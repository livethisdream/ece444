<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSWR — the standing wave</title>
<script src="mjlabel.js"></script>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573;
          --amber:#8a5a00; --red:#b01e24; --grn:#3f7d34;
          --tot:#0067b9;   /* instantaneous total */
          --env:#004a85;   /* envelope */
          --fwd:#1d7a4d;   /* forward wave */
          --ref:#b3213a;   /* reflected wave */
          --node:#8a5a00; } /* node / min markers */
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:flex; flex-direction:column; gap:10px; padding:14px; }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px; }
  .controls { display:grid; grid-template-columns:1.6fr 1fr 1.2fr; gap:9px 18px; align-items:center;
              padding:9px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  @media (max-width:620px) { .controls { grid-template-columns:1fr; } }
  .ctl { display:flex; align-items:center; gap:8px; min-width:0; overflow:hidden; }
  .ctl label { font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl .val { color:var(--navy); font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:38px; text-align:right; }
  .ctl input[type=range]{ flex:1 1 auto; min-width:80px; accent-color:var(--mid); }
  .tgl { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; min-width:0; }
  .tgl input { position:absolute; opacity:0; pointer-events:none; }
  .tgl .sw { position:relative; flex:none; width:34px; height:19px; border-radius:999px;
             background:#dfe8f1; border:1px solid var(--edge2); transition:background .15s, border-color .15s; }
  .tgl .sw::after { content:''; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%;
                    background:#fff; box-shadow:0 1px 2px rgba(0,0,0,0.22); transition:transform .15s; }
  .tgl input:checked + .sw { background:var(--on,var(--mid)); border-color:var(--on,var(--mid)); }
  .tgl input:checked + .sw::after { transform:translateX(15px); }
  .tgl input:focus-visible + .sw { outline:2px solid var(--navy); outline-offset:2px; }
  .tgl .t { font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .tgl input:checked ~ .t { color:var(--on,var(--navy)); }
  /* Readouts as a row of instruments: equal-width cells on one grid, labels and
     values on shared baselines, edges flush with the canvases above. */
  .readouts { display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(148px, 1fr)); }
  .ro { display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
        gap:4px; padding:7px 8px 8px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  /* block, not flex: a flex container drops the whitespace between an inline
     MathJax symbol and the words that follow it, welding them together. */
  .ro .k { display:block; text-align:center;
           height:15px; line-height:15px; font-size:10.5px; font-weight:700;
           text-transform:uppercase; letter-spacing:0.045em; color:var(--ink3);
           white-space:nowrap; overflow:hidden; }
  .ro .k mjx-container { font-size:inherit !important; }
  .ro .v { height:19px; line-height:19px; font-size:14.5px; font-weight:700; white-space:nowrap;
           font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
           text-align:center; min-width:8ch; color:var(--navy); }
  .ro.good { background:rgba(63,125,52,0.12); border-color:rgba(63,125,52,0.30); }
  .ro.good .v { color:var(--grn); }
  .ro.warn { background:rgba(138,90,0,0.12);  border-color:rgba(138,90,0,0.30); }
  .ro.warn .v { color:var(--amber); }
  .ro.bad  { background:rgba(176,30,36,0.10); border-color:rgba(176,30,36,0.28); }
  .ro.bad  .v { color:var(--red); }
</style>
</head>
<body>
<div class="app">
  <canvas id="plot" aria-label="Standing wave on a transmission line"></canvas>

  <div class="controls">
    <div class="ctl">
      <label>Load \(\lvert\Gamma\rvert\)</label>
      <input type="range" id="gamma" min="0" max="1" step="0.01" value="0.5">
      <span class="val" id="gam-val">0.50</span>
    </div>
    <label class="tgl"><input type="checkbox" id="play"><span class="sw"></span><span class="t">Animate</span></label>
    <label class="tgl" style="--on:var(--fwd)"><input type="checkbox" id="show-comp"><span class="sw"></span><span class="t">Forward + reflected</span></label>
  </div>

  <div class="readouts">
    <div class="ro" id="ro-vswr"><span class="k">VSWR</span><span class="v" id="r-vswr">—</span></div>
    <div class="ro"><span class="k">\(\lvert\Gamma\rvert\)</span><span class="v" id="r-gam">—</span></div>
    <div class="ro"><span class="k">return loss</span><span class="v" id="r-rl">—</span></div>
    <div class="ro"><span class="k">reflected power</span><span class="v" id="r-refl">—</span></div>
    <div class="ro"><span class="k">transmitted power</span><span class="v" id="r-trans">—</span></div>
    <div class="ro" id="ro-rate"><span class="k">match</span><span class="v" id="rating">—</span></div>
  </div>
</div>

<script>
'use strict';

const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---- labels: MathJax for math, sans UI font for words/units ----
const SANS='Inter, system-ui, -apple-system, sans-serif';
const mtext=(ctx,tex,x,y,h,color,align)=>MJ.draw(ctx,tex,x,y,h,color,align);
function stext(ctx,str,x,y,px,color,align,bold){ ctx.fillStyle=color; ctx.font=(bold?'700 ':'')+px+'px '+SANS; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(str,x,y); }
function mixLabel(ctx,chunks,x,yc,h,color,align,bold){
  const fpx=h-1, f=(bold?'700 ':'')+fpx+'px '+SANS;
  let tot=0;
  for(const c of chunks){ if(c.m) tot+=MJ.width(c.m,color,h); else { ctx.font=f; tot+=ctx.measureText(c.s).width; } }
  let cx = align==='right'? x-tot : (align==='center'? x-tot/2 : x);
  for(const c of chunks){
    if(c.m){ MJ.draw(ctx,c.m,cx,yc,h,color,'left'); cx+=MJ.width(c.m,color,h); }
    else { stext(ctx,c.s,cx,yc,fpx,color,'left',bold); ctx.font=f; cx+=ctx.measureText(c.s).width; }
  }
}

// V(d,φ) = cos(φ − βd) + Γ cos(φ + βd),  V+ = 1, β d = 2π·d  (d in wavelengths).
// Load sits at d = 0 (an antinode for a real, positive Γ).
const DMAX = 2.0;        // show two wavelengths of line
const AMP  = 2.2;        // vertical half-range (1+|Γ| ≤ 2)

const state = { gamma: 0.5, phi: 0.0, playing: false };

const Vtot = (d, phi, G) =>
  Math.cos(phi - 2*Math.PI*d) + G*Math.cos(phi + 2*Math.PI*d);
const Vfwd = (d, phi)       => Math.cos(phi - 2*Math.PI*d);
const Vref = (d, phi, G)    => G*Math.cos(phi + 2*Math.PI*d);
// Envelope (max over φ): sqrt[(1+G)²cos²βd + (1−G)²sin²βd]
const Venv = (d, G) => {
  const c = Math.cos(2*Math.PI*d), s = Math.sin(2*Math.PI*d);
  return Math.sqrt((1+G)*(1+G)*c*c + (1-G)*(1-G)*s*s);
};

// ---- controls ----
const gammaEl = document.getElementById('gamma');
const gamVal  = document.getElementById('gam-val');
const playBtn = document.getElementById('play');
const compEl  = document.getElementById('show-comp');

gammaEl.addEventListener('input', () => {
  state.gamma = parseFloat(gammaEl.value);
  gamVal.textContent = state.gamma.toFixed(2);
  draw();
});
compEl.addEventListener('change', draw);
playBtn.addEventListener('change', () => {
  state.playing = playBtn.checked;
  if (state.playing) { lastTs = null; requestAnimationFrame(tick); }
});

let lastTs = null;
function tick(ts) {
  if (!state.playing) return;
  if (lastTs === null) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  state.phi = (state.phi + dt * 2.2) % (2*Math.PI);   // ~0.35 Hz breathing
  draw();
  requestAnimationFrame(tick);
}

// ---- canvas ----
const canvas = document.getElementById('plot');
const ctx = canvas.getContext('2d');

/* clientWidth, not getBoundingClientRect(): the rect includes the 1px border on
   each side, so a bitmap sized from it is 2px wider than the box it is painted
   into and the drawing comes out stretched horizontally -- circles turn into
   ellipses. And with box-sizing:border-box, style.height sets the OUTER height,
   so hand the border back or the bitmap is 2px taller than its box. */
function cvWidth(cv){ return Math.max(240, cv.clientWidth || Math.floor(cv.getBoundingClientRect().width)); }
function setSize(cv,wCss,hCss,dpr){
  cv.width=Math.round(wCss*dpr); cv.height=Math.round(hCss*dpr);
  cv.style.height=hCss+'px';
  const bh=cv.offsetHeight-cv.clientHeight;
  if(bh) cv.style.height=(hCss+bh)+'px';
}
/* Narrower than the width this drawing was composed for, scale the whole thing
   down instead of clamping the bitmap: same composition, just smaller, so the
   labels shrink together and nothing collides. At or above DESIGN_W, SCL is 1
   and every number below is exactly what it was. */
const DESIGN_W=360;
let SCL=1;
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const wCss = cvWidth(canvas);
  SCL = Math.min(1, wCss / DESIGN_W);
  const w = wCss / SCL;
  const h = Math.max(280, Math.min(w * 0.40, 380));
  setSize(canvas, wCss, h * SCL, dpr);
  ctx.setTransform(dpr*SCL,0,0,dpr*SCL,0,0);
  draw();
}
window.addEventListener('resize', fit);

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width/(dpr*SCL), h = canvas.height/(dpr*SCL);
  ctx.clearRect(0,0,w,h);

  const mL = 52, mR = 18, mT = 22, mB = 42;
  const pW = w-mL-mR, pH = h-mT-mB;
  const y0 = mT + pH/2;
  const G = state.gamma;
  const xFor = d => mL + (d/DMAX)*pW;
  const yFor = v => y0 - (v/AMP)*(pH/2);

  // grid
  ctx.strokeStyle = '#eef3f8'; ctx.lineWidth = 1;
  for (let v=-2; v<=2; v+=0.5) { ctx.beginPath(); ctx.moveTo(mL,yFor(v)); ctx.lineTo(mL+pW,yFor(v)); ctx.stroke(); }
  for (let d=0; d<=DMAX+1e-9; d+=0.25) { ctx.beginPath(); ctx.moveTo(xFor(d),mT); ctx.lineTo(xFor(d),mT+pH); ctx.stroke(); }
  ctx.strokeStyle = '#cddce9'; ctx.strokeRect(mL,mT,pW,pH);
  ctx.strokeStyle = '#9fb6cc'; ctx.beginPath(); ctx.moveTo(mL,y0); ctx.lineTo(mL+pW,y0); ctx.stroke();

  // ---- envelope band (region the instantaneous wave sweeps) ----
  const step = 0.004;
  ctx.fillStyle = 'rgba(0,74,133,0.08)';
  ctx.beginPath();
  for (let d=0; d<=DMAX+1e-9; d+=step) { const x=xFor(d), y=yFor(Venv(d,G)); (d===0)?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  for (let d=DMAX; d>=0; d-=step)      { const x=xFor(d), y=yFor(-Venv(d,G)); ctx.lineTo(x,y); }
  ctx.closePath(); ctx.fill();

  // envelope outline (upper + lower)
  ctx.strokeStyle = cssVar('--env'); ctx.lineWidth = 1.75; ctx.setLineDash([6,3]);
  for (const sgn of [1,-1]) {
    ctx.beginPath();
    for (let d=0; d<=DMAX+1e-9; d+=step) { const x=xFor(d), y=yFor(sgn*Venv(d,G)); (d===0)?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Vmax / Vmin reference lines
  const Vmax = 1+G, Vmin = 1-G;
  ctx.setLineDash([2,3]); ctx.lineWidth = 1;
  ctx.strokeStyle = cssVar('--env');
  ctx.beginPath(); ctx.moveTo(mL,yFor(Vmax)); ctx.lineTo(mL+pW,yFor(Vmax)); ctx.stroke();
  mixLabel(ctx,[{m:'V_{\\max}'},{s:' = '+Vmax.toFixed(2)}],mL+6,yFor(Vmax)-8,12,cssVar('--env'),'left',false);
  ctx.strokeStyle = cssVar('--node');
  ctx.beginPath(); ctx.moveTo(mL,yFor(Vmin)); ctx.lineTo(mL+pW,yFor(Vmin)); ctx.stroke();
  if (Vmin > 0.06) mixLabel(ctx,[{m:'V_{\\min}'},{s:' = '+Vmin.toFixed(2)}],mL+6,yFor(Vmin)-8,12,cssVar('--node'),'left',false);
  ctx.setLineDash([]);

  // node markers (minima) at d = 0.25 + 0.5n
  ctx.fillStyle = cssVar('--node');
  for (let d=0.25; d<=DMAX+1e-9; d+=0.5) {
    ctx.beginPath(); ctx.arc(xFor(d), y0, 3, 0, 2*Math.PI); ctx.fill();
  }

  // ---- optional forward / reflected components ----
  if (compEl.checked) {
    ctx.lineWidth = 1.5;
    for (const [fn, col] of [[Vfwd, cssVar('--fwd')], [(d,p)=>Vref(d,p,G), cssVar('--ref')]]) {
      ctx.strokeStyle = col; ctx.globalAlpha = 0.55; ctx.beginPath();
      for (let px=0; px<=pW; px++) { const d=(px/pW)*DMAX; const y=yFor(fn(d,state.phi)); (px===0)?ctx.moveTo(mL+px,y):ctx.lineTo(mL+px,y); }
      ctx.stroke(); ctx.globalAlpha = 1;
    }
  }

  // ---- instantaneous total wave ----
  ctx.strokeStyle = cssVar('--tot'); ctx.lineWidth = 2.75; ctx.beginPath();
  for (let px=0; px<=pW; px++) { const d=(px/pW)*DMAX; const y=yFor(Vtot(d,state.phi,G)); (px===0)?ctx.moveTo(mL+px,y):ctx.lineTo(mL+px,y); }
  ctx.stroke();

  // load marker at d=0
  mixLabel(ctx,[{s:'load '},{m:'(d=0)'}],xFor(0)+4,mT+9.5,12,cssVar('--navy'),'left',true);

  // axes labels + ticks
  ctx.fillStyle = '#5b6573'; ctx.font = '10px Inter, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let d=0; d<=DMAX+1e-9; d+=0.5) ctx.fillText(d.toFixed(2), xFor(d), y0+4);
  mixLabel(ctx,[{s:'distance from load '},{m:'d/\\lambda'}],mL+pW,h-12,13,'#3b4651','right',false);
  ctx.save(); ctx.translate(14, mT+pH/2); ctx.rotate(-Math.PI/2);
  mixLabel(ctx,[{s:'voltage '},{m:'(V^{+}=1)'}],0,0,13,'#3b4651','center',false);
  ctx.restore();

  updateReadout(G);
}

function updateReadout(G) {
  const vswr = (G >= 0.999) ? Infinity : (1+G)/(1-G);
  const rl   = (G <= 1e-4) ? Infinity : -20*Math.log10(G);
  document.getElementById('r-vswr').textContent  = (vswr===Infinity) ? '∞ : 1' : `${vswr.toFixed(2)} : 1`;
  document.getElementById('r-gam').textContent   = G.toFixed(2);
  document.getElementById('r-rl').textContent    = (rl===Infinity) ? '∞ dB' : `${rl.toFixed(1)} dB`;
  document.getElementById('r-refl').textContent  = `${(G*G*100).toFixed(1)} %`;
  document.getElementById('r-trans').textContent = `${((1-G*G)*100).toFixed(1)} %`;

  let txt, cls;
  // The cell clips overflow, so the rating has to stay short.
  if (vswr <= 1.05)      { txt = 'perfect';            cls = 'good'; }
  else if (vswr <= 1.5)  { txt = 'good';                cls = 'good'; }
  else if (vswr <= 2.0)  { txt = 'acceptable';          cls = 'warn'; }
  else if (vswr <= 3.0)  { txt = 'poor';                cls = 'bad';  }
  else                   { txt = 'bad match';           cls = 'bad';  }
  document.getElementById('rating').textContent = txt;
  for (const id of ['ro-rate','ro-vswr']) {
    const p = document.getElementById(id);
    p.classList.remove('good','warn','bad');
    p.classList.add(cls);
  }
}

fit();

MJ.setRedraw(()=>draw());
MJ.onReady(()=>{ MJ.typeset(document.body).then(()=>draw()); draw(); });
</script>
</body>
</html>
