<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gain builder — directivity, efficiency, mismatch</title>
<script src="mjlabel.js"></script>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573;
          --amber:#8a5a00; --red:#b01e24; --grn:#3f7d34;
          --dir:#004a85;   /* directivity bar */
          --gain:#0067b9;  /* gain bar */
          --real:#4aa3df;  /* realized gain bar */
          --eff:#8a5a00;   /* efficiency loss */
          --mis:#b3213a; } /* mismatch loss */
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:flex; flex-direction:column; gap:10px; padding:14px; }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px; }
  .controls { display:grid; grid-template-columns:repeat(3,1fr); gap:9px 18px; align-items:center;
              padding:9px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  @media (max-width:700px) { .controls { grid-template-columns:1fr; } }
  .ctl { display:flex; align-items:center; gap:8px; min-width:0; overflow:hidden; }
  .ctl label { font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl .val { color:var(--navy); font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:58px; text-align:right; }
  .ctl input[type=range]{ flex:1 1 auto; min-width:80px; accent-color:var(--mid); }
  /* Readouts as a row of instruments: equal-width cells on one grid, labels and
     values on shared baselines, edges flush with the canvases above. */
  .readouts { display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(148px, 1fr)); }
  .ro { display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
        gap:4px; padding:7px 8px 8px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  /* block, not flex: a flex container drops the whitespace between an inline
     MathJax symbol and the words that follow it, welding them together. */
  .ro .k { display:block; text-align:center;
           height:15px; line-height:15px; font-size:10.5px; font-weight:700;
           text-transform:uppercase; letter-spacing:0.045em; color:var(--ink3);
           white-space:nowrap; overflow:hidden; }
  .ro .k mjx-container { font-size:inherit !important; }
  .ro .v { height:19px; line-height:19px; font-size:14.5px; font-weight:700; white-space:nowrap;
           font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
           text-align:center; min-width:8ch; color:var(--navy); }
  .ro.loss  { background:rgba(138,90,0,0.12);  border-color:rgba(138,90,0,0.30); }
  .ro.loss  .v { color:var(--amber); }
  .ro.loss2 { background:rgba(176,30,36,0.10); border-color:rgba(176,30,36,0.28); }
  .ro.loss2 .v { color:var(--red); }
  .hint { margin:0; text-align:center; font-size:12px; color:var(--ink3); }
</style>
</head>
<body>
<div class="app">
  <canvas id="plot" aria-label="Gain budget bars"></canvas>

  <div class="controls">
    <div class="ctl">
      <label>Directivity \(D\)</label>
      <input type="range" id="dir" min="0" max="30" step="0.5" value="15">
      <span class="val" id="d-val">15.0 dBi</span>
    </div>
    <div class="ctl">
      <label>Efficiency \(\eta_{\text{rad}}\)</label>
      <input type="range" id="eta" min="5" max="100" step="1" value="70">
      <span class="val" id="eta-val">70 %</span>
    </div>
    <div class="ctl">
      <label>Mismatch \(\lvert\Gamma\rvert\)</label>
      <input type="range" id="gam" min="0" max="0.9" step="0.01" value="0.3">
      <span class="val" id="gam-val">0.30</span>
    </div>
  </div>

  <div class="readouts">
    <div class="ro"><span class="k">directivity \(D\)</span><span class="v" id="p-dir">—</span></div>
    <div class="ro loss"><span class="k">efficiency loss</span><span class="v" id="p-eff">—</span></div>
    <div class="ro"><span class="k">gain \(G\)</span><span class="v" id="p-gain">—</span></div>
    <div class="ro loss2"><span class="k">mismatch loss</span><span class="v" id="p-mis">—</span></div>
    <div class="ro"><span class="k">realized gain</span><span class="v" id="p-real">—</span></div>
    <div class="ro"><span class="k">VSWR</span><span class="v" id="p-vswr">—</span></div>
  </div>

  <p class="hint">\(G = \eta_{\text{rad}}\,D\) &nbsp;·&nbsp; \(G_{\text{re}} = (1-\lvert\Gamma\rvert^2)\,G\) &nbsp;·&nbsp; reflected power <span id="p-refl">—</span></p>
</div>

<script>
'use strict';
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---- labels: MathJax for math, sans UI font for words/units ----
const SANS='Inter, system-ui, -apple-system, sans-serif';
const mtext=(ctx,tex,x,y,h,color,align)=>MJ.draw(ctx,tex,x,y,h,color,align);
function stext(ctx,str,x,y,px,color,align,bold){ ctx.fillStyle=color; ctx.font=(bold?'700 ':'')+px+'px '+SANS; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(str,x,y); }
function mixLabel(ctx,chunks,x,yc,h,color,align,bold){
  const fpx=h-1, f=(bold?'700 ':'')+fpx+'px '+SANS;
  let tot=0;
  for(const c of chunks){ if(c.m) tot+=MJ.width(c.m,color,h); else { ctx.font=f; tot+=ctx.measureText(c.s).width; } }
  let cx = align==='right'? x-tot : (align==='center'? x-tot/2 : x);
  for(const c of chunks){
    if(c.m){ MJ.draw(ctx,c.m,cx,yc,h,color,'left'); cx+=MJ.width(c.m,color,h); }
    else { stext(ctx,c.s,cx,yc,fpx,color,'left',bold); ctx.font=f; cx+=ctx.measureText(c.s).width; }
  }
}

const state = { D: 15.0, eta: 0.70, gam: 0.30 };
const DMAX = 30;

function derived() {
  const D = state.D;                       // dBi
  const effLoss = -10 * Math.log10(state.eta);        // positive dB
  const G = D - effLoss;                    // dBi
  const misLoss = -10 * Math.log10(1 - state.gam * state.gam); // positive dB
  const Gre = G - misLoss;                  // dBi
  const vswr = (state.gam >= 0.999) ? Infinity : (1 + state.gam) / (1 - state.gam);
  return { D, effLoss, G, misLoss, Gre, vswr };
}

// controls
const dirEl = document.getElementById('dir');
const etaEl = document.getElementById('eta');
const gamEl = document.getElementById('gam');
const dVal = document.getElementById('d-val');
const etaVal = document.getElementById('eta-val');
const gamVal = document.getElementById('gam-val');

dirEl.addEventListener('input', () => { state.D = parseFloat(dirEl.value); dVal.textContent = state.D.toFixed(1)+' dBi'; draw(); });
etaEl.addEventListener('input', () => { state.eta = parseFloat(etaEl.value) / 100; etaVal.textContent = etaEl.value+' %'; draw(); });
gamEl.addEventListener('input', () => { state.gam = parseFloat(gamEl.value); gamVal.textContent = state.gam.toFixed(2); draw(); });

const canvas = document.getElementById('plot');
const ctx = canvas.getContext('2d');

/* clientWidth, not getBoundingClientRect(): the rect includes the 1px border on
   each side, so a bitmap sized from it is 2px wider than the box it is painted
   into and the drawing comes out stretched horizontally -- circles turn into
   ellipses. And with box-sizing:border-box, style.height sets the OUTER height,
   so hand the border back or the bitmap is 2px taller than its box. */
function cvWidth(cv){ return Math.max(240, cv.clientWidth || Math.floor(cv.getBoundingClientRect().width)); }
function setSize(cv,wCss,hCss,dpr){
  cv.width=Math.round(wCss*dpr); cv.height=Math.round(hCss*dpr);
  cv.style.height=hCss+'px';
  const bh=cv.offsetHeight-cv.clientHeight;
  if(bh) cv.style.height=(hCss+bh)+'px';
}
/* Narrower than the width this drawing was composed for, scale the whole thing
   down instead of clamping the bitmap: same composition, just smaller, so the
   labels shrink together and nothing collides. At or above DESIGN_W, SCL is 1
   and every number below is exactly what it was. */
const DESIGN_W=360;
let SCL=1;
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const wCss = cvWidth(canvas);
  SCL = Math.min(1, wCss / DESIGN_W);
  const w = wCss / SCL;
/* Narrow: the canvases and the control/readout rows stack, so the parts ADD
   instead of sharing a row -- which puts the widget past the frame budget and
   makes it scroll inside its own iframe. Every curve and control stays; the
   canvas just gets a shorter design box. Shrinking the design height rather
   than the bitmap keeps text full size and the composition undistorted. */
var __SQ_MQ = window.matchMedia ? window.matchMedia('(max-width:430px)') : null;
function SQ(h){ return (__SQ_MQ && __SQ_MQ.matches) ? Math.round(h * 0.62) : h; }
  const h = SQ(Math.max(200, Math.min(w * 0.28, 250)));
  setSize(canvas, wCss, h * SCL, dpr);
  ctx.setTransform(dpr * SCL, 0, 0, dpr * SCL, 0, 0);
  draw();
}
window.addEventListener('resize', fit);

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width / (dpr * SCL), h = canvas.height / (dpr * SCL);
  ctx.clearRect(0, 0, w, h);
  const d = derived();

  const mL = 128, mR = 24, mT = 30, mB = 40;
  const pW = w - mL - mR, pH = h - mT - mB;
  const xFor = v => mL + (Math.max(0, Math.min(v, DMAX)) / DMAX) * pW;

  // grid + axis ticks (dBi)
  ctx.strokeStyle = '#eef3f8'; ctx.lineWidth = 1;
  ctx.fillStyle = '#5b6573'; ctx.font = '10px Inter, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let v = 0; v <= DMAX; v += 5) {
    ctx.beginPath(); ctx.moveTo(xFor(v), mT); ctx.lineTo(xFor(v), mT + pH); ctx.stroke();
    ctx.fillText(v.toFixed(0), xFor(v), mT + pH + 6);
  }
  ctx.fillStyle = '#3b4651'; ctx.font = '600 12px Inter, sans-serif';
  ctx.fillText('dBi', mL + pW / 2, mT + pH + 22);

  // three bars
  const rows = [
    { y: mT + 8,             val: d.D,   col: cssVar('--dir'),  chunks: [{s:'Directivity '},{m:'D'}] },
    { y: mT + pH / 2 - 15,   val: d.G,   col: cssVar('--gain'), chunks: [{s:'Gain '},{m:'G=\\eta\\cdot D'}] },
    { y: mT + pH - 38,       val: d.Gre, col: cssVar('--real'), chunks: [{s:'Realized gain'}] },
  ];
  const barH = 30;

  // guide lines at bar-end x positions (D and G) to show where losses bite
  ctx.setLineDash([4, 3]); ctx.lineWidth = 1.2;
  ctx.strokeStyle = cssVar('--eff');
  ctx.beginPath(); ctx.moveTo(xFor(d.D), rows[0].y); ctx.lineTo(xFor(d.D), rows[1].y + barH); ctx.stroke();
  ctx.strokeStyle = cssVar('--mis');
  ctx.beginPath(); ctx.moveTo(xFor(d.G), rows[1].y); ctx.lineTo(xFor(d.G), rows[2].y + barH); ctx.stroke();
  ctx.setLineDash([]);

  for (const r of rows) {
    // bar
    ctx.fillStyle = r.col;
    const x0 = xFor(0), x1 = xFor(r.val);
    ctx.fillRect(x0, r.y, Math.max(0, x1 - x0), barH);
    // row label (left)
    mixLabel(ctx, r.chunks, mL - 10, r.y + barH / 2, 13, '#3b4651', 'right', true);
    // value at bar end
    ctx.fillStyle = '#fff'; ctx.font = '700 12.5px Inter, sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const txt = `${r.val.toFixed(1)} dBi`;
    if (x1 - x0 > 62) ctx.fillText(txt, x1 - 8, r.y + barH / 2);
    else { ctx.fillStyle = r.col; ctx.textAlign = 'left'; ctx.fillText(txt, x1 + 6, r.y + barH / 2); }
  }

  // loss double-arrows in the empty tails
  function lossArrow(y, xa, xb, color, chunks) {
    if (xb - xa < 2) return;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([]);
    const yc = y;
    ctx.beginPath(); ctx.moveTo(xa, yc); ctx.lineTo(xb, yc); ctx.stroke();
    const hd = 4.5;
    for (const [x, dir] of [[xa, -1], [xb, 1]]) {
      ctx.beginPath(); ctx.moveTo(x, yc);
      ctx.lineTo(x - dir * hd, yc - hd * 0.85); ctx.lineTo(x - dir * hd, yc + hd * 0.85);
      ctx.closePath(); ctx.fill();
    }
    mixLabel(ctx, chunks, (xa + xb) / 2, yc - 10, 12, color, 'center', true);
  }
  // efficiency loss: on the Gain row's tail, from x(G) to x(D)
  lossArrow(rows[1].y - 4, xFor(d.G), xFor(d.D), cssVar('--eff'),
            [{s:'− '+d.effLoss.toFixed(1)+' dB '},{m:'(\\eta = '+(state.eta * 100).toFixed(0)+'\\%)'}]);
  // mismatch loss: on the Realized row's tail, from x(Gre) to x(G)
  lossArrow(rows[2].y - 4, xFor(d.Gre), xFor(d.G), cssVar('--mis'),
            [{s:'− '+d.misLoss.toFixed(1)+' dB '},{m:'(\\lvert\\Gamma\\rvert = '+state.gam.toFixed(2)+')'}]);

  updateReadout(d);
}

function updateReadout(d) {
  document.getElementById('p-dir').textContent  = `${d.D.toFixed(1)} dBi`;
  document.getElementById('p-eff').textContent  = `− ${d.effLoss.toFixed(1)} dB`;
  document.getElementById('p-gain').textContent = `${d.G.toFixed(1)} dBi`;
  document.getElementById('p-mis').textContent  = `− ${d.misLoss.toFixed(1)} dB`;
  document.getElementById('p-real').textContent = `${d.Gre.toFixed(1)} dBi`;
  document.getElementById('p-vswr').textContent = (d.vswr === Infinity) ? '∞:1' : `${d.vswr.toFixed(2)}:1`;
  document.getElementById('p-refl').textContent = `${(state.gam * state.gam * 100).toFixed(1)} %`;
}

fit();

MJ.setRedraw(()=>draw());
MJ.onReady(()=>{ MJ.typeset(document.body).then(()=>draw()); draw(); });
</script>
</body>
</html>
