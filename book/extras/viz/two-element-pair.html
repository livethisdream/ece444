<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two elements, far apart and close together</title>
<script src="mjlabel.js"></script>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573;
          --amber:#8a5a00; --red:#b01e24; --grn:#3f7d34; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:flex; flex-direction:column; gap:8px; padding:12px; }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px; }
  /* Side by side above 620px; below it the two canvases stack and the design
     box shortens (fit() scales the height, never the bitmap alone). */
  .cv2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; }
  @media (max-width:619px) { .cv2 { grid-template-columns:1fr; } }
  .legend { display:flex; flex-wrap:wrap; justify-content:center; gap:4px 16px; font-size:11.5px; color:var(--ink3); }
  .legend span { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .legend i { display:inline-block; width:22px; height:0; border-top:2px solid; }
  .controls { display:flex; align-items:center; gap:8px 14px; flex-wrap:wrap;
              padding:7px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  .ctl { display:flex; align-items:center; gap:8px; flex:1 1 260px; min-width:0; }
  .ctl label, .chk, .sel label { font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl .val { color:var(--navy); font-variant-numeric:tabular-nums; white-space:nowrap; min-width:48px; }
  .ctl input[type=range] { flex:1 1 auto; min-width:90px; accent-color:var(--mid); }
  .sel { display:flex; align-items:center; gap:6px; }
  select { font:inherit; font-size:12px; color:var(--navy); border:1px solid var(--edge2); border-radius:5px; background:#fff; padding:2px 4px; }
  .chk { display:flex; align-items:center; gap:6px; }
  .btns { display:flex; gap:6px; }
  button { font:inherit; font-size:12px; font-weight:600; padding:3px 10px; border-radius:5px;
           border:1px solid var(--edge2); background:#fff; color:var(--navy); cursor:pointer; }
  button:hover { background:var(--bg); }
  @media (max-width:430px) {
    .app { padding:8px; gap:6px; }
    .controls { padding:6px 8px; gap:6px 10px; }
    .ctl { flex:1 1 100%; }
    .btns { flex:1 1 100%; }
    .btns button { flex:1 1 0; }
  }
  .readouts { display:grid; gap:6px; grid-template-columns:repeat(3, minmax(0,1fr)); }
  .ro { display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 4px 6px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  .ro .k { display:block; text-align:center; height:15px; line-height:15px; font-size:10.5px; font-weight:700;
           text-transform:uppercase; letter-spacing:0.04em; color:var(--ink3); white-space:nowrap; overflow:hidden; max-width:100%; }
  .ro .k mjx-container { font-size:inherit !important; }
  .ro .v { height:19px; line-height:19px; font-size:14.5px; font-weight:700; white-space:nowrap;
           font-variant-numeric:tabular-nums; color:var(--navy); }
  .state { margin:0; text-align:center; font-size:12px; font-weight:700; color:var(--ink3); min-height:15px; }
  .state.ok { color:var(--grn); }
  .state.hot { color:var(--amber); }
</style>
</head>
<body>
<div class="app">
  <div class="cv2">
    <canvas id="map" aria-label="Top-down map of the field around two elements on a horizontal line. Each element radiates a wave; where the waves overlap they interfere. A dashed circle marks where the pair's far field begins, when it fits on the map."></canvas>
    <canvas id="pol" aria-label="Far-field power pattern of the pair in front of the array, from minus 90 to plus 90 degrees, in multiples of one element's peak power: one element alone, the two powers added, and the two fields added."></canvas>
  </div>
  <div class="legend">
    <span><i style="border-top:2px dashed #8b95a3"></i>one element</span>
    <span><i style="border-color:#8a5a00; border-top-style:dashed"></i>powers add (each its own pattern)</span>
    <span><i style="border-color:#004a85; border-top-width:2.5px"></i>fields add</span>
  </div>
  <div class="controls">
    <div class="ctl">
      <label for="d">Spacing \(d/\lambda\)</label>
      <input type="range" id="d" min="0.25" max="6" step="0.05" value="4">
      <span class="val" id="d-val">4.00</span>
    </div>
    <div class="sel">
      <label for="el">Element</label>
      <select id="el">
        <option value="dip" selected>short dipole</option>
        <option value="iso">isotropic</option>
      </select>
    </div>
    <label class="chk"><input type="checkbox" id="anim"> animate</label>
    <div class="btns">
      <button id="far" type="button">far apart</button>
      <button id="half" type="button">&#955;/2</button>
    </div>
  </div>
  <div class="readouts">
    <div class="ro"><span class="k">lobes in front</span><span class="v" id="r-lobes">&#8212;</span></div>
    <div class="ro"><span class="k">main lobe width</span><span class="v" id="r-bw">&#8212;</span></div>
    <div class="ro"><span class="k">far field from</span><span class="v" id="r-ff">&#8212;</span></div>
  </div>
  <p class="state" id="r-state">&#8212;</p>
</div>
<script>
'use strict';
const SANS='Inter, system-ui, -apple-system, sans-serif';
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function stext(ctx,s,x,y,px,color,align,bold){ ctx.fillStyle=color; ctx.font=(bold?'700 ':'')+px+'px '+SANS; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(s,x,y); }
const GRAY='#8b95a3';
const state={ d:4, el:'dip', anim:false };
const SPAN=7;                       // half-width of the map, in wavelengths

/* ---- far field. theta is the scan angle from broadside, as in the lesson.
   The two elements sit on the x axis, so the array factor of the pair is
   |AF| = |2 cos(pi d sin(theta) / lambda)|, and pattern multiplication gives
   the pair's power as |EF|^2 |AF|^2. A short dipole lying along the array
   axis has EF = cos(theta), Lesson 16's worked example. Everything is in
   multiples of one element's peak power, so the fields-add peak is 4 and the
   powers-add curve, two elements that ignore each other, is 2|EF|^2. */
function ef2(th){ return state.el==='dip' ? Math.cos(th)**2 : 1; }
function af2(th){ const c=Math.cos(Math.PI*state.d*Math.sin(th)); return 4*c*c; }
function pair(th){ return ef2(th)*af2(th); }

/* ---- the map: every element a spherical wave, 1/r, cut by the plane of the
   array, summed on a coarse grid. 1/r, not a cylindrical 1/sqrt(r): close to
   one element its own wave has to dominate, or the far-apart case shows only
   fringes and never each element's own pattern.
   As in interference-field.html, C and S (the in-phase and quadrature sums)
   are computed once per geometry and a frame is one multiply-add per cell. */
const map=document.getElementById('map'), mctx=map.getContext('2d');
const pol=document.getElementById('pol'), pctx=pol.getContext('2d');
let MW=0, MH=0, pxPerL=1, PW=0, PH=0, t0=performance.now();
const tmp=document.createElement('canvas'), tctx=tmp.getContext('2d');
let grid={ key:'' };
function computeField(){
  const cell=Math.max(2.2, MH/100);
  const cols=Math.ceil(MW/cell), rows=Math.ceil(MH/cell);
  const key=[MW,MH,state.d,state.el].join('|');
  if(grid.key===key) return;
  const C=new Float32Array(cols*rows), S=new Float32Array(cols*rows), k=2*Math.PI;
  const xs=[-state.d/2, state.d/2];
  for(let r=0;r<rows;r++){
    const y=-((r+0.5)*cell-MH/2)/pxPerL;
    for(let c=0;c<cols;c++){
      const x=((c+0.5)*cell-MW/2)/pxPerL;
      let re=0, im=0;
      for(const x0 of xs){
        const rr=Math.hypot(x-x0,y)+0.08, p=-k*rr;
        // element factor seen from this element: cos of the angle off broadside
        const a=(1/rr)*(state.el==='dip' ? Math.abs(y)/rr : 1);
        re+=a*Math.cos(p); im+=a*Math.sin(p);
      }
      const o=r*cols+c; C[o]=re; S[o]=im;
    }
  }
  grid={ key, cols, rows, cell, C, S };
  if(tmp.width!==cols||tmp.height!==rows){ tmp.width=cols; tmp.height=rows; }
}
function drawMap(now){
  computeField();
  const { cols, rows, cell, C, S } = grid;
  const img=tctx.createImageData(cols,rows), px=img.data;
  const wt=state.anim ? ((now-t0)/1000)*2*Math.PI*0.45 : 0;
  const cw=Math.cos(wt), sw=Math.sin(wt), norm=0.7;
  const A=[0,74,133], B=[176,110,20];
  for(let o=0;o<cols*rows;o++){
    let v = state.anim ? (C[o]*cw - S[o]*sw)/norm : Math.hypot(C[o],S[o])/norm;
    if(v>1) v=1; else if(v<-1) v=-1;
    const m=Math.pow(Math.abs(v), state.anim?0.6:0.85), col=(v>=0||!state.anim)?A:B, q=4*o;
    px[q]=255+(col[0]-255)*m; px[q+1]=255+(col[1]-255)*m; px[q+2]=255+(col[2]-255)*m; px[q+3]=255;
  }
  tctx.putImageData(img,0,0);
  mctx.clearRect(0,0,MW,MH);
  mctx.imageSmoothingEnabled=true;
  mctx.drawImage(tmp,0,0,cols,rows,0,0,cols*cell,rows*cell);
  const ox=MW/2, oy=MH/2;
  // where the pair's far field begins, 2d^2/lambda from the center, if it fits
  const ff=2*state.d*state.d*pxPerL;
  if(ff < Math.hypot(MW,MH)/2){
    mctx.strokeStyle='rgba(21,32,43,0.7)'; mctx.lineWidth=1.2; mctx.setLineDash([3,4]);
    mctx.beginPath(); mctx.arc(ox,oy,ff,0,7); mctx.stroke(); mctx.setLineDash([]);
  }
  // the array axis and the two elements
  mctx.strokeStyle='rgba(21,32,43,0.35)'; mctx.lineWidth=1;
  mctx.beginPath(); mctx.moveTo(4,oy); mctx.lineTo(MW-4,oy); mctx.stroke();
  for(const x0 of [-state.d/2, state.d/2]){
    const x=ox+x0*pxPerL;
    mctx.fillStyle=cssv('--red'); mctx.beginPath(); mctx.arc(x,oy,4.2,0,7); mctx.fill();
    mctx.strokeStyle='#fff'; mctx.lineWidth=1.5; mctx.stroke();
  }
  tag(mctx,'±'+SPAN+' λ', MW-6, MH-12, 'right');
  tag(mctx,'broadside ↑', 6, 12, 'left');
}

// a small label on a white card, legible over the field map
function tag(ctx,s,x,y,align){
  ctx.font='10.5px '+SANS; const tw=ctx.measureText(s).width, x0=align==='right'?x-tw-6:x;
  ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fillRect(x0,y-8,tw+6,16);
  stext(ctx,s,x0+3,y,10.5,cssv('--ink3'),'left',false);
}

/* ---- the far-field polar plot: front half, linear power. */
function drawPol(){
  const w=PW, h=PH, ctx=pctx;
  ctx.clearRect(0,0,w,h);
  const lab=10.5, cx=w/2, cy=h-18;
  const R=Math.max(40, Math.min(w/2-30, cy-22));
  const at=(th,v)=>[cx+Math.sin(th)*R*v/4, cy-Math.cos(th)*R*v/4];
  // rings at 1, 2, 3, 4 times one element's peak
  ctx.lineWidth=1;
  for(let v=1;v<=4;v++){
    ctx.strokeStyle=v===4?'#b9d2e5':'#e1eaf2';
    ctx.beginPath(); ctx.arc(cx,cy,R*v/4,Math.PI,2*Math.PI); ctx.stroke();
  }
  for(let a=-90;a<=90;a+=30){
    const th=a*Math.PI/180;
    ctx.strokeStyle='#e1eaf2'; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(...at(th,4)); ctx.stroke();
    const [x,y]=[cx+Math.sin(th)*(R+12), cy-Math.cos(th)*(R+10)];
    stext(ctx, a+'°', x, Math.min(y, cy), lab, cssv('--ink3'), a<0?'right':(a>0?'left':'center'));
  }
  ctx.beginPath(); ctx.moveTo(cx-R-2,cy); ctx.lineTo(cx+R+2,cy); ctx.strokeStyle='#b9d2e5'; ctx.stroke();
  // ring labels under the baseline, where each ring meets it
  for(const v of [1,2,4]) stext(ctx, v+'×', cx+R*v/4, cy+9, lab, cssv('--ink3'),'center');
  function curve(f,color,width,dash){
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.setLineDash(dash||[]);
    ctx.beginPath();
    const n=720;
    for(let i=0;i<=n;i++){ const th=-Math.PI/2+Math.PI*i/n, [x,y]=at(th,f(th)); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.stroke(); ctx.setLineDash([]);
  }
  curve(ef2, GRAY, 1.6, [4,3]);
  curve(th=>2*ef2(th), cssv('--amber'), 1.8, [6,4]);
  curve(pair, cssv('--navy'), 2.2);
  stext(ctx,'far field', 8, 11, lab, cssv('--ink3'),'left',false);
}

/* ---- readouts */
function readouts(){
  const n=1440, v=[];
  for(let i=0;i<=n;i++) v.push(pair(-Math.PI/2+Math.PI*i/n));
  const peak=v[n/2];
  let lobes=0;
  for(let i=1;i<n;i++) if(v[i]>v[i-1] && v[i]>=v[i+1] && v[i]>1e-3*peak) lobes++;
  // half-power width of the broadside lobe
  let j=n/2; while(j<n && v[j]>=peak/2) j++;
  const bw = j>=n ? null : 2*(j-n/2)*180/n;
  document.getElementById('r-lobes').textContent=lobes;
  document.getElementById('r-bw').textContent= bw===null ? '> 180°' : bw.toFixed(1)+'°';
  const ff=2*state.d*state.d;
  document.getElementById('r-ff').textContent=(ff<10?ff.toFixed(1):ff.toFixed(0))+' λ';
  const st=document.getElementById('r-state');
  if(lobes>=5){ st.className='state hot'; st.textContent='far apart: lobes too fine to resolve; on average, each its own pattern'; }
  else if(lobes===1){ st.className='state ok'; st.textContent='close together: one beam, 4× one element at broadside'; }
  else { st.className='state'; st.textContent='the fields add: 4× at broadside, 0 at the nulls'; }
}

/* ---- sizing: side by side, the map is a little wider than tall; stacked on
   a phone, both design boxes shorten so the stack fits the frame. */
function setSize(c,wCss,hCss,dpr){
  c.width=Math.round(wCss*dpr); c.height=Math.round(hCss*dpr); c.style.height=hCss+'px';
  const bh=c.offsetHeight-c.clientHeight; if(bh) c.style.height=(hCss+bh)+'px';
}
const STACK=window.matchMedia ? window.matchMedia('(max-width:619px)') : null;
function fit(){
  const dpr=window.devicePixelRatio||1, stacked=STACK && STACK.matches;
  const mw=Math.max(200, map.clientWidth), pw=Math.max(200, pol.clientWidth);
  const mh=stacked ? Math.round(Math.min(mw*0.5, 190)) : Math.round(Math.min(mw*0.78, 300));
  const ph=stacked ? Math.round(Math.min(pw*0.5+36, 180)) : mh;
  setSize(map,mw,mh,dpr); mctx.setTransform(dpr,0,0,dpr,0,0);
  setSize(pol,pw,ph,dpr); pctx.setTransform(dpr,0,0,dpr,0,0);
  MW=mw; MH=mh; PW=pw; PH=ph; pxPerL=(MW/2)/SPAN;
  drawAll();
}
function drawAll(){ drawMap(performance.now()); drawPol(); readouts(); }
window.addEventListener('resize', fit);
let last=0, visible=true;
if('IntersectionObserver' in window){
  new IntersectionObserver(es=>{ es.forEach(e=>{ visible=e.isIntersecting; }); }, {threshold:0.05}).observe(map);
}
function loop(now){
  if(state.anim && visible && !document.hidden && now-last>50){ last=now; drawMap(now); }
  requestAnimationFrame(loop);
}
const dEl=document.getElementById('d'), elEl=document.getElementById('el'), animEl=document.getElementById('anim');
function setD(d){ state.d=d; dEl.value=d; document.getElementById('d-val').textContent=d.toFixed(2); drawAll(); }
dEl.addEventListener('input',()=>setD(+dEl.value));
elEl.addEventListener('change',()=>{ state.el=elEl.value; drawAll(); });
animEl.addEventListener('change',()=>{ state.anim=animEl.checked; drawAll(); });
document.getElementById('far').addEventListener('click',()=>setD(4));
document.getElementById('half').addEventListener('click',()=>setD(0.5));
// a preset by query string: ?d=0.5&el=iso
(function(){
  const q=new URLSearchParams(location.search);
  if(q.has('d')){ const d=Math.min(6,Math.max(0.25,+q.get('d'))); if(isFinite(d)) state.d=d; }
  if(q.get('el')==='iso'||q.get('el')==='dip'){ state.el=q.get('el'); }
  dEl.value=state.d; elEl.value=state.el;
  document.getElementById('d-val').textContent=state.d.toFixed(2);
})();
if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ state.anim=false; animEl.checked=false; }
fit();
requestAnimationFrame(loop);
MJ.setRedraw(drawAll);
MJ.onReady(()=>{ MJ.typeset(document.body).then(drawAll); drawAll(); });
</script>
</body>
</html>
