<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field-region explorer</title>
<script src="mjlabel.js"></script>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573; --react:#8a5a00; --rad:#0067b9; --far:#004a85; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:flex; flex-direction:column; gap:12px; padding:16px; }
  canvas { display:block; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px; }
  .controls { display:flex; align-items:center; gap:16px; flex-wrap:wrap;
              padding:8px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  .ctl { display:flex; align-items:center; gap:8px; flex:1 1 240px; }
  .ctl label { font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl .val { color:var(--navy); font-variant-numeric:tabular-nums; }
  .ctl input[type=range]{ flex:1 1 auto; min-width:110px; }
  .pills { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .pill { padding:4px 12px; background:rgba(0,103,185,0.12); border:1px solid rgba(0,103,185,0.30);
          color:#0067b9; border-radius:1em; font-size:12px; font-weight:600; white-space:nowrap;
          font-variant-numeric:tabular-nums; display:inline-flex; align-items:center; gap:5px; }
  .pill b { color:#004a85; font-weight:700; }
</style>
</head>
<body>
<div class="app">
  <canvas id="ruler" aria-label="Field regions on a distance axis"></canvas>

  <div class="controls">
    <div class="ctl"><label>Size \(D\)</label><input type="range" id="d" min="0.05" max="3" step="0.05" value="1.2"><span class="val" id="d-val">1.2 m</span></div>
    <div class="ctl"><label>Freq \(f\)</label><input type="range" id="f" min="0.3" max="30" step="0.1" value="10"><span class="val" id="f-val">10 GHz</span></div>
  </div>

  <div class="pills">
    <span class="pill">\(\lambda\) = <b id="r-lam">—</b></span>
    <span class="pill">reactive \(0.62\sqrt{D^3/\lambda}\) = <b id="r-re">—</b></span>
    <span class="pill">far-field \(2D^2/\lambda\) = <b id="r-ff">—</b></span>
  </div>
</div>

<script>
'use strict';
const SANS='Inter, system-ui, -apple-system, sans-serif';
function stext(ctx,s,x,y,px,color,align,bold){ ctx.fillStyle=color; ctx.font=(bold?'700 ':'')+px+'px '+SANS; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(s,x,y); }

const C=3e8;
const cv=document.getElementById('ruler'), ctx=cv.getContext('2d');
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const state={ D:1.2, f:10e9 };

function fmt(r){ // metres, human
  if(r>=1000) return (r/1000).toFixed(2)+' km';
  if(r>=1) return r.toFixed(r<10?2:1)+' m';
  if(r>=0.01) return (r*100).toFixed(1)+' cm';
  return (r*1000).toFixed(1)+' mm';
}
function derived(){
  const lam=C/state.f;
  const rRe=0.62*Math.sqrt(state.D**3/lam);
  const rFf=2*state.D**2/lam;
  return {lam,rRe,rFf};
}

const dEl=document.getElementById('d'), fEl=document.getElementById('f'),
      dV=document.getElementById('d-val'), fV=document.getElementById('f-val');
dEl.addEventListener('input',()=>{ state.D=+dEl.value; dV.textContent=state.D.toFixed(2)+' m'; draw(); });
fEl.addEventListener('input',()=>{ state.f=(+fEl.value)*1e9; fV.textContent=(+fEl.value).toFixed(1)+' GHz'; draw(); });

function fit(){
  const dpr=window.devicePixelRatio||1;
  const w=Math.max(360, cv.getBoundingClientRect().width);
  const h=Math.max(150, Math.min(w*0.32, 210));
  cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0); draw();
}
window.addEventListener('resize', fit);

function draw(){
  const dpr=window.devicePixelRatio||1;
  const w=cv.width/dpr, h=cv.height/dpr;
  ctx.clearRect(0,0,w,h);
  const d=derived();

  const mL=46, mR=28, mT=52, sH=42;
  const plotW=w-mL-mR, sY=mT;
  const lo=Math.max(1e-4, d.rRe/4), hi=d.rFf*4;
  const l10=Math.log10, L0=l10(lo), L1=l10(hi);
  const xFor=r=>mL + (l10(Math.max(r,lo))-L0)/(L1-L0)*plotW;
  const xr=xFor(d.rRe), xf=xFor(d.rFf), xEnd=mL+plotW;

  // region bands
  ctx.fillStyle='rgba(138,90,0,0.16)'; ctx.fillRect(mL, sY, xr-mL, sH);
  ctx.fillStyle='rgba(0,103,185,0.12)'; ctx.fillRect(xr, sY, xf-xr, sH);
  ctx.fillStyle='rgba(0,74,133,0.06)'; ctx.fillRect(xf, sY, xEnd-xf, sH);
  ctx.strokeStyle=cssv('--edge'); ctx.lineWidth=1; ctx.strokeRect(mL, sY, plotW, sH);

  // boundary lines + labels above
  function bound(x, color, tex, val){
    ctx.strokeStyle=color; ctx.lineWidth=1.6; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(x, sY-14); ctx.lineTo(x, sY+sH+6); ctx.stroke(); ctx.setLineDash([]);
    MJ.draw(ctx, tex, x, sY-30, 12, color, 'center');
    stext(ctx, val, x, sY-16, 11, color, 'center', true);
  }
  // zone labels (sans, centered in each band)
  stext(ctx,'reactive', (mL+xr)/2, sY+sH/2, 11.5, cssv('--react'),'center',true);
  stext(ctx,'radiating near-field', (xr+xf)/2, sY+sH/2, 11.5, cssv('--rad'),'center',true);
  stext(ctx,'far-field', (xf+xEnd)/2, sY+sH/2, 11.5, cssv('--far'),'center',true);

  // log decade ticks
  ctx.fillStyle=cssv('--ink3');
  const d0=Math.ceil(L0), d1=Math.floor(L1);
  for(let e=d0;e<=d1;e++){ const rv=Math.pow(10,e); const x=xFor(rv);
    ctx.strokeStyle=cssv('--edge2'); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x, sY+sH); ctx.lineTo(x, sY+sH+5); ctx.stroke();
    stext(ctx, fmt(rv), x, sY+sH+15, 10, cssv('--ink3'),'center',false);
  }
  // antenna marker at left
  stext(ctx,'antenna', mL, sY+sH+15, 10, cssv('--ink3'),'left',false);

  bound(xr, cssv('--react'), '0.62\\sqrt{D^3/\\lambda}', fmt(d.rRe));
  bound(xf, cssv('--rad'), '2D^2/\\lambda', fmt(d.rFf));

  // update pills
  document.getElementById('r-lam').textContent=fmt(d.lam);
  document.getElementById('r-re').textContent=fmt(d.rRe);
  document.getElementById('r-ff').textContent=fmt(d.rFf);
}

fit();
MJ.setRedraw(()=>draw());
MJ.onReady(()=>{ MJ.typeset(document.body).then(()=>draw()); draw(); });
</script>
</body>
</html>
