<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A direction-finding fix and its error region</title>
<script src="mjlabel.js"></script>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573;
          --amber:#8a5a00; --red:#b01e24; --grn:#3f7d34; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:grid; grid-template-columns:minmax(0,1fr) 236px; gap:8px; padding:12px; align-items:start; }
  .side { display:flex; flex-direction:column; gap:8px; min-width:0; }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff;
           border:1px solid var(--edge); border-radius:6px; touch-action:none; cursor:grab; }
  canvas.dragging { cursor:grabbing; }
  .controls { display:flex; flex-direction:column; gap:7px; padding:8px 10px;
              background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; min-width:0; }
  .ctl label, .sel label, .chk { font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl { display:flex; align-items:center; gap:8px; min-width:0; }
  .ctl .val { color:var(--navy); font-variant-numeric:tabular-nums; white-space:nowrap; min-width:34px; text-align:right; }
  .ctl input[type=range] { flex:1 1 auto; min-width:80px; accent-color:var(--mid); }
  .sel { display:flex; align-items:center; gap:6px; }
  select { font:inherit; font-size:12px; color:var(--navy); border:1px solid var(--edge2); border-radius:5px; background:#fff; padding:2px 4px; }
  .chk { display:flex; align-items:center; gap:5px; }
  .btns { display:flex; gap:6px; }
  .btns button { flex:1 1 0; }
  button { font:inherit; font-size:12px; font-weight:600; padding:4px 8px; border-radius:5px;
           border:1px solid var(--edge2); background:#fff; color:var(--navy); cursor:pointer; white-space:nowrap; }
  button:hover { background:var(--bg); }
  .readouts { display:flex; flex-direction:column; gap:6px; }
  .ro { display:flex; flex-direction:column; gap:2px; padding:5px 8px 6px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  .ro .k { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink3); white-space:nowrap; }
  .ro .k mjx-container { font-size:inherit !important; }
  .ro .v { font-size:13.5px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--navy); line-height:19px; }
  .ro .v span { white-space:nowrap; }
  .ro .v .bad { color:var(--red); }
  .ro .v .dim { color:var(--ink3); font-weight:600; }
  /* Below 620px the side panel goes under the map, and the map's design box
     shortens (fit() sets the height, and the world scale follows it). */
  @media (max-width:619px) {
    .app { grid-template-columns:1fr; padding:8px; gap:6px; }
    .controls { flex-direction:row; flex-wrap:wrap; gap:6px 12px; padding:6px 8px; }
    .controls .ctl { flex:1 1 100%; }
    .controls .btns { flex:1 1 100%; }
    .readouts { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
    .readouts .wide { grid-column:1 / -1; }
  }
</style>
</head>
<body>
<div class="app">
  <canvas id="map" aria-label="Top-down map of a room: a dashed keep-out circle with a hidden source inside it, and two to four kits outside it. Each kit draws its measured bearing toward the source with a shaded wedge of plus and minus one sigma. The least-squares fix is a cross, and its one-sigma error ellipse is drawn around it. Drag a kit to move it."></canvas>
  <div class="side">
    <div class="controls">
      <div class="row">
        <div class="sel"><label for="nk">Kits</label>
          <select id="nk"><option>2</option><option>3</option><option>4</option></select></div>
        <label class="chk"><input type="checkbox" id="rev"> reveal</label>
        <label class="chk"><input type="checkbox" id="refl"> reflection</label>
      </div>
      <div class="ctl">
        <label for="sg">\(\sigma_\beta\)</label>
        <input type="range" id="sg" min="0.5" max="4" step="0.1" value="2">
        <span class="val" id="sg-val">2.0°</span>
      </div>
      <div class="btns">
        <button id="newsrc" type="button">new source</button>
        <button id="remeas" type="button">new bearings</button>
      </div>
    </div>
    <div class="readouts">
      <div class="ro wide"><span class="k">crossing \(\gamma\)</span><span class="v" id="r-cross">&#8212;</span></div>
      <div class="ro"><span class="k">fix error, m</span><span class="v" id="r-err">&#8212;</span></div>
      <div class="ro"><span class="k">residuals \(e_i\), m</span><span class="v" id="r-res">&#8212;</span></div>
    </div>
  </div>
</div>
<script>
'use strict';
const SANS='Inter, system-ui, -apple-system, sans-serif';
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function stext(ctx,s,x,y,px,color,align,bold){ ctx.fillStyle=color; ctx.font=(bold?'700 ':'')+px+'px '+SANS; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(s,x,y); }
const D2R=Math.PI/180;

/* ---- the room, in meters, seen from above with y up. The keep-out circle
   has radius RK; the source sits anywhere inside RS. The map always shows at
   least HALF meters each side of the center, enough for a kit 4 m from any
   source position plus room to grab it. */
const RK=1.5, RS=1.2, HALF=5.6;
// kit colors: navy, green, amber, and a muted purple. Red is kept for the
// source, the reflection, and a residual that stands out.
const KC=['#004a85','#3f7d34','#8a5a00','#6b3f8f'];
// Default kit positions, 4 m from the center: A south and B west cross at
// 90 deg. C sits 25 deg around from A and D nearly opposite it, so with four
// kits two others run close to A's line and expose a bad bearing on it; with
// three, A and C disagree and the residuals cannot say which of them is wrong.
const HOME=[[0,-4],[-4,0],[1.69,-3.63],[1.04,3.86]];
// the reflection bends kit A's bearing by this much
const REFL=10;
const state={ nk:2, sigma:2, reveal:false, refl:false,
              kits:HOME.map(p=>p.slice()), z:[0,0,0,0], src:[0,0] };

function gauss(){ let u=0; while(u===0) u=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random()); }
function newBearings(){ state.z=state.z.map(()=>gauss()); }
function newSource(){
  const r=RS*Math.sqrt(Math.random()), a=2*Math.PI*Math.random();
  state.src=[r*Math.cos(a), r*Math.sin(a)];
  newBearings();
}

/* ---- the measurement. Each kit reads the true bearing to the source plus
   its own error, z_i sigma, with z_i drawn once per "new bearings" so that a
   dragged kit keeps its error and its line moves smoothly. */
function bearings(exact){
  const out=[];
  for(let i=0;i<state.nk;i++){
    const p=state.kits[i], s=state.src;
    let b=Math.atan2(s[1]-p[1], s[0]-p[0]);
    if(!exact){ b+=state.z[i]*state.sigma*D2R; if(state.refl && i===0) b+=REFL*D2R; }
    out.push(b);
  }
  return out;
}

/* ---- the least-squares fix, the lesson's normal equations:
   (sum n n^T) x = sum n (n . p), with n = (-sin b, cos b).
   Its covariance, for bearing errors of sigma, is A^-1 (sum n n^T d_i^2) A^-1,
   where d_i = R_i tan(sigma) is the cross-range error of line i at the source
   (the "Cross-Range Error" frame). With equal ranges that is the lesson's
   (sum n n^T / d^2)^-1, and its trace gives the table's RMS fix error.
   While the source is hidden, the error region and the crossing angles use
   the measured bearings and the ranges to the fix, which is all a kit in the
   field knows. Once it is revealed they use the true geometry, so that a
   table row set up on the rings reads the table's number rather than one
   noise draw's. */
function solve(){
  const bs=bearings(), n=bs.map(b=>[-Math.sin(b), Math.cos(b)]);
  let a=0,bq=0,c=0,u=0,v=0;
  n.forEach((ni,i)=>{ const p=state.kits[i], q=ni[0]*p[0]+ni[1]*p[1];
    a+=ni[0]*ni[0]; bq+=ni[0]*ni[1]; c+=ni[1]*ni[1]; u+=ni[0]*q; v+=ni[1]*q; });
  const det=a*c-bq*bq;
  const gs=state.reveal ? bearings(true) : bs, g=gs.map(b=>[-Math.sin(b), Math.cos(b)]);
  const res={ bs, gs, n, fix:null };
  if(det<1e-5) return res;
  const ia=c/det, ib=-bq/det, ic=a/det;
  res.fix=[ia*u+ib*v, ib*u+ic*v];
  res.e=n.map((ni,i)=>ni[0]*(res.fix[0]-state.kits[i][0])+ni[1]*(res.fix[1]-state.kits[i][1]));
  // the size each residual should have: that bearing's own R tan(sigma) at the fix
  res.d=state.kits.slice(0,state.nk).map(p=>Math.hypot(res.fix[0]-p[0],res.fix[1]-p[1])*Math.tan(state.sigma*D2R));
  // the covariance, with each range measured to the source once it is
  // revealed and to the fix before that
  const at=state.reveal ? state.src : res.fix;
  let ma=0,mb=0,mc=0;
  a=0; bq=0; c=0;
  g.forEach((ni,i)=>{ const p=state.kits[i], R=Math.hypot(at[0]-p[0],at[1]-p[1]);
    const d2=(R*Math.tan(state.sigma*D2R))**2;
    a+=ni[0]*ni[0]; bq+=ni[0]*ni[1]; c+=ni[1]*ni[1];
    ma+=ni[0]*ni[0]*d2; mb+=ni[0]*ni[1]*d2; mc+=ni[1]*ni[1]*d2; });
  const gd=a*c-bq*bq; if(gd<1e-5){ res.P=null; return res; }
  const ja=c/gd, jb=-bq/gd, jc=a/gd;
  // P = Ainv M Ainv
  const t00=ja*ma+jb*mb, t01=ja*mb+jb*mc, t10=jb*ma+jc*mb, t11=jb*mb+jc*mc;
  res.P=[t00*ja+t01*jb, t00*jb+t01*jc, t10*jb+t11*jc];
  res.rms=Math.sqrt(res.P[0]+res.P[2]);
  return res;
}
// the crossing angle of two lines, folded to 0-90 deg: a 165 deg crossing is
// as shallow as a 15 deg one, since the error goes as 1/sin(gamma)
function crossing(b1,b2){ let g=Math.abs(b1-b2)/D2R % 180; if(g>90) g=180-g; return g; }

/* ---- drawing */
const map=document.getElementById('map'), ctx=map.getContext('2d');
let W=0, H=0, S=1;            // CSS size, px per meter
const X=x=>W/2+x*S, Y=y=>H/2-y*S;
const ext=()=>[W/2/S, H/2/S]; // half-extents of the room shown, in meters

function rgba(hex,a){ const v=parseInt(hex.slice(1),16); return `rgba(${v>>16},${(v>>8)&255},${v&255},${a})`; }
function tag(s,x,y,align,color,px){
  px=px||10.5; ctx.font=px+'px '+SANS; const tw=ctx.measureText(s).width;
  let x0=align==='right'?x-tw-6:(align==='center'?x-tw/2-3:x);
  x0=Math.max(2,Math.min(W-tw-8,x0));
  y=Math.max(9,Math.min(H-9,y));
  ctx.fillStyle='rgba(255,255,255,0.88)'; ctx.fillRect(x0,y-8,tw+6,16);
  stext(ctx,s,x0+3,y,px,color||cssv('--ink3'),'left',false);
}

function draw(){
  const r=solve(), [ex,ey]=ext();
  ctx.clearRect(0,0,W,H);
  // 1 m grid
  ctx.strokeStyle='#eef3f8'; ctx.lineWidth=1; ctx.beginPath();
  for(let x=-Math.floor(ex);x<=ex;x++){ ctx.moveTo(Math.round(X(x))+0.5,0); ctx.lineTo(Math.round(X(x))+0.5,H); }
  for(let y=-Math.floor(ey);y<=ey;y++){ ctx.moveTo(0,Math.round(Y(y))+0.5); ctx.lineTo(W,Math.round(Y(y))+0.5); }
  ctx.stroke();
  // keep-out circle
  ctx.fillStyle='rgba(138,90,0,0.05)'; ctx.strokeStyle='rgba(138,90,0,0.7)'; ctx.lineWidth=1.3; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.arc(X(0),Y(0),RK*S,0,7); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
  // labeled just outside its bottom edge, clear of the lines that converge
  // on the middle
  tag('keep-out',X(0),Y(-RK)+11,'center',cssv('--amber'));

  // when revealed: the source and the 3 m and 4 m range rings around it
  if(state.reveal){
    ctx.strokeStyle='rgba(176,30,36,0.35)'; ctx.lineWidth=1; ctx.setLineDash([2,4]);
    for(const rr of [3,4]){ ctx.beginPath(); ctx.arc(X(state.src[0]),Y(state.src[1]),rr*S,0,7); ctx.stroke(); }
    ctx.setLineDash([]);
    for(const rr of [3,4]){
      // label each ring where it leaves the source toward the upper right,
      // or the upper left if that point is off the map
      let a=Math.PI/4, lx=X(state.src[0]+rr*Math.cos(a)), ly=Y(state.src[1]+rr*Math.sin(a));
      if(lx>W-24||ly<12){ a=3*Math.PI/4; lx=X(state.src[0]+rr*Math.cos(a)); ly=Y(state.src[1]+rr*Math.sin(a)); }
      if(lx>8&&lx<W-8&&ly>8&&ly<H-8) tag(rr+' m',lx,ly,'center','rgba(176,30,36,0.8)',10.5);
    }
  }

  // wedges, then lines, so every line sits on top of every wedge
  const L=4*Math.hypot(ex,ey), sg=state.sigma*D2R;
  r.bs.forEach((b,i)=>{
    const p=state.kits[i];
    ctx.fillStyle=rgba(KC[i],0.13);
    ctx.beginPath(); ctx.moveTo(X(p[0]),Y(p[1]));
    ctx.lineTo(X(p[0]+L*Math.cos(b-sg)),Y(p[1]+L*Math.sin(b-sg)));
    ctx.lineTo(X(p[0]+L*Math.cos(b+sg)),Y(p[1]+L*Math.sin(b+sg)));
    ctx.closePath(); ctx.fill();
  });
  r.bs.forEach((b,i)=>{
    const p=state.kits[i], bent=state.refl&&i===0;
    ctx.strokeStyle=bent?cssv('--red'):KC[i]; ctx.lineWidth=1.6; ctx.setLineDash(bent?[6,4]:[]);
    ctx.beginPath(); ctx.moveTo(X(p[0]),Y(p[1])); ctx.lineTo(X(p[0]+L*Math.cos(b)),Y(p[1]+L*Math.sin(b))); ctx.stroke();
    ctx.setLineDash([]);
  });

  // the fix, its 1-sigma error ellipse, and each residual
  let on=false;
  if(r.fix){
    const fx=X(r.fix[0]), fy=Y(r.fix[1]);
    on = fx>-W && fx<2*W && fy>-H && fy<2*H;
    if(on){
      // residuals: the perpendicular from the fix to each line
      r.n.forEach((ni,i)=>{
        const e=r.e[i]; if(Math.abs(e)*S<1) return;
        const bad=state.nk>2 && Math.abs(e)>2*r.d[i];
        ctx.strokeStyle=bad?cssv('--red'):KC[i]; ctx.lineWidth=bad?2.4:1.6;
        ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(X(r.fix[0]-e*ni[0]),Y(r.fix[1]-e*ni[1])); ctx.stroke();
      });
      if(r.P){
      const [a,b,c]=r.P, tr=(a+c)/2, dd=Math.sqrt(((a-c)/2)**2+b*b);
      const l1=tr+dd, l2=Math.max(0,tr-dd), th=0.5*Math.atan2(2*b,a-c);
      ctx.fillStyle='rgba(0,74,133,0.16)'; ctx.strokeStyle=cssv('--navy'); ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.ellipse(fx,fy,Math.max(1.5,Math.sqrt(l1)*S),Math.max(1.5,Math.sqrt(l2)*S),-th,0,7); ctx.fill(); ctx.stroke();
      }
      ctx.strokeStyle=cssv('--navy'); ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(fx-6,fy); ctx.lineTo(fx+6,fy); ctx.moveTo(fx,fy-6); ctx.lineTo(fx,fy+6); ctx.stroke();
    }
  }

  if(state.reveal){
    const sx=X(state.src[0]), sy=Y(state.src[1]);
    ctx.fillStyle=cssv('--red'); ctx.beginPath(); ctx.arc(sx,sy,4.5,0,7); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
  }

  // kits on top, each a lettered dot
  for(let i=0;i<state.nk;i++){
    const p=state.kits[i], x=X(p[0]), y=Y(p[1]);
    ctx.fillStyle=KC[i]; ctx.beginPath(); ctx.arc(x,y,9,0,7); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
    stext(ctx,'ABCD'[i],x,y+0.5,11,'#fff','center',true);
    if(state.refl&&i===0){
      // the tag goes on the side of the kit away from its line
      const b=r.bs[0], side=Math.cos(b)>0?'right':'left';
      tag('reflection', side==='right'?x-13:x+13, y+(Math.sin(b)>0?14:-14), side, cssv('--red'));
    }
  }
  // scale bar, bottom left
  const sx0=10, sy0=H-12;
  ctx.strokeStyle=cssv('--ink3'); ctx.lineWidth=1.5; ctx.beginPath();
  ctx.moveTo(sx0,sy0-4); ctx.lineTo(sx0,sy0); ctx.lineTo(sx0+S,sy0); ctx.lineTo(sx0+S,sy0-4); ctx.stroke();
  stext(ctx,'1 m',sx0+S+5,sy0-2,10.5,cssv('--ink3'),'left');
  if(r.fix && !on) tag('fix off the map',W-6,H-12,'right',cssv('--red'));
  if(!r.fix) tag('no fix: the lines are parallel',W-6,H-12,'right',cssv('--red'));
  readouts(r);
}

/* ---- readouts: the crossing angle of each pair, the fix error once the
   source is revealed (with the RMS of the error region alongside), and each
   bearing's residual, red when it is more than twice that bearing's own
   R tan(sigma) */
const fmt=(v,d)=>v.toFixed(d===undefined?2:d);
function readouts(r){
  const cr=[];
  for(let i=0;i<state.nk;i++) for(let j=i+1;j<state.nk;j++){
    const g=crossing(r.gs[i],r.gs[j]);
    cr.push(state.nk===2 ? `<span>${fmt(g,0)}°</span>` : `<span>${'ABCD'[i]}${'ABCD'[j]} ${fmt(g,0)}°</span>`);
  }
  document.getElementById('r-cross').innerHTML=cr.join(' · ');
  const err=document.getElementById('r-err');
  if(!r.fix){ err.innerHTML='&#8212;'; }
  else {
    const rms=`<span class="dim">RMS ${r.P ? fmt(r.rms) : '&#8212;'}</span>`;
    err.innerHTML = (state.reveal
      ? `<span>${fmt(Math.hypot(r.fix[0]-state.src[0], r.fix[1]-state.src[1]))}</span>`
      : `<span class="dim">hidden</span>`)+' · '+rms;
  }
  const res=document.getElementById('r-res');
  if(!r.fix){ res.innerHTML='&#8212;'; return; }
  res.innerHTML=r.e.map((e,i)=>{
    const bad=state.nk>2 && Math.abs(e)>2*r.d[i];
    return `<span${bad?' class="bad"':''}>${'ABCD'[i]} ${fmt(Math.abs(e))}</span>`;
  }).join(' · ');
}

/* ---- dragging, mouse or finger. A kit is grabbed within 22 px of its
   center; it stays outside the keep-out circle and on the map. With the
   source revealed it snaps onto the 3 m and 4 m rings, at 5 deg steps around
   the source, so a table row can be set up exactly. */
let drag=-1;
function toWorld(ev){ const b=map.getBoundingClientRect(); return [(ev.clientX-b.left-W/2)/S, (H/2-(ev.clientY-b.top))/S]; }
function place(i,w){
  const [ex,ey]=ext(), m=0.25;
  let [x,y]=w;
  x=Math.max(-ex+m,Math.min(ex-m,x)); y=Math.max(-ey+m,Math.min(ey-m,y));
  if(state.reveal){
    const dx=x-state.src[0], dy=y-state.src[1], rr=Math.hypot(dx,dy);
    for(const ring of [3,4]){
      if(Math.abs(rr-ring)<0.15){
        const a=Math.round(Math.atan2(dy,dx)/D2R/5)*5*D2R;
        x=state.src[0]+ring*Math.cos(a); y=state.src[1]+ring*Math.sin(a);
      }
    }
  }
  const rc=Math.hypot(x,y), rmin=RK+0.3;
  if(rc<rmin){ const k=rmin/Math.max(rc,1e-6); x*=k; y*=k; }
  state.kits[i]=[x,y];
}
map.addEventListener('pointerdown',ev=>{
  const b=map.getBoundingClientRect(), px=ev.clientX-b.left, py=ev.clientY-b.top;
  let best=-1, bd=22;
  for(let i=0;i<state.nk;i++){ const d=Math.hypot(X(state.kits[i][0])-px, Y(state.kits[i][1])-py); if(d<bd){ bd=d; best=i; } }
  if(best<0) return;
  drag=best; map.setPointerCapture(ev.pointerId); map.classList.add('dragging'); ev.preventDefault();
});
map.addEventListener('pointermove',ev=>{ if(drag<0) return; place(drag,toWorld(ev)); draw(); });
function endDrag(){ drag=-1; map.classList.remove('dragging'); }
map.addEventListener('pointerup',endDrag);
map.addEventListener('pointercancel',endDrag);

/* ---- sizing. Side by side above 620 px, the map takes what the panel
   leaves, up to 428 px tall. Stacked on a phone, the design box shortens to
   0.74 of its width, and the world scale follows the box: the map
   always shows HALF meters about the center in its shorter direction. */
const STACK=window.matchMedia ? window.matchMedia('(max-width:619px)') : null;
function fit(){
  const dpr=window.devicePixelRatio||1, stacked=STACK&&STACK.matches;
  const w=Math.max(220, map.clientWidth);
  const h=stacked ? Math.round(Math.min(w*0.74, 280)) : Math.round(Math.min(w, 428));
  map.width=Math.round(w*dpr); map.height=Math.round(h*dpr); map.style.height=h+'px';
  const bh=map.offsetHeight-map.clientHeight; if(bh) map.style.height=(h+bh)+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  W=w; H=h; S=Math.min(W,H)/(2*HALF);
  // a narrower map may have left a kit off the edge
  for(let i=0;i<4;i++) place(i,state.kits[i]);
  draw();
}
window.addEventListener('resize', fit);

const nkEl=document.getElementById('nk'), sgEl=document.getElementById('sg');
nkEl.addEventListener('change',()=>{ state.nk=+nkEl.value; draw(); });
sgEl.addEventListener('input',()=>{ state.sigma=+sgEl.value; document.getElementById('sg-val').textContent=state.sigma.toFixed(1)+'°'; draw(); });
document.getElementById('rev').addEventListener('change',e=>{ state.reveal=e.target.checked; draw(); });
document.getElementById('refl').addEventListener('change',e=>{ state.refl=e.target.checked; draw(); });
document.getElementById('newsrc').addEventListener('click',()=>{ newSource(); draw(); });
document.getElementById('remeas').addEventListener('click',()=>{ newBearings(); draw(); });
// a preset by query string: ?kits=3
(function(){
  const q=new URLSearchParams(location.search), k=+q.get('kits');
  if(k>=2&&k<=4){ state.nk=k; nkEl.value=String(k); }
})();
newSource();
fit();
MJ.setRedraw(draw);
MJ.onReady(()=>{ MJ.typeset(document.body).then(draw); draw(); });
</script>
</body>
</html>
