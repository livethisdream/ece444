<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The radiation integral as a coherent sum</title>
<script src="mjlabel.js"></script>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573;
          --amber:#8a5a00; --red:#b01e24; --grn:#3f7d34; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:flex; flex-direction:column; gap:10px; padding:14px; }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px; }
  /* Stacked below ~650px (phone); side by side above it -- halves the vertical
     space the two canvases cost on any reader-width viewport. */
  .canvases { display:flex; flex-direction:column; gap:10px; }
  @media (min-width:650px) { .canvases { display:grid; grid-template-columns:1fr 1fr; gap:14px; } }
  .controls { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
              padding:8px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  .ctl { display:flex; align-items:center; gap:8px; flex:1 1 250px; }
  .ctl label { font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl .val { color:var(--navy); font-variant-numeric:tabular-nums; white-space:nowrap; min-width:56px; }
  .ctl input[type=range]{ flex:1 1 auto; min-width:110px; }
  /* Below 430px the controls bar cannot fit a label, a slider and a value on one
     line: .ctl's flex basis and the reserved .val column are both wider than the
     content box, so the bar pushes the document past the viewport and the whole
     widget scrolls sideways on a phone. Stack each control instead -- label and
     value share the first line, the input takes the second -- and let every part
     shrink. Nothing here applies above 430px. */
  @media (max-width:430px) {
    .ctl { flex:1 1 100%; min-width:0; flex-wrap:wrap; row-gap:4px; }
    .ctl label { order:1; flex:0 0 auto; }
    .ctl .val { order:2; flex:0 0 auto; min-width:0; margin-left:auto; }
    .ctl input[type=range] { order:3; flex:1 1 100%; min-width:0; width:auto; }
    .btns { flex:1 1 100%; justify-content:stretch; }
    .btns button { flex:1 1 0; }
  }
  /* Readouts as a row of instruments: equal-width cells on one grid, labels and
     values on shared baselines, edges flush with the canvases above. */
  .readouts { display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(148px, 1fr)); }
  .ro { display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
        gap:4px; padding:7px 8px 8px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  /* block, not flex: a flex container drops the whitespace between an inline
     MathJax symbol and the words that follow it, welding them together. */
  .ro .k { display:block; text-align:center;
           height:15px; line-height:15px; font-size:10.5px; font-weight:700;
           text-transform:uppercase; letter-spacing:0.045em; color:var(--ink3);
           white-space:nowrap; overflow:hidden; }
  .ro .k mjx-container { font-size:inherit !important; }
  .ro .v { height:19px; line-height:19px; font-size:14.5px; font-weight:700; white-space:nowrap;
           font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
           text-align:center; min-width:8ch; color:var(--navy); }
  /* The state line is a sentence, not a quantity, so it stays a caption under
     the instrument row -- only its colour carries the good/bad signal. */
  .state { margin:0; text-align:center; font-size:12px; font-weight:700;
           letter-spacing:0.01em; color:var(--ink3); }
  .state.hot { color:var(--red); }
  .state.ok  { color:var(--grn); }
  .btns { display:flex; gap:6px; }
  button { font:inherit; font-size:12px; font-weight:600; padding:4px 10px; border-radius:5px;
           border:1px solid var(--edge2); background:#fff; color:var(--navy); cursor:pointer; }
  button:hover { background:var(--bg); }
</style>
</head>
<body>
<div class="app">
  <div class="canvases">
    <canvas id="top" aria-label="Left: a line source split into elements, each sending a parallel ray toward the observation direction. Right: the phasor chain formed by adding those element contributions."></canvas>
    <canvas id="pat" aria-label="Magnitude of the radiation integral versus observation angle, with a marker at the current angle"></canvas>
  </div>

  <div class="controls">
    <div class="ctl">
      <label>Source length \(L/\lambda\)</label>
      <input type="range" id="len" min="0.25" max="6" step="0.05" value="2">
      <span class="val" id="len-val">2.00</span>
    </div>
    <div class="ctl">
      <label>Angle \(\theta\)</label>
      <input type="range" id="th" min="0" max="180" step="0.5" value="90">
      <span class="val" id="th-val">90.0&#176;</span>
    </div>
    <div class="ctl">
      <label>Elements \(N\)</label>
      <input type="range" id="n" min="4" max="60" step="1" value="24">
      <span class="val" id="n-val">24</span>
    </div>
    <div class="btns">
      <button id="broad">broadside</button>
      <button id="null1">first null</button>
    </div>
  </div>

  <div class="readouts">
    <div class="ro"><span class="k">phase spread \(kL\cos\theta\)</span><span class="v" id="p-spread">&#8212;</span></div>
    <div class="ro" id="ro-mag"><span class="k">\(\lvert N\rvert / N_{\max}\)</span><span class="v" id="p-mag">&#8212;</span></div>
  </div>
  <p class="state" id="p-state">&#8212;</p>
</div>

<script>
'use strict';
const SANS='Inter, system-ui, -apple-system, sans-serif';
function stext(ctx,s,x,y,px,color,align,bold){ ctx.fillStyle=color; ctx.font=(bold?'700 ':'')+px+'px '+SANS; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(s,x,y); }
function arrow(ctx,x1,y1,x2,y2,color,w,head){
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1), h=head||7;
  ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-h*Math.cos(a-0.42), y2-h*Math.sin(a-0.42));
  ctx.lineTo(x2-h*Math.cos(a+0.42), y2-h*Math.sin(a+0.42));
  ctx.closePath(); ctx.fill();
}
// position along the source -> colour (blue at the bottom, amber at the top)
function ramp(t){
  const a=[0,103,185], b=[138,90,0];
  return 'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';
}

const cvT=document.getElementById('top'), ctxT=cvT.getContext('2d');
const cvP=document.getElementById('pat'), ctxP=cvP.getContext('2d');
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const state={ L:2.0, th:90*Math.PI/180, N:24 };

/* ---- the radiation integral, done as the discrete sum the picture shows ---- */
function sumAt(th){                      // returns {re, im, mag} with mag in [0,1]
  const c=Math.cos(th); let re=0, im=0;
  for(let i=0;i<state.N;i++){
    const z=((i+0.5)/state.N - 0.5)*state.L;   // element position, wavelengths
    const ph=2*Math.PI*z*c;                    // k z' cos(theta)
    re+=Math.cos(ph); im+=Math.sin(ph);
  }
  return { re:re/state.N, im:im/state.N, mag:Math.hypot(re,im)/state.N };
}

/* ---------------------------- top canvas ---------------------------- */
function drawTop(){
  const dpr=window.devicePixelRatio||1, w=cvT.width/(dpr*SCL), h=cvT.height/(dpr*SCL);
  ctxT.clearRect(0,0,w,h);
  const split=Math.round(w*0.52);
  ctxT.strokeStyle=cssv('--edge'); ctxT.lineWidth=1;
  ctxT.beginPath(); ctxT.moveTo(split,10); ctxT.lineTo(split,h-10); ctxT.stroke();
  drawSource(0,0,split,h);
  drawPhasors(split,0,w-split,h);
}

function drawSource(x0,y0,w,h){
  const ctx=ctxT;
  // No caption -- the lesson prose already says the source is chopped into
  // elements each carrying a phasor (Neil's rule: don't restate in-graphic
  // what the text says).
  const cx=x0+w*0.34, cy=y0+h*0.55, half=Math.min(h*0.32, 100);
  const th=state.th, ux=Math.sin(th), uy=-Math.cos(th);   // observation direction

  // z axis
  ctx.strokeStyle=cssv('--edge2'); ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(cx,cy-half-26); ctx.lineTo(cx,cy+half+18); ctx.stroke(); ctx.setLineDash([]);
  MJ.draw(ctx,'z',cx,cy-half-36,13,cssv('--ink3'),'center');

  // parallel rays, one per element, all pointing at P
  const rayLen=Math.min(w*0.52, 150);
  for(let i=0;i<state.N;i++){
    const t=(i+0.5)/state.N;
    const py=cy-(t-0.5)*2*half;                            // top of canvas = +z
    ctx.strokeStyle='rgba(91,101,115,0.35)'; ctx.lineWidth=1; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(cx,py); ctx.lineTo(cx+ux*rayLen, py+uy*rayLen); ctx.stroke(); ctx.setLineDash([]);
  }

  // the source itself
  ctx.strokeStyle=cssv('--navy'); ctx.lineWidth=3.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx,cy-half); ctx.lineTo(cx,cy+half); ctx.stroke(); ctx.lineCap='butt';
  for(let i=0;i<state.N;i++){
    const t=(i+0.5)/state.N;
    const py=cy-(t-0.5)*2*half;
    ctx.fillStyle=ramp(t); ctx.beginPath(); ctx.arc(cx,py,3.4,0,7); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
  }
  stext(ctx,'L = '+state.L.toFixed(2)+' λ', cx-12, cy+half+20, 12, cssv('--navy'),'end',true);
  stext(ctx,state.N+' elements', cx-12, cy+half+36, 11.5, cssv('--ink3'),'end',false);

  // observation direction
  const A=Math.min(w*0.56,168);
  arrow(ctx,cx,cy,cx+ux*A,cy+uy*A,cssv('--navy'),2.4,9);
  stext(ctx,'to P', cx+ux*A+6*ux+4, cy+uy*A+6*uy, 11.5, cssv('--navy'),'left',true);

  // theta arc from +z round to the observation direction
  const R=Math.min(half*0.42,44);
  ctx.strokeStyle=cssv('--ink3'); ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+th,false); ctx.stroke();
  const mth=th/2;
  MJ.draw(ctx,'\\theta', cx+Math.sin(mth)*(R+13), cy-Math.cos(mth)*(R+13), 13, cssv('--ink3'),'center');
}

function drawPhasors(x0,y0,w,h){
  const ctx=ctxT;
  // No caption here either -- same reason as drawSource above.
  const cx=x0+w*0.5, cy=y0+h*0.58;
  const R=Math.min(w*0.62, h*0.46);          // chain length when every phasor aligns

  // reference bar: the length the chain reaches when nothing cancels
  const by=y0+24;
  ctx.strokeStyle=cssv('--edge2'); ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx-R/2,by); ctx.lineTo(cx+R/2,by); ctx.stroke(); ctx.lineCap='butt';
  stext(ctx,'maximum — every element in phase', cx, by-14, 10.5, cssv('--ink3'),'center',false);

  // the chain: start so the resultant is centred
  const s=sumAt(state.th);
  const step=R/state.N;
  let px=cx - s.re*R/2, py=cy + s.im*R/2;     // canvas y is flipped
  const sx=px, sy=py;
  const c=Math.cos(state.th);
  for(let i=0;i<state.N;i++){
    const t=(i+0.5)/state.N;
    const z=(t-0.5)*state.L;
    const ph=2*Math.PI*z*c;
    const nx=px+Math.cos(ph)*step, ny=py-Math.sin(ph)*step;
    ctx.strokeStyle=ramp(t); ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(nx,ny); ctx.stroke();
    px=nx; py=ny;
  }
  // resultant
  if(s.mag>0.004){
    arrow(ctx,sx,sy,px,py,cssv('--red'),2.6,10);
    const mx=(sx+px)/2, my=(sy+py)/2;
    MJ.draw(ctx,'N(\\theta)', mx+16, my+14, 13, cssv('--red'),'left');
  } else {
    ctx.fillStyle=cssv('--red'); ctx.beginPath(); ctx.arc(sx,sy,4.5,0,7); ctx.fill();
    stext(ctx,'chain closes → null', cx, y0+h-30, 12, cssv('--red'),'center',true);
  }
  ctx.fillStyle=cssv('--ink3');
  stext(ctx,'each link turns by k z′ cos θ', cx, y0+h-14, 11, cssv('--ink3'),'center',false);
}

/* ---------------------------- pattern canvas ---------------------------- */
function drawPat(){
  const dpr=window.devicePixelRatio||1, w=cvP.width/(dpr*SCL), h=cvP.height/(dpr*SCL);
  ctxP.clearRect(0,0,w,h);
  const ctx=ctxP, mL=52, mR=18, mT=20, mB=34;
  const pw=w-mL-mR, ph=h-mT-mB;
  const xp=d=>mL+d/180*pw, yp=v=>mT+(1-v)*ph;

  ctx.strokeStyle=cssv('--edge'); ctx.lineWidth=1;
  for(let v=0;v<=1.001;v+=0.25){ const y=yp(v);
    ctx.beginPath(); ctx.moveTo(mL,y); ctx.lineTo(mL+pw,y); ctx.stroke();
    stext(ctx,v.toFixed(2), mL-8, y, 10.5, cssv('--ink3'),'right',false);
  }
  for(let d=0;d<=180;d+=30){ const x=xp(d);
    ctx.strokeStyle=cssv('--edge2'); ctx.beginPath(); ctx.moveTo(x,mT); ctx.lineTo(x,mT+ph); ctx.stroke();
    stext(ctx,d+'°', x, mT+ph+13, 10.5, cssv('--ink3'),'center',false);
  }
  ctx.strokeStyle=cssv('--edge'); ctx.strokeRect(mL,mT,pw,ph);
  stext(ctx,'broadside', xp(90), mT+ph-10, 10.5, cssv('--ink3'),'center',false);

  // |N(theta)| over the whole sweep
  ctx.strokeStyle=cssv('--mid'); ctx.lineWidth=2.2; ctx.beginPath();
  for(let i=0;i<=540;i++){
    const d=i/3, v=sumAt(d*Math.PI/180).mag;
    const x=xp(d), y=yp(v);
    i? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.stroke();

  // marker at the current angle
  const d0=state.th*180/Math.PI, v0=sumAt(state.th).mag;
  ctx.strokeStyle='rgba(21,32,43,0.5)'; ctx.lineWidth=1.4; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(xp(d0),mT); ctx.lineTo(xp(d0),mT+ph); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=cssv('--red'); ctx.beginPath(); ctx.arc(xp(d0),yp(v0),4.4,0,7); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.3; ctx.stroke();

  MJ.draw(ctx,'\\theta', mL+pw/2, mT+ph+27, 12, cssv('--ink3'),'center');
  ctx.save(); ctx.translate(15, mT+ph/2); ctx.rotate(-Math.PI/2);
  MJ.draw(ctx,'|N(\\theta)|\\,/\\,N', 0, 0, 12, cssv('--ink3'),'center');
  ctx.restore();
}

/* ---------------------------- readouts + wiring ---------------------------- */
function readouts(){
  const s=sumAt(state.th), spread=2*Math.PI*state.L*Math.cos(state.th);
  document.getElementById('p-spread').textContent=(spread*180/Math.PI).toFixed(0)+'°';
  document.getElementById('p-mag').textContent=s.mag.toFixed(3);
  const st=document.getElementById('p-state');
  st.className='state';
  if(state.L/state.N >= 1){
    // the discrete sum has stopped standing in for the integral — say so
    st.textContent='spacing ≥ λ — add elements'; st.classList.add('hot');
  }
  else if(s.mag>0.98){ st.textContent='every element in phase — peak'; st.classList.add('ok'); }
  else if(s.mag<0.02){ st.textContent='contributions cancel — null'; st.classList.add('hot'); }
  else { st.textContent='partial cancellation'; }
}

function drawAll(){ drawTop(); drawPat(); readouts(); }

/* clientWidth, not getBoundingClientRect(): the rect includes the 1px border on
   each side, so a bitmap sized from it is 2px wider than the box it is painted
   into and the drawing comes out stretched horizontally -- circles turn into
   ellipses. And with box-sizing:border-box, style.height sets the OUTER height,
   so hand the border back or the bitmap is 2px taller than its box. */
function cvWidth(cv){ return Math.max(240, cv.clientWidth || Math.floor(cv.getBoundingClientRect().width)); }
function setSize(cv,wCss,hCss,dpr){
  cv.width=Math.round(wCss*dpr); cv.height=Math.round(hCss*dpr);
  cv.style.height=hCss+'px';
  const bh=cv.offsetHeight-cv.clientHeight;
  if(bh) cv.style.height=(hCss+bh)+'px';
}
/* Narrower than the width this drawing was composed for, scale the whole thing
   down instead of clamping the bitmap: same composition, just smaller, so the
   labels shrink together and nothing collides. At or above DESIGN_W, SCL is 1
   and every number below is exactly what it was. */
const DESIGN_W=380;
let SCL=1;
function fit(){
  const dpr=window.devicePixelRatio||1;
  const wCss=cvWidth(cvT);
  SCL=Math.min(1, wCss/DESIGN_W);
  const w=wCss/SCL;
  const h1=Math.max(230, Math.min(w*0.36, 290)), h2=Math.max(120, Math.min(w*0.20, 160));
  setSize(cvT,wCss,h1*SCL,dpr); setSize(cvP,wCss,h2*SCL,dpr);
  ctxT.setTransform(dpr*SCL,0,0,dpr*SCL,0,0); ctxP.setTransform(dpr*SCL,0,0,dpr*SCL,0,0);
  drawAll();
}
window.addEventListener('resize', fit);

const lenEl=document.getElementById('len'), thEl=document.getElementById('th'), nEl=document.getElementById('n');
function syncLabels(){
  document.getElementById('len-val').textContent=state.L.toFixed(2);
  document.getElementById('th-val').textContent=(state.th*180/Math.PI).toFixed(1)+'°';
  document.getElementById('n-val').textContent=state.N;
}
lenEl.addEventListener('input',()=>{ state.L=+lenEl.value; syncLabels(); drawAll(); });
thEl .addEventListener('input',()=>{ state.th=+thEl.value*Math.PI/180; syncLabels(); drawAll(); });
nEl  .addEventListener('input',()=>{ state.N=+nEl.value; syncLabels(); drawAll(); });

document.getElementById('broad').addEventListener('click',()=>{
  thEl.value=90; state.th=Math.PI/2; syncLabels(); drawAll();
});
// first null of a uniform line source: cos(theta) = lambda / L (exists only for L > lambda)
document.getElementById('null1').addEventListener('click',()=>{
  if(state.L<=1.02){ lenEl.value=2; state.L=2; }
  const d=Math.acos(Math.min(0.999,1/state.L))*180/Math.PI;
  thEl.value=d.toFixed(1); state.th=d*Math.PI/180; syncLabels(); drawAll();
});

syncLabels();
fit();
MJ.setRedraw(()=>drawAll());
MJ.onReady(()=>{ MJ.typeset(document.body).then(()=>drawAll()); drawAll(); });
</script>
</body>
</html>
