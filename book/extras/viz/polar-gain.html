<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polar gain patterns</title>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573;
          --amber:#8a5a00; --red:#b01e24; --grn:#3f7d34;
          --iso:#6c757d; --dip:#0067b9; --pat:#1d7a4d; --horn:#8a5a00; --dish:#b3213a; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:flex; flex-direction:column; gap:10px; padding:14px; }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px; }
  .controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:9px 18px; align-items:center;
              padding:9px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  .ctl { display:flex; align-items:center; gap:8px; min-width:0; overflow:hidden; }
  .ctl label { font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl label.mixed { text-transform:none; font-size:12.5px; letter-spacing:0; }
  .ctl .val { color:var(--navy); font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:34px; text-align:right; }
  .ctl input[type=range]{ flex:1 1 auto; min-width:80px; accent-color:var(--mid); }
  select { font:inherit; font-size:12.5px; padding:3px 6px; border-radius:5px; border:1px solid var(--edge2);
           background:#fff; color:var(--navy); font-weight:600; }
  .chips { grid-column:1/-1; display:grid; grid-template-columns:repeat(auto-fit,minmax(126px,1fr)); gap:8px; }
  .chip { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer;
          font:600 12px/1.15 Inter,system-ui,sans-serif; padding:6px 8px; border:1px solid var(--edge2);
          border-radius:6px; background:#fff; color:var(--ink3); }
  .chip:hover { border-color:var(--mid); }
  .chip .top { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .chip .dot { width:10px; height:10px; border-radius:2px; flex:none; background:var(--c); opacity:0.3; }
  .chip .g { font-size:11px; font-weight:600; color:var(--ink3); font-variant-numeric:tabular-nums; }
  .chip[aria-pressed="true"] { color:var(--navy); background:var(--bg); border-color:var(--c); box-shadow:inset 0 0 0 1px var(--c); }
  .chip[aria-pressed="true"] .dot { opacity:1; }
  /* Readouts as a row of instruments: equal-width cells on one grid, labels and
     values on shared baselines, edges flush with the canvases above. */
  .readouts { display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(148px, 1fr)); }
  .ro { display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
        gap:4px; padding:7px 8px 8px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  .ro .k { display:block; text-align:center;
           height:15px; line-height:15px; font-size:10.5px; font-weight:700;
           text-transform:uppercase; letter-spacing:0.045em; color:var(--ink3);
           white-space:nowrap; overflow:hidden; }
  .ro .v { height:19px; line-height:19px; font-size:14.5px; font-weight:700; white-space:nowrap;
           font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
           text-align:center; min-width:8ch; color:var(--navy); }
  .ro.dish { background:rgba(179,33,58,0.10); border-color:rgba(179,33,58,0.30); }
  .ro.dish .v { color:var(--dish); }
  .hint { margin:0; text-align:center; font-size:11.5px; color:var(--ink3); line-height:1.45; }
</style>
</head>
<body>
<div class="app">
  <canvas id="plot" aria-label="Polar gain plot"></canvas>

  <div class="controls">
    <div class="chips" id="antennas"></div>
    <div class="ctl">
      <label class="mixed">Dish D/&#955;</label>
      <input type="range" id="d-lambda" min="2" max="40" step="0.5" value="10">
      <span class="val" id="d-lambda-val">10</span>
    </div>
    <div class="ctl">
      <label>Radial range</label>
      <select id="scale">
        <option value="30">0 to 30 dBi</option>
        <option value="40" selected>&#8722;10 to 30 dBi</option>
        <option value="50">&#8722;20 to 30 dBi</option>
        <option value="60">&#8722;30 to 30 dBi</option>
      </select>
    </div>
  </div>

  <div class="readouts">
    <div class="ro dish"><span class="k">dish gain</span><span class="v" id="p-dish">—</span></div>
    <div class="ro dish"><span class="k">dish HPBW</span><span class="v" id="p-hpbw">—</span></div>
    <div class="ro"><span class="k">outer ring</span><span class="v" id="p-outer">—</span></div>
    <div class="ro"><span class="k">center</span><span class="v" id="p-floor">—</span></div>
    <div class="ro"><span class="k">curves shown</span><span class="v" id="p-n">—</span></div>
  </div>

  <p class="hint">2D E-plane cut (&#952; from 0&#176; at top to &#177;180&#176;). Each curve keeps its own shape and sits at its own peak gain in dBi,
  so beamwidths and sidelobes compare directly.</p>
</div>

<script>
'use strict';

// -------- Antenna models ------------------------------------------------
// Each returns |G(θ)| in *linear* (not dB), with the model's own peak
// gain (linear) baked in.  θ = 0 is boresight (top of the plot).

const ANTENNAS = [
  {
    key: 'iso',
    name: 'Isotropic',
    peakDbi: 0,
    color: getComputedStyle(document.documentElement).getPropertyValue('--iso').trim(),
    dashed: true,
    pattern: () => 1  // constant unity in all directions
  },
  {
    key: 'dip',
    name: 'λ/2 dipole',
    peakDbi: 2.15,
    color: getComputedStyle(document.documentElement).getPropertyValue('--dip').trim(),
    pattern: (theta) => {
      // Standard half-wave dipole pattern.  θ measured from the dipole axis.
      // Here we treat θ = 0 as broadside (peak), so remap.
      const t = Math.PI / 2 - theta;  // remap so peak is at θ=0
      const s = Math.sin(t);
      if (Math.abs(s) < 1e-6) return 0;
      const num = Math.cos((Math.PI / 2) * Math.cos(t));
      const F = num / s;             // normalized amplitude pattern
      const G_lin = 1.64 * F * F;    // 1.64 = 2.15 dBi
      return G_lin;
    }
  },
  {
    key: 'pat',
    name: 'Rect. patch',
    peakDbi: 7,
    color: getComputedStyle(document.documentElement).getPropertyValue('--pat').trim(),
    pattern: (theta) => {
      // Simple broadside cos^n taper; ~7 dBi peak.
      // Only radiates into the forward hemisphere.
      const t = Math.abs(theta);
      if (t > Math.PI / 2) return 1e-6;
      const peakLin = Math.pow(10, 7 / 10);  // 7 dBi -> linear
      return peakLin * Math.pow(Math.cos(t), 2);
    }
  },
  {
    key: 'horn',
    name: 'Std-gain horn',
    peakDbi: 15,
    color: getComputedStyle(document.documentElement).getPropertyValue('--horn').trim(),
    pattern: (theta) => {
      // sinc^2 aperture pattern for a ~5λ aperture.
      const D_over_lambda = 5;
      const u = Math.PI * D_over_lambda * Math.sin(theta);
      const F = (Math.abs(u) < 1e-6) ? 1 : Math.sin(u) / u;
      const peakLin = Math.pow(10, 15 / 10);  // 15 dBi
      const shape = F * F;
      // Only forward hemisphere for a horn.
      if (Math.abs(theta) > Math.PI / 2) return peakLin * 1e-4;
      return peakLin * shape;
    }
  },
  {
    key: 'dish',
    name: 'Parabolic dish',
    peakDbi: null,   // computed from D/λ
    color: getComputedStyle(document.documentElement).getPropertyValue('--dish').trim(),
    pattern: (theta, params) => {
      // sinc^2 aperture pattern with aperture efficiency 0.55.
      const D = params.dLambda;
      const eta_ap = 0.55;
      const peakLin = eta_ap * Math.pow(Math.PI * D, 2);
      const u = Math.PI * D * Math.sin(theta);
      const F = (Math.abs(u) < 1e-6) ? 1 : Math.sin(u) / u;
      const shape = F * F;
      if (Math.abs(theta) > Math.PI / 2) return peakLin * 1e-4;
      return peakLin * shape;
    },
    peakLinFromParams: (params) => {
      const D = params.dLambda;
      const eta_ap = 0.55;
      return eta_ap * Math.pow(Math.PI * D, 2);
    }
  },
];

// -------- State ---------------------------------------------------------
const state = {
  active: new Set(['iso', 'dip', 'horn']),
  dLambda: 10,
  scaleDb: 40,   // total dB span; outer ring is fixed at +30 dBi
};

const OUTER_DBI = 30;   // outer ring always represents +30 dBi
const U_HALF = 1.3915576;   // sinc^2 falls to one half at this argument

// -------- Build antenna toggle chips ------------------------------------
const antennasDiv = document.getElementById('antennas');
for (const a of ANTENNAS) {
  const btn = document.createElement('button');
  btn.className = 'chip';
  btn.type = 'button';
  btn.dataset.key = a.key;
  btn.style.setProperty('--c', a.color);
  btn.setAttribute('aria-pressed', state.active.has(a.key) ? 'true' : 'false');

  const dot = document.createElement('span');
  dot.className = 'dot';
  if (a.dashed) dot.style.background = `repeating-linear-gradient(90deg, ${a.color} 0 3px, transparent 3px 6px)`;

  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = a.name;

  const top = document.createElement('span');
  top.className = 'top';
  top.append(dot, name);

  const gain = document.createElement('span');
  gain.className = 'g';
  gain.dataset.key = a.key;
  gain.textContent = gainLabel(a);

  btn.append(top, gain);
  btn.addEventListener('click', () => {
    if (state.active.has(a.key)) state.active.delete(a.key);
    else state.active.add(a.key);
    btn.setAttribute('aria-pressed', state.active.has(a.key) ? 'true' : 'false');
    draw();
  });
  antennasDiv.append(btn);
}

function gainLabel(a) {
  if (a.peakDbi !== null) return `${a.peakDbi.toFixed(1)} dBi`;
  if (a.peakLinFromParams) {
    const lin = a.peakLinFromParams({ dLambda: state.dLambda });
    return `${(10 * Math.log10(lin)).toFixed(1)} dBi`;
  }
  return '';
}

function refreshGainLabels() {
  document.querySelectorAll('.chip .g').forEach(el => {
    const a = ANTENNAS.find(x => x.key === el.dataset.key);
    if (a) el.textContent = gainLabel(a);
  });
}

// -------- Controls -----------------------------------------------------
const dLambdaSlider = document.getElementById('d-lambda');
const dLambdaVal    = document.getElementById('d-lambda-val');
dLambdaSlider.addEventListener('input', () => {
  state.dLambda = parseFloat(dLambdaSlider.value);
  dLambdaVal.textContent = state.dLambda;
  refreshGainLabels();
  draw();
});

const scaleSelect = document.getElementById('scale');
scaleSelect.addEventListener('change', () => {
  state.scaleDb = parseFloat(scaleSelect.value);
  draw();
});

// -------- Drawing ------------------------------------------------------
const canvas = document.getElementById('plot');
const ctx    = canvas.getContext('2d');

/* clientWidth, not getBoundingClientRect(): the rect includes the 1px border on
   each side, so a bitmap sized from it is 2px wider than the box it is painted
   into and the drawing comes out stretched horizontally -- circles turn into
   ellipses. And with box-sizing:border-box, style.height sets the OUTER height,
   so hand the border back or the bitmap is 2px taller than its box. */
function cvWidth(cv){ return Math.max(240, cv.clientWidth || Math.floor(cv.getBoundingClientRect().width)); }
function setSize(cv,wCss,hCss,dpr){
  cv.width=Math.round(wCss*dpr); cv.height=Math.round(hCss*dpr);
  cv.style.height=hCss+'px';
  const bh=cv.offsetHeight-cv.clientHeight;
  if(bh) cv.style.height=(hCss+bh)+'px';
}
/* Narrower than the width this drawing was composed for, scale the whole thing
   down instead of clamping the bitmap: same composition, just smaller, so the
   labels shrink together and nothing collides. At or above DESIGN_W, SCL is 1
   and every number below is exactly what it was. */
const DESIGN_W=320;
let SCL=1;
function resizeCanvas() {
  const dpr  = window.devicePixelRatio || 1;
  const wCss = cvWidth(canvas);
  SCL = Math.min(1, wCss / DESIGN_W);
  const w = wCss / SCL;
  const h = Math.max(300, Math.min(w * 0.62, 420));
  setSize(canvas, wCss, h * SCL, dpr);
  ctx.setTransform(dpr * SCL, 0, 0, dpr * SCL, 0, 0);
  draw();
}

window.addEventListener('resize', resizeCanvas);

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width  / (dpr * SCL);
  const h = canvas.height / (dpr * SCL);
  const cx = w / 2;
  const cy = h / 2 + 8;
  const R  = Math.min(w, h) / 2 - 40;

  ctx.clearRect(0, 0, w, h);

  // ---- polar grid --------------------------------------------------------
  ctx.strokeStyle = '#cddce9';
  ctx.lineWidth   = 1;
  ctx.fillStyle   = '#5b6573';
  ctx.font        = '11px Inter, sans-serif';
  ctx.textAlign   = 'center';
  ctx.textBaseline= 'middle';

  const rings = 4;   // rings at scale/4 intervals
  for (let i = 1; i <= rings; i++) {
    const r = (R * i) / rings;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.stroke();
    // Ring label: outer ring (i=rings) is OUTER_DBI; each step in is scaleDb/rings dB lower.
    const dbLabel = OUTER_DBI - state.scaleDb * (1 - i / rings);
    const labelText = (i === rings) ? `${dbLabel.toFixed(0)} dBi` : `${dbLabel.toFixed(0)}`;
    ctx.fillText(labelText, cx + 4, cy - r + 4);
  }

  // angular spokes every 30°
  ctx.strokeStyle = '#e6eef6';
  for (let deg = 0; deg < 360; deg += 30) {
    const rad = deg * Math.PI / 180 - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * Math.cos(rad), cy + R * Math.sin(rad));
    ctx.stroke();
  }
  // 0/90/180/270 labels
  ctx.fillStyle = '#3b4651';
  ctx.font      = 'bold 12px Inter, sans-serif';
  ctx.fillText('0°',   cx,        cy - R - 14);
  ctx.fillText('180°', cx,        cy + R + 14);
  ctx.fillText('90°',  cx + R + 20, cy);
  ctx.fillText('−90°', cx - R - 20, cy);

  // ---- gain curves --------------------------------------------------------
  const N = 720;
  const params = { dLambda: state.dLambda };

  for (const a of ANTENNAS) {
    if (!state.active.has(a.key)) continue;

    ctx.strokeStyle = a.color;
    ctx.lineWidth   = 2;
    ctx.setLineDash(a.dashed ? [4, 4] : []);
    ctx.beginPath();
    let started = false;

    for (let i = 0; i <= N; i++) {
      const phi     = (i / N) * 2 * Math.PI;   // 0 to 2π
      // Map plot angle phi (measured clockwise from top) to physics theta
      // theta = 0 at top (boresight)
      const theta = phi <= Math.PI ? phi : phi - 2 * Math.PI;
      let G_lin;
      if (a.key === 'dish') G_lin = a.pattern(theta, params);
      else                  G_lin = a.pattern(theta);

      // absolute dB relative to isotropic (dBi)
      const eps  = 1e-12;
      const G_dB = 10 * Math.log10(Math.max(G_lin, eps));

      // Map dBi to radius.  Outer ring = OUTER_DBI, inner (r=0) = OUTER_DBI − scaleDb.
      const floorDb = OUTER_DBI - state.scaleDb;
      const clipped = Math.min(Math.max(G_dB, floorDb), OUTER_DBI);
      const r = R * (clipped - floorDb) / state.scaleDb;

      const alpha = phi - Math.PI / 2;
      const x = cx + r * Math.cos(alpha);
      const y = cy + r * Math.sin(alpha);

      if (!started) { ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // ---- legend, parked in the empty left margin of the square plot ----
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  let ly = 22;
  for (const a of ANTENNAS) {
    if (!state.active.has(a.key)) continue;
    ctx.strokeStyle = a.color; ctx.lineWidth = 2.5;
    ctx.setLineDash(a.dashed ? [4, 4] : []);
    ctx.beginPath(); ctx.moveTo(14, ly); ctx.lineTo(34, ly); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#3b4651'; ctx.font = '700 11.5px Inter, sans-serif';
    ctx.fillText(a.name, 40, ly);
    ctx.fillStyle = '#5b6573'; ctx.font = '11px Inter, sans-serif';
    ctx.fillText(gainLabel(a), 40, ly + 14);
    ly += 34;
  }

  updateReadouts();
}

function updateReadouts() {
  const D = state.dLambda;
  const dishDbi = 10 * Math.log10(0.55 * Math.pow(Math.PI * D, 2));
  // half-power point of the sinc^2 aperture pattern: sin(theta) = 1.3916 / (pi D)
  const s = U_HALF / (Math.PI * D);
  const hpbw = (s < 1) ? 2 * Math.asin(s) * 180 / Math.PI : 180;
  document.getElementById('p-dish').textContent  = `${dishDbi.toFixed(1)} dBi`;
  document.getElementById('p-hpbw').textContent  = `${hpbw.toFixed(2)}°`;
  document.getElementById('p-outer').textContent = `${OUTER_DBI} dBi`;
  document.getElementById('p-floor').textContent = `${(OUTER_DBI - state.scaleDb).toFixed(0)} dBi`;
  document.getElementById('p-n').textContent     = `${state.active.size} of ${ANTENNAS.length}`;
}

resizeCanvas();
</script>
</body>
</html>
