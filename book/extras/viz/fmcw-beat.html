<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMCW beat signal and range spectrum</title>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573;
          --amber:#8a5a00; --red:#b01e24; --grn:#3f7d34; --org:#c4610f; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  *, *::before, *::after { box-sizing:border-box; }
  .app { max-width:820px; margin:0 auto; padding:10px 10px 14px; }
  .card { border:1px solid var(--edge); border-radius:6px; background:#fff; padding:6px 8px 2px; }
  canvas { display:block; width:100%; }
  .canvases { display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:10px; }
  @media (min-width:660px) { .canvases { grid-template-columns:2fr 3fr; align-items:start; } }
  .controls { display:grid; grid-template-columns:1fr; gap:7px 18px;
              background:var(--bg); border:1px solid var(--edge); border-radius:6px;
              padding:8px 12px; margin-bottom:10px; }
  @media (min-width:560px) { .controls { grid-template-columns:1fr 1fr; } }
  .ctl { display:flex; align-items:center; gap:8px; min-width:0; }
  .ctl label { font-size:13.5px; color:var(--ink); white-space:nowrap; min-width:96px; }
  .ctl input[type=range] { flex:1 1 80px; min-width:70px; accent-color:var(--navy); }
  .ctl select { flex:1 1 80px; font:inherit; font-size:13.5px; padding:2px 4px; }
  .val { font-variant-numeric:tabular-nums; font-size:13.5px; color:var(--navy);
         font-weight:600; min-width:62px; text-align:right; }
  .readouts { display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(110px, 1fr)); }
  .ro { display:flex; flex-direction:column; align-items:center; gap:4px; padding:7px 8px 8px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  .ro .k { display:block; text-align:center; height:15px; line-height:15px; font-size:10.5px; font-weight:700;
           text-transform:uppercase; letter-spacing:0.045em; color:var(--ink3); white-space:nowrap; overflow:hidden; }
  .ro .v { height:19px; line-height:19px; font-size:14.5px; font-weight:700; white-space:nowrap;
           font-variant-numeric:tabular-nums; text-align:center; color:var(--navy); }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="canvases">
    <div class="card"><canvas id="beat"></canvas></div>
    <div class="card"><canvas id="spec"></canvas></div>
  </div>

  <div class="controls">
    <div class="ctl">
      <label for="r1">Target range</label>
      <input id="r1" type="range" min="0.3" max="9" step="0.05" value="2">
      <span class="val" id="r1v"></span>
    </div>
    <div class="ctl">
      <label for="bw">Bandwidth</label>
      <input id="bw" type="range" min="100" max="500" step="50" value="500">
      <span class="val" id="bwv"></span>
    </div>
    <div class="ctl">
      <label for="dr">Second target</label>
      <input id="dr" type="range" min="0" max="2" step="0.05" value="0">
      <span class="val" id="drv"></span>
    </div>
    <div class="ctl">
      <label for="ts">Chirp length</label>
      <input id="ts" type="range" min="0.25" max="2" step="0.25" value="0.5">
      <span class="val" id="tsv"></span>
    </div>
    <div class="ctl">
      <label for="a2">Second level</label>
      <input id="a2" type="range" min="-50" max="0" step="1" value="-20">
      <span class="val" id="a2v"></span>
    </div>
    <div class="ctl">
      <label for="win">Window</label>
      <select id="win"><option value="hann" selected>Hann</option><option value="rect">rectangular</option></select>
    </div>
  </div>

  <div class="readouts">
    <div class="ro"><span class="k">beat per meter</span><span class="v" id="rKpm"></span></div>
    <div class="ro"><span class="k">target beat</span><span class="v" id="rFb"></span></div>
    <div class="ro"><span class="k">resolution</span><span class="v" id="rRes"></span></div>
    <div class="ro"><span class="k">reach at 0.6 MSPS</span><span class="v" id="rMax"></span></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // The beat signal of one chirp, with the 0 m frequency removed, and its
  // range spectrum. A target at R gives a tone at 2RB/(c Ts) above the 0 m
  // frequency; the FFT over one chirp resolves tones 1/Ts apart, which is
  // c/2B in range. Sample rate 0.6 MSPS and a 0 m frequency of 100 kHz, as
  // on the PHASER (COURSE_SPEC M8; ADI's FMCW_RADAR_Waterfall.py).
  const C = 3.00e8, FS = 0.6e6, F0 = 100e3, RMAX_PLOT = 10;
  const $ = id => document.getElementById(id);
  const beatEl = $('beat'), specEl = $('spec');
  const bx = beatEl.getContext('2d'), sx = specEl.getContext('2d');
  const ins = ['r1', 'bw', 'dr', 'ts', 'a2', 'win'].map($);

  const st = {};
  function compute() {
    st.R1 = +$('r1').value; st.B = +$('bw').value * 1e6; st.Ts = +$('ts').value * 1e-3;
    st.dR = +$('dr').value; st.A2db = +$('a2').value; st.win = $('win').value;
    st.kpm = 2 * st.B / (C * st.Ts);                 // Hz of beat per meter
    st.res = C / (2 * st.B);
    st.rmax = (FS / 2 - F0) / st.kpm;
    st.N = Math.round(FS * st.Ts);
    const tg = [{ r: st.R1, a: 1 }];
    if (st.dR > 0) tg.push({ r: st.R1 + st.dR, a: 10 ** (st.A2db / 20) });
    st.tg = tg;

    // window and beat samples (complex, 0 m frequency removed)
    const N = st.N, w = new Float64Array(N), re = new Float64Array(N), im = new Float64Array(N);
    let ws = 0;
    for (let n = 0; n < N; n++) {
      w[n] = st.win === 'hann' ? 0.5 - 0.5 * Math.cos(2 * Math.PI * n / N) : 1;
      ws += w[n];
      for (const t of tg) {
        const ph = 2 * Math.PI * st.kpm * t.r * n / FS;
        re[n] += t.a * Math.cos(ph); im[n] += t.a * Math.sin(ph);
      }
    }
    st.re = re;
    // spectrum on a range grid: a DFT evaluated at the beat of each range
    const M = 500; st.rr = new Float64Array(M); st.pdb = new Float64Array(M);
    for (let m = 0; m < M; m++) {
      const r = m / (M - 1) * RMAX_PLOT, f = st.kpm * r;
      let sr = 0, si = 0;
      const d = -2 * Math.PI * f / FS;
      for (let n = 0; n < N; n++) {
        const c = Math.cos(d * n), s = Math.sin(d * n), xr = re[n] * w[n], xi = im[n] * w[n];
        sr += xr * c - xi * s; si += xr * s + xi * c;
      }
      st.rr[m] = r;
      st.pdb[m] = Math.max(-80, 20 * Math.log10(Math.hypot(sr, si) / ws + 1e-9));
    }

    $('r1v').textContent = st.R1.toFixed(2) + ' m';
    $('bwv').textContent = (st.B / 1e6).toFixed(0) + ' MHz';
    $('drv').textContent = st.dR > 0 ? '+' + st.dR.toFixed(2) + ' m' : 'off';
    $('tsv').textContent = (st.Ts * 1e3).toFixed(2) + ' ms';
    $('a2v').textContent = (st.A2db < 0 ? '−' : '') + Math.abs(st.A2db) + ' dB';
    $('rKpm').textContent = (st.kpm / 1e3).toFixed(2) + ' kHz/m';
    $('rFb').textContent = (st.kpm * st.R1 / 1e3).toFixed(1) + ' kHz';
    $('rRes').textContent = (st.res * 100).toFixed(0) + ' cm';
    $('rMax').textContent = st.rmax.toFixed(0) + ' m';
  }

  // ---- canvas plumbing (see null-steering.html for SQ) ----
  var __SQ_MQ = window.matchMedia ? window.matchMedia('(max-width:659px)') : null;
  function SQ(h) { return (__SQ_MQ && __SQ_MQ.matches) ? Math.round(h * 0.56) : h; }
  function fit(cv, ctx, h) {
    h = SQ(h);
    const dpr = window.devicePixelRatio || 1;
    const w = cv.parentNode.clientWidth - 16;
    cv.style.height = h + 'px';
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    return { w: w, h: h };
  }
  const F = (s, w) => (w || '') + ' ' + s + 'px Inter, system-ui, sans-serif';

  function drawBeat() {
    const g = fit(beatEl, bx, 220);
    const L = 8, R = 8, T = 20, B = 30;
    const N = st.N, amax = st.tg.reduce((s, t) => s + t.a, 0);
    const x = n => L + n / N * (g.w - L - R);
    const y = v => T + (g.h - T - B) * (0.5 - 0.48 * v / amax);
    bx.strokeStyle = '#e6eef6'; bx.lineWidth = 1;
    bx.fillStyle = '#8792a2'; bx.font = F(11); bx.textAlign = 'center';
    const step = st.Ts > 1.01e-3 ? 0.5e-3 : 0.25e-3;
    for (let t = 0; t <= st.Ts + 1e-9; t += step) {
      const xx = x(t * FS);
      bx.beginPath(); bx.moveTo(xx, T); bx.lineTo(xx, g.h - B); bx.stroke();
      bx.textAlign = t < 1e-9 ? 'left' : t > st.Ts - 1e-9 ? 'right' : 'center';
      bx.fillText((t * 1e3).toFixed(2), xx, g.h - B + 15);
    }
    bx.beginPath(); bx.moveTo(L, y(0)); bx.lineTo(g.w - R, y(0)); bx.strokeStyle = '#c7d2e0'; bx.stroke();
    bx.fillStyle = '#5b6573'; bx.font = F(11.5); bx.textAlign = 'center';
    bx.fillText('time in the chirp (ms)', (L + g.w - R) / 2, g.h - 3);
    // trace: one point per sample, or per pixel when samples outnumber pixels
    bx.beginPath();
    const P = Math.min(N, Math.round(2 * (g.w - L - R)));
    for (let i = 0; i <= P; i++) {
      const n = i / P * (N - 1), k = Math.floor(n), fr = n - k;
      const v = st.re[k] * (1 - fr) + st.re[Math.min(k + 1, N - 1)] * fr;
      i ? bx.lineTo(x(n), y(v)) : bx.moveTo(x(n), y(v));
    }
    bx.strokeStyle = '#004a85'; bx.lineWidth = 1.6; bx.lineJoin = 'round'; bx.stroke();
    bx.fillStyle = '#15202b'; bx.font = F(12, '600'); bx.textAlign = 'left';
    const cyc = st.kpm * st.R1 * st.Ts;
    bx.fillText('beat, ' + cyc.toFixed(1) + ' cycles a chirp', L, T - 6);
  }

  function drawSpec() {
    const g = fit(specEl, sx, 220);
    const L = 30, R = 10, T = 20, B = 30;
    const D0 = -80, D1 = 0;
    const x = r => L + r / RMAX_PLOT * (g.w - L - R);
    const y = d => T + (D1 - d) / (D1 - D0) * (g.h - T - B);
    sx.strokeStyle = '#e6eef6'; sx.lineWidth = 1;
    sx.fillStyle = '#8792a2'; sx.font = F(11); sx.textAlign = 'center';
    for (let r = 0; r <= RMAX_PLOT; r += 2) {
      sx.beginPath(); sx.moveTo(x(r), T); sx.lineTo(x(r), g.h - B); sx.stroke();
      sx.fillText(r, x(r), g.h - B + 15);
    }
    sx.textAlign = 'right';
    for (let d = D0; d <= D1; d += 20) {
      sx.beginPath(); sx.moveTo(L, y(d)); sx.lineTo(g.w - R, y(d)); sx.stroke();
      sx.fillText(d, L - 4, y(d) + 4);
    }
    sx.fillStyle = '#5b6573'; sx.font = F(11.5); sx.textAlign = 'center';
    sx.fillText('range (m)', (L + g.w - R) / 2, g.h - 3);
    const labRight = st.R1 < RMAX_PLOT / 2;           // keep clear of the target markers
    sx.textAlign = labRight ? 'right' : 'left';
    sx.fillText('power (dB)', labRight ? g.w - R : L, T - 6);
    // resolution bar under the first target
    const xr0 = x(st.R1), xr1 = x(st.R1 + st.res), yb = y(-74);
    sx.strokeStyle = '#3f7d34'; sx.lineWidth = 2;
    sx.beginPath(); sx.moveTo(xr0, yb); sx.lineTo(xr1, yb); sx.stroke();
    sx.beginPath(); sx.moveTo(xr0, yb - 4); sx.lineTo(xr0, yb + 4); sx.moveTo(xr1, yb - 4); sx.lineTo(xr1, yb + 4); sx.stroke();
    sx.beginPath();
    for (let m = 0; m < st.rr.length; m++) {
      const P = [x(st.rr[m]), y(st.pdb[m])]; m ? sx.lineTo(...P) : sx.moveTo(...P);
    }
    sx.strokeStyle = '#004a85'; sx.lineWidth = 1.8; sx.lineJoin = 'round'; sx.stroke();
    // target markers
    sx.fillStyle = '#b01e24';
    for (const t of st.tg) {
      if (t.r > RMAX_PLOT) continue;
      sx.beginPath(); sx.moveTo(x(t.r), T + 2); sx.lineTo(x(t.r) - 5, T - 6); sx.lineTo(x(t.r) + 5, T - 6);
      sx.closePath(); sx.fill();
    }
  }

  function drawAll() { drawBeat(); drawSpec(); }
  function update() { compute(); drawAll(); }
  ins.forEach(el => el.addEventListener('input', update));
  window.addEventListener('resize', drawAll);
  update();
})();
</script>
</body>
</html>
