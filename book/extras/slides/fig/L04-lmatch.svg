<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An L network between a feed line and a complex load: a series element next to the load cancels its reactance, then a shunt element transforms the resistance">

<!-- source / feed line -->
<circle cx="86" cy="125" r="24" fill="#ffffff" stroke="#004a85" stroke-width="2.2"/>
<path d="M72 125 q7 -13 14 0 q7 13 14 0" fill="none" stroke="#004a85" stroke-width="2"/>
<line x1="86" y1="101" x2="86" y2="70" stroke="#004a85" stroke-width="2"/>
<line x1="86" y1="149" x2="86" y2="180" stroke="#004a85" stroke-width="2"/>

<!-- top and bottom rails -->
<line x1="86" y1="70" x2="470" y2="70" stroke="#004a85" stroke-width="2"/>
<line x1="550" y1="70" x2="660" y2="70" stroke="#004a85" stroke-width="2"/>
<line x1="86" y1="180" x2="660" y2="180" stroke="#004a85" stroke-width="2"/>

<!-- shunt element, across the line -->
<line x1="300" y1="70" x2="300" y2="100" stroke="#004a85" stroke-width="2"/>
<line x1="300" y1="150" x2="300" y2="180" stroke="#004a85" stroke-width="2"/>
<rect x="288" y="100" width="24" height="50" rx="2" fill="#ffffff" stroke="#1d7a4d" stroke-width="2.4"/>
<text x="270" y="130" fill="#5a5a5a" font-size="13.5" text-anchor="end">shunt element</text>

<!-- series element, in line with the load -->
<rect x="470" y="56" width="80" height="28" rx="2" fill="#ffffff" stroke="#0067b9" stroke-width="2.4"/>
<text x="510" y="106" fill="#5a5a5a" font-size="13.5" text-anchor="middle">series element</text>

<!-- the load -->
<line x1="660" y1="70" x2="660" y2="96" stroke="#004a85" stroke-width="2"/>
<line x1="660" y1="154" x2="660" y2="180" stroke="#004a85" stroke-width="2"/>
<rect x="646" y="96" width="28" height="58" rx="2" fill="#ffffff" stroke="#004a85" stroke-width="2.4"/>

<!-- step 1: cancel the reactance, right at the load -->
<circle cx="452" cy="34" r="13" fill="#e67e22"/>
<text x="452" y="39" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">1</text>
<text x="472" y="40" fill="#e67e22" font-size="15.5" font-weight="700">cancel the reactance</text>

<!-- step 2: transform the resistance, toward the source -->
<circle cx="300" cy="210" r="13" fill="#e67e22"/>
<text x="300" y="215" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">2</text>
<text x="300" y="240" fill="#e67e22" font-size="15.5" font-weight="700" text-anchor="middle">transform the resistance</text>

<!-- end labels -->
<text x="86" y="210" fill="#004a85" font-size="15.5" font-weight="700" text-anchor="middle">feed line</text>
<text x="86" y="230" fill="#5a5a5a" font-size="13" text-anchor="middle">the radio side</text>
<text x="660" y="210" fill="#004a85" font-size="15.5" font-weight="700" text-anchor="middle">antenna</text>
<text x="660" y="230" fill="#5a5a5a" font-size="13" text-anchor="middle">complex load</text>
</svg>
