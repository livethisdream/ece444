<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="At its terminals an antenna is one impedance that splits into a radiation resistance, a loss resistance and a reactance in series">
<defs>
<marker id="zsA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b01e24"/></marker>
</defs>

<!-- the antenna, seen from its terminals -->
<line x1="70" y1="34" x2="70" y2="96" stroke="#004a85" stroke-width="6" stroke-linecap="round"/>
<line x1="70" y1="116" x2="70" y2="178" stroke="#004a85" stroke-width="6" stroke-linecap="round"/>
<circle cx="70" cy="96" r="4" fill="#004a85"/>
<circle cx="70" cy="116" r="4" fill="#004a85"/>
<text x="70" y="204" fill="#5a5a5a" font-size="13" text-anchor="middle">antenna</text>
<text x="152" y="115" fill="#5a5a5a" font-size="26" text-anchor="middle">≡</text>

<!-- the equivalent one-port -->
<circle cx="232" cy="60" r="4" fill="#004a85"/>
<circle cx="232" cy="170" r="4" fill="#004a85"/>
<path d="M232 60 L268 60" fill="none" stroke="#004a85" stroke-width="1.8"/>
<path d="M356 60 L400 60" fill="none" stroke="#004a85" stroke-width="1.8"/>
<path d="M486 60 L528 60" fill="none" stroke="#004a85" stroke-width="1.8"/>
<path d="M616 60 L700 60 L700 170 L232 170" fill="none" stroke="#004a85" stroke-width="1.8"/>

<rect x="268" y="46" width="88" height="28" rx="2" fill="#ffffff" stroke="#1d7a4d" stroke-width="2.2"/>
<rect x="398" y="46" width="88" height="28" rx="2" fill="#ffffff" stroke="#e67e22" stroke-width="2.2"/>
<rect x="528" y="46" width="88" height="28" rx="2" fill="#ffffff" stroke="#0067b9" stroke-width="2.2"/>

<text x="312" y="34" fill="#1d7a4d" font-size="16" font-weight="700" text-anchor="middle">radiation</text>
<text x="442" y="34" fill="#e67e22" font-size="16" font-weight="700" text-anchor="middle">loss</text>
<text x="572" y="34" fill="#0067b9" font-size="16" font-weight="700" text-anchor="middle">reactance</text>

<text x="312" y="96" fill="#5a5a5a" font-size="13" text-anchor="middle">power that leaves</text>
<text x="442" y="96" fill="#5a5a5a" font-size="13" text-anchor="middle">power that heats</text>
<text x="572" y="96" fill="#5a5a5a" font-size="13" text-anchor="middle">energy that stays</text>

<!-- what the two halves mean -->
<path d="M268 112 L268 122 L486 122 L486 112" fill="none" stroke="#c7d2e0" stroke-width="1.6"/>
<text x="377" y="142" fill="#5a5a5a" font-size="13.5" text-anchor="middle">the real part</text>
<path d="M528 112 L528 122 L616 122 L616 112" fill="none" stroke="#c7d2e0" stroke-width="1.6"/>
<text x="572" y="142" fill="#5a5a5a" font-size="13.5" text-anchor="middle">the imaginary part</text>

<!-- the feed current -->
<line x1="190" y1="60" x2="226" y2="60" stroke="#b01e24" stroke-width="2.2" marker-end="url(#zsA)"/>
<text x="186" y="65" fill="#b01e24" font-size="13.5" text-anchor="end">feed current</text>
<text x="232" y="196" fill="#5a5a5a" font-size="13" text-anchor="middle">terminals</text>
</svg>
