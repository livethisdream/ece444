<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 292" role="img"
     aria-label="Reference planes along a measurement chain: plane A at the VNA port, plane B at the end of the test cable where short-open-load calibration is performed, and plane C at the antenna terminals. The pigtail between B and C is left over and rotates the measured phase.">
  <defs>
    <marker id="l13c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b01e24"/>
    </marker>
  </defs>

  <!-- VNA -->
  <rect x="20" y="76" width="126" height="104" rx="8" fill="#ffffff" stroke="#004a85" stroke-width="1.8"/>
  <text x="83" y="122" font-size="15" fill="#15202b" text-anchor="middle">VNA</text>
  <text x="83" y="142" font-size="13" fill="#5b6573" text-anchor="middle">port 1</text>

  <!-- test cable -->
  <line x1="146" y1="128" x2="400" y2="128" stroke="#5b6573" stroke-width="7" stroke-linecap="round"/>
  <text x="273" y="108" font-size="14" fill="#5b6573" text-anchor="middle">test cable</text>

  <!-- connector at the cal plane -->
  <rect x="393" y="115" width="14" height="26" rx="2" fill="#ffffff" stroke="#5b6573" stroke-width="1.6"/>

  <!-- pigtail -->
  <line x1="407" y1="128" x2="562" y2="128" stroke="#8a5a00" stroke-width="4.5" stroke-linecap="round"/>
  <text x="484" y="108" font-size="14" fill="#8a5a00" text-anchor="middle">pigtail</text>

  <!-- antenna -->
  <circle cx="562" cy="128" r="4.5" fill="#15202b"/>
  <line x1="566" y1="126" x2="636" y2="66" stroke="#15202b" stroke-width="3"/>
  <line x1="566" y1="130" x2="636" y2="190" stroke="#15202b" stroke-width="3"/>
  <text x="652" y="132" font-size="14" fill="#15202b">antenna</text>

  <!-- reference planes -->
  <line x1="146" y1="40" x2="146" y2="216" stroke="#5b6573" stroke-width="1.8" stroke-dasharray="6 5"/>
  <line x1="400" y1="40" x2="400" y2="216" stroke="#3f7d34" stroke-width="2.2" stroke-dasharray="6 5"/>
  <line x1="562" y1="40" x2="562" y2="216" stroke="#b01e24" stroke-width="2.2" stroke-dasharray="6 5"/>

  <text x="146" y="30" font-size="14" fill="#5b6573" text-anchor="middle">A · VNA port</text>
  <text x="396" y="30" font-size="14" fill="#3f7d34" text-anchor="end" font-weight="600">B · calibration plane</text>
  <text x="568" y="30" font-size="14" fill="#b01e24" font-weight="600">C · antenna terminals</text>

  <!-- what SOL fixes -->
  <path d="M 146 236 L 400 236" stroke="#3f7d34" stroke-width="1.6"/>
  <path d="M 146 230 L 146 242 M 400 230 L 400 242" stroke="#3f7d34" stroke-width="1.6"/>
  <text x="273" y="258" font-size="13.5" fill="#3f7d34" text-anchor="middle">short–open–load removes all of this</text>

  <!-- what is left over -->
  <path d="M 407 236 L 562 236" stroke="#b01e24" stroke-width="1.6" marker-end="url(#l13c)"/>
  <path d="M 407 230 L 407 242" stroke="#b01e24" stroke-width="1.6"/>
  <text x="486" y="280" font-size="13.5" fill="#b01e24" text-anchor="middle">left over · rotates the phase</text>
</svg>
