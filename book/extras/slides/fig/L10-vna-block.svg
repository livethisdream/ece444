<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 320" role="img"
     aria-label="Block diagram of a one-port vector network analyzer: a source, two directional couplers feeding a reference receiver and a test receiver, and a ratio block whose output is S11, connected through a cable to the antenna under test.">
  <defs>
    <marker id="l13a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#004a85"/>
    </marker>
    <marker id="l13b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a5a00"/>
    </marker>
  </defs>

  <!-- instrument enclosure -->
  <rect x="16" y="20" width="600" height="290" rx="10" fill="#f5f9fc" stroke="#b9d2e5" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="30" y="42" font-size="14" fill="#5b6573">vector network analyzer</text>

  <!-- source -->
  <rect x="40" y="140" width="90" height="46" rx="6" fill="#ffffff" stroke="#004a85" stroke-width="1.8"/>
  <text x="85" y="169" font-size="15" fill="#15202b" text-anchor="middle">source</text>

  <!-- main transmission path -->
  <line x1="130" y1="163" x2="616" y2="163" stroke="#004a85" stroke-width="2.4"/>
  <line x1="130" y1="163" x2="196" y2="163" stroke="#004a85" stroke-width="2.4" marker-end="url(#l13a)"/>

  <!-- directional couplers -->
  <rect x="200" y="145" width="64" height="36" rx="4" fill="#ffffff" stroke="#0067b9" stroke-width="1.6"/>
  <rect x="330" y="145" width="64" height="36" rx="4" fill="#ffffff" stroke="#0067b9" stroke-width="1.6"/>
  <text x="232" y="134" font-size="13" fill="#5b6573" text-anchor="middle">coupler</text>
  <text x="362" y="134" font-size="13" fill="#5b6573" text-anchor="middle">coupler</text>

  <!-- taps down to the receivers -->
  <line x1="232" y1="181" x2="232" y2="236" stroke="#004a85" stroke-width="1.8" marker-end="url(#l13a)"/>
  <line x1="362" y1="181" x2="362" y2="236" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#l13b)"/>
  <text x="242" y="212" font-size="15" fill="#004a85">a<tspan font-size="11" dy="4">1</tspan></text>
  <text x="372" y="212" font-size="15" fill="#8a5a00">b<tspan font-size="11" dy="4">1</tspan></text>

  <!-- receivers -->
  <rect x="176" y="240" width="112" height="46" rx="6" fill="#ffffff" stroke="#004a85" stroke-width="1.8"/>
  <text x="232" y="258" font-size="13.5" fill="#15202b" text-anchor="middle">reference</text>
  <text x="232" y="275" font-size="13.5" fill="#15202b" text-anchor="middle">receiver</text>

  <rect x="306" y="240" width="112" height="46" rx="6" fill="#ffffff" stroke="#8a5a00" stroke-width="1.8"/>
  <text x="362" y="258" font-size="13.5" fill="#15202b" text-anchor="middle">test</text>
  <text x="362" y="275" font-size="13.5" fill="#15202b" text-anchor="middle">receiver</text>

  <!-- ratio block -->
  <rect x="448" y="240" width="140" height="46" rx="6" fill="#eaf2f9" stroke="#004a85" stroke-width="1.8"/>
  <text x="518" y="258" font-size="13.5" fill="#15202b" text-anchor="middle">ratio</text>
  <text x="518" y="275" font-size="13.5" fill="#5b6573" text-anchor="middle">test ÷ reference</text>

  <line x1="418" y1="263" x2="444" y2="263" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#l13b)"/>
  <path d="M 232 286 L 232 302 L 518 302 L 518 290" fill="none" stroke="#004a85" stroke-width="1.8" marker-end="url(#l13a)"/>

  <!-- output -->
  <line x1="588" y1="263" x2="634" y2="263" stroke="#004a85" stroke-width="2" marker-end="url(#l13a)"/>
  <text x="642" y="264" font-size="17" fill="#004a85">S<tspan font-size="12" dy="4">11</tspan></text>

  <!-- port 1 and the antenna under test -->
  <circle cx="616" cy="163" r="5" fill="#004a85"/>
  <text x="616" y="146" font-size="13" fill="#5b6573" text-anchor="middle">port 1</text>
  <line x1="616" y1="163" x2="708" y2="163" stroke="#5b6573" stroke-width="3.4"/>
  <text x="662" y="186" font-size="13" fill="#5b6573" text-anchor="middle">cable</text>
  <circle cx="708" cy="163" r="4" fill="#5b6573"/>
  <line x1="708" y1="70" x2="708" y2="155" stroke="#15202b" stroke-width="3"/>
  <line x1="708" y1="171" x2="708" y2="256" stroke="#15202b" stroke-width="3"/>
  <text x="708" y="284" font-size="14" fill="#15202b" text-anchor="middle">antenna</text>
  <text x="708" y="302" font-size="14" fill="#15202b" text-anchor="middle">under test</text>
</svg>
