<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 24 662 380" role="img" aria-label="Radiation integral geometry: the exact distance R from a source point to the field point, and the far-field parallel-ray approximation leaving only a path difference">
<defs>
  <marker id="rgNavy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#004a85"/></marker>
  <marker id="rgRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b01e24"/></marker>
  <marker id="rgGrn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3f7d34"/></marker>
  <marker id="rgTiny" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0067b9"/></marker>
</defs>

<!-- ============================ 1. EXACT GEOMETRY ============================ -->
<text x="20" y="38" font-size="15" font-weight="700" fill="#004a85">Exact</text>

<path d="M60 150 C58 120, 90 106, 118 116 C150 126, 170 150, 158 176 C146 202, 98 202, 78 188 C64 178, 62 164, 60 150 Z"
      fill="rgba(0,103,185,0.09)" stroke="#0067b9" stroke-width="1.3" stroke-dasharray="5 4"/>
<line x1="82" y1="142" x2="97" y2="134" stroke="#0067b9" stroke-width="1.5" marker-end="url(#rgTiny)"/>
<line x1="92" y1="172" x2="107" y2="164" stroke="#0067b9" stroke-width="1.5" marker-end="url(#rgTiny)"/>
<line x1="118" y1="152" x2="133" y2="144" stroke="#0067b9" stroke-width="1.5" marker-end="url(#rgTiny)"/>
<line x1="106" y1="188" x2="121" y2="180" stroke="#0067b9" stroke-width="1.5" marker-end="url(#rgTiny)"/>
<text x="112" y="224" text-anchor="middle" font-size="13" fill="#5a5a5a">source current</text>

<line x1="100" y1="158" x2="100" y2="62" stroke="#5a5a5a" stroke-width="1.2" marker-end="url(#rgNavy)"/>
<text x="100" y="52" text-anchor="middle" font-size="14" fill="#5a5a5a">z</text>
<path d="M100 109 A46 46 0 0 1 145.3 147.1" fill="none" stroke="#5a5a5a" stroke-width="1.1"/>
<text x="122" y="134" text-anchor="middle" font-size="15" fill="#5a5a5a">&#952;</text>

<circle cx="100" cy="155" r="3.6" fill="#15202b"/>
<text x="88" y="152" text-anchor="end" font-size="14" fill="#15202b">O</text>
<line x1="100" y1="155" x2="150" y2="175" stroke="#3f7d34" stroke-width="2.4" marker-end="url(#rgGrn)"/>
<text x="124" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#3f7d34">r&#8242;</text>
<circle cx="150" cy="175" r="3.8" fill="#3f7d34"/>

<circle cx="600" cy="68" r="4.2" fill="#004a85"/>
<text x="600" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#004a85">field point P</text>

<line x1="100" y1="155" x2="590" y2="70.7" stroke="#004a85" stroke-width="2.4" marker-end="url(#rgNavy)"/>
<text x="350" y="101" text-anchor="middle" font-size="15" font-weight="700" fill="#004a85">r</text>

<line x1="150" y1="175" x2="591" y2="70.1" stroke="#b01e24" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#rgRed)"/>
<text x="352" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#b01e24">R</text>

<line x1="24" y1="250" x2="666" y2="250" stroke="#dbe3ee" stroke-width="1"/>

<!-- ====================== 2. FAR-FIELD PARALLEL-RAY LIMIT ====================== -->
<text x="20" y="284" font-size="15" font-weight="700" fill="#004a85">Far field</text>

<line x1="145.7" y1="295.4" x2="162.1" y2="389.7" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="152" y="290" font-size="12.5" fill="#5a5a5a">wavefront through O</text>

<line x1="150" y1="320" x2="600" y2="241.9" stroke="#004a85" stroke-width="2.2" marker-end="url(#rgNavy)"/>
<line x1="158.7" y1="370" x2="600" y2="293.4" stroke="#b01e24" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#rgRed)"/>
<text x="612" y="238" font-size="13" fill="#5a5a5a">to P</text>
<text x="612" y="290" font-size="13" fill="#5a5a5a">to P</text>

<path d="M160.1 377.9 L168 379.3 L166.6 371.4" fill="none" stroke="#5a5a5a" stroke-width="1.1"/>

<line x1="150" y1="320" x2="205" y2="362" stroke="#3f7d34" stroke-width="2.4" marker-end="url(#rgGrn)"/>
<text x="167" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#3f7d34">r&#8242;</text>
<circle cx="150" cy="320" r="3.6" fill="#15202b"/>
<text x="139" y="316" text-anchor="end" font-size="14" fill="#15202b">O</text>
<circle cx="205" cy="362" r="3.8" fill="#3f7d34"/>
<line x1="158.7" y1="370" x2="205" y2="362" stroke="#8a5a00" stroke-width="4.5" stroke-linecap="round"/>
<line x1="222" y1="392" x2="185" y2="368" stroke="#8a5a00" stroke-width="1" stroke-dasharray="3 2"/>
<text x="228" y="398" font-size="14" font-weight="700" fill="#8a5a00">path difference</text>

<text x="392" y="352" font-size="14" font-weight="700" fill="#004a85">Rays parallel &#8594;</text>
<text x="392" y="374" font-size="13.5" fill="#5a5a5a">distance sets the amplitude,</text>
<text x="392" y="393" font-size="13.5" fill="#5a5a5a">path difference sets the phase</text>
</svg>
