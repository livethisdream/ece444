<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" role="img" aria-label="Pyramidal horn side view: a waveguide flares out to a flat aperture, but the wavefront leaving the flare is spherical, so the edge of the aperture lags the center">
<defs>
<marker id="ho10" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#004a85"/></marker>
</defs>

<!-- flare -->
<path d="M175 143 L430 72 L430 268 L175 197 Z" fill="rgba(0,103,185,0.07)" stroke="none"/>
<line x1="175" y1="143" x2="430" y2="72" stroke="#004a85" stroke-width="3.2"/>
<line x1="175" y1="197" x2="430" y2="268" stroke="#004a85" stroke-width="3.2"/>

<!-- feeding waveguide -->
<rect x="95" y="143" width="80" height="54" fill="rgba(0,103,185,0.16)" stroke="#004a85" stroke-width="2.6"/>
<text x="168" y="248" text-anchor="end" fill="#004a85" font-size="15" font-weight="700">waveguide</text>
<text x="168" y="268" text-anchor="end" fill="#5b6573" font-size="13">one guided mode</text>

<!-- virtual apex + axis -->
<line x1="78" y1="170" x2="440" y2="170" stroke="#5b6573" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="78" y1="170" x2="175" y2="143" stroke="#5b6573" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="78" y1="170" x2="175" y2="197" stroke="#5b6573" stroke-width="1" stroke-dasharray="3 4"/>
<circle cx="78" cy="170" r="4" fill="#5b6573"/>
<text x="78" y="202" text-anchor="middle" fill="#5b6573" font-size="13">virtual apex</text>

<!-- spherical phase front, and the lag at the edges -->
<path d="M417.1 75.6 A 352 352 0 0 1 417.1 264.4" fill="none" stroke="#b01e24" stroke-width="3"/>
<path d="M417.1 75.6 A 352 352 0 0 1 430 170 L430 72 Z" fill="rgba(176,30,36,0.20)" stroke="none"/>
<path d="M430 170 A 352 352 0 0 1 417.1 264.4 L430 268 Z" fill="rgba(176,30,36,0.20)" stroke="none"/>

<!-- aperture plane -->
<line x1="430" y1="62" x2="430" y2="278" stroke="#004a85" stroke-width="2.6" stroke-dasharray="8 4"/>

<!-- aperture dimension -->
<line x1="458" y1="72" x2="458" y2="268" stroke="#004a85" stroke-width="1.8" marker-start="url(#ho10)" marker-end="url(#ho10)"/>
<line x1="434" y1="72" x2="464" y2="72" stroke="#004a85" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="434" y1="268" x2="464" y2="268" stroke="#004a85" stroke-width="1" stroke-dasharray="4 3"/>
<text x="472" y="164" fill="#004a85" font-size="22" font-weight="700" font-style="italic">a</text>
<text x="472" y="186" fill="#5b6573" font-size="13">aperture</text>

<!-- flare length -->
<line x1="175" y1="326" x2="430" y2="326" stroke="#004a85" stroke-width="1.8" marker-start="url(#ho10)" marker-end="url(#ho10)"/>
<line x1="175" y1="204" x2="175" y2="332" stroke="#004a85" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="430" y1="272" x2="430" y2="332" stroke="#004a85" stroke-width="1" stroke-dasharray="4 3"/>
<text x="302" y="312" text-anchor="middle" fill="#004a85" font-size="15" font-weight="700">flare length</text>

<!-- the lag callout -->
<line x1="417.1" y1="75.6" x2="430" y2="72" stroke="#b01e24" stroke-width="2.6"/>
<line x1="392" y1="34" x2="422" y2="66" stroke="#b01e24" stroke-width="1.4"/>
<text x="386" y="30" text-anchor="end" fill="#b01e24" font-size="16" font-weight="700">the edge lags the center</text>
<text x="386" y="50" text-anchor="end" fill="#b01e24" font-size="14" fill-opacity="0.95">spherical front, flat aperture</text>

<!-- phase-front label -->
<text x="240" y="286" fill="#b01e24" font-size="15" font-weight="700">spherical phase front</text>
<line x1="378" y1="278" x2="412" y2="248" stroke="#b01e24" stroke-width="1.3"/>
</svg>
