<svg viewBox="0 0 790 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three concentric field regions around an antenna: a small reactive near field, a radiating near field around it, and the far field extending outward">
<defs>
<marker id="fr5Grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a5a5a"/></marker>
</defs>

<!-- far field: fills the frame, i.e. keeps going -->
<rect x="10" y="12" width="462" height="372" rx="8" fill="#cddce9" opacity="0.55"/>
<text x="26" y="36" font-size="12.5" fill="#5a5a5a">far field continues outward without end</text>

<!-- radiating near field -->
<circle cx="285" cy="196" r="118" fill="#0067b9" opacity="0.26"/>
<!-- reactive near field -->
<circle cx="285" cy="196" r="48" fill="#b01e24" opacity="0.17"/>

<!-- boundaries -->
<circle cx="285" cy="196" r="118" fill="none" stroke="#004a85" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="285" cy="196" r="48" fill="none" stroke="#b01e24" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="285" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#004a85">far-field boundary</text>
<text x="285" y="141" text-anchor="middle" font-size="13" font-weight="700" fill="#b01e24">reactive boundary</text>

<!-- the antenna -->
<line x1="285" y1="178" x2="285" y2="190" stroke="#004a85" stroke-width="4.5" stroke-linecap="round"/>
<line x1="285" y1="202" x2="285" y2="214" stroke="#004a85" stroke-width="4.5" stroke-linecap="round"/>
<circle cx="285" cy="192" r="2.4" fill="#004a85"/>
<circle cx="285" cy="200" r="2.4" fill="#004a85"/>
<text x="285" y="168" text-anchor="middle" font-size="11.5" fill="#004a85">antenna</text>

<!-- leaders -->
<path d="M410.6 123.5 L455 108 L495 108" fill="none" stroke="#5a5a5a" stroke-width="1.1" stroke-dasharray="4 3"/>
<circle cx="410.6" cy="123.5" r="3.4" fill="#5a5a5a"/>
<path d="M370 191 L455 196 L495 196" fill="none" stroke="#5a5a5a" stroke-width="1.1" stroke-dasharray="4 3"/>
<circle cx="370" cy="191" r="3.4" fill="#5a5a5a"/>
<path d="M307 222 L420 288 L495 288" fill="none" stroke="#5a5a5a" stroke-width="1.1" stroke-dasharray="4 3"/>
<circle cx="307" cy="222" r="3.4" fill="#5a5a5a"/>

<!-- labels -->
<text x="503" y="102" font-size="16" font-weight="700" fill="#004a85">far field (Fraunhofer)</text>
<text x="503" y="122" font-size="13" fill="#5a5a5a">pattern fixed, locally a plane wave</text>

<text x="503" y="190" font-size="16" font-weight="700" fill="#0067b9">radiating near field (Fresnel)</text>
<text x="503" y="210" font-size="13" fill="#5a5a5a">energy leaves, but the pattern</text>
<text x="503" y="227" font-size="13" fill="#5a5a5a">is still changing with distance</text>

<text x="503" y="282" font-size="16" font-weight="700" fill="#b01e24">reactive near field</text>
<text x="503" y="302" font-size="13" fill="#5a5a5a">stored energy, sloshing;</text>
<text x="503" y="319" font-size="13" fill="#5a5a5a">nothing leaves</text>


<text x="14" y="402" font-size="12" fill="#5a5a5a">Not to scale, and the boundaries are gradual, not walls. Both radii depend on antenna size and wavelength.</text>
</svg>
