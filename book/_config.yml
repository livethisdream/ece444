---
# ECE 444 course website — Jupyter Book.
# Structure ported from the USAFA ECE 215 book template
# (https://github.com/usafa-ece/ece215-book), pared down for ECE 444.

title: ECE 444 — Antennas and Wave Propagation
author: N. Rogers
copyright: "2026"
logo: DFEC-logo.png

# No notebooks in the initial migration; keep the setting future-proof.
execute:
  execute_notebooks: "auto"

# Practice sets are served as committed PDFs under extras/practice/ (linked from
# each lesson's Practice section), not as HTML pages. The source .md are kept on
# disk but excluded from the build so they don't render or appear in the nav.
exclude_patterns:
  - "**/practice.md"
  - "**/practice-solutions.md"

parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
    - colon_fence

# Nothing to launch (no Binder / Thebe / notebooks); reintroduce if a lesson
# ever ships a runnable notebook.

latex:
  latex_documents:
    targetname: book.tex

repository:
  url: https://github.com/livethisdream/ece444
  path_to_book: book
  branch: main

html:
  favicon: favicon.ico
  use_issues_button: true
  use_repository_button: true

sphinx:
  local_extensions:
    frames: _ext
  config:
    # Reveal.js decks live under book/extras/slides/ and must survive the
    # Sphinx build with their /slides/ URL prefix intact. html_extra_path
    # copies the *contents* of listed dirs into the build root, so wrapping
    # them in extras/ preserves the prefix as extras/slides/... -> slides/...
    html_extra_path: ["extras"]

    # MathJax config lifted verbatim from ece215-book/book/_config.yml:
    # tex-chtml-full bundles boldsymbol; the config keeps bare \(...\)
    # rendering inside raw HTML blocks (needed if we ever mix HTML in a
    # lesson body).
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js
    mathjax3_config:
      tex:
        inlineMath: [["\\(", "\\)"]]
        displayMath: [["\\[", "\\]"]]
        processEscapes: true
      options:
        processHtmlClass: "tex2jax_process|mathjax_process|math|output_area"

    # Show the full global TOC in the left sidebar on every page.
    html_sidebars:
      "**":
        - navbar-logo.html
        - icon-links.html
        - search-button-field.html
        - globaltoc.html

    # The site nav behind the HUD's leftmost button. This book is one course
    # among several on the same GitHub Pages site, so the bar carries the whole
    # site rather than just this course -- which is what the module pills in
    # the old top-left mark were doing badly, since the modules are already in
    # the index overlay.
    #
    # `here: true` marks this book: it is linked to the book's own root doc, so
    # the link works from an unzipped local build as well as from the published
    # site, and its label is what the button itself shows. An empty list drops
    # the button entirely.
    #
    # NOTE: the off-site URLs below follow this site's own publishing pattern
    # (livethisdream.github.io/<repo>/). Confirm each one resolves before this
    # reaches main -- a nav is the one thing on a page nobody forgives a 404 in.
    ece444_site_nav:
      - {label: "Home",     url: "https://livethisdream.github.io/"}
      - {label: "ECE 444",  here: true}
      - {label: "ECE 448",  url: "https://livethisdream.github.io/ece448/"}
      - {label: "Projects", url: "https://livethisdream.github.io/projects/"}

    html_theme: sphinx_book_theme
    html_theme_options:
      show_navbar_depth: 1
