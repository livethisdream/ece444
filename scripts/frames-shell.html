<style>
/* ---- tokens: complete light palette on bare :root ------------------- */
:root {
  --blue:        #0067b9;
  --blue-dark:   #004a85;
  --red:         #b01e24;
  --ink:         #1a1a1a;
  --muted:       #5a5a5a;
  --ground:      #fafaf7;
  --panel:       #ffffff;
  --rule:        rgba(0, 74, 133, 0.16);
  --rule-strong: rgba(0, 74, 133, 0.42);
  --soft:        rgba(0, 103, 185, 0.07);
  --soft-red:    rgba(176, 30, 36, 0.07);
  --rail:        rgba(0, 74, 133, 0.13);
  --shadow:      0 1px 2px rgba(0, 30, 60, .06), 0 8px 24px rgba(0, 30, 60, .05);
  --fig-far:     #cddce9;
  --fig-line:    #5a5a5a;

  --step--1: clamp(.82rem, .78rem + .18vw, .95rem);
  --step-0:  clamp(1rem, .93rem + .34vw, 1.24rem);
  --step-1:  clamp(1.2rem, 1.08rem + .6vw, 1.6rem);
  --step-2:  clamp(1.6rem, 1.32rem + 1.4vw, 2.5rem);
  --step-3:  clamp(2.1rem, 1.6rem + 2.5vw, 3.7rem);

  --sans: "Source Sans Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --math: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* system dark, unless an explicit light choice is stamped */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --blue:        #58a7e5;
    --blue-dark:   #8cc4ee;
    --red:         #e4737a;
    --ink:         #e9eef4;
    --muted:       #93a3b5;
    --ground:      #0d1826;
    --panel:       #14243a;
    --rule:        rgba(140, 196, 238, 0.18);
    --rule-strong: rgba(140, 196, 238, 0.45);
    --soft:        rgba(88, 167, 229, 0.10);
    --soft-red:    rgba(228, 115, 122, 0.10);
    --rail:        rgba(140, 196, 238, 0.16);
    --shadow:      0 1px 2px rgba(0, 0, 0, .35), 0 10px 30px rgba(0, 0, 0, .30);
    --fig-far:     #1d3350;
    --fig-line:    #93a3b5;
  }
}
/* explicit dark choice wins over a light OS */
:root[data-theme="dark"] {
  --blue:        #58a7e5;
  --blue-dark:   #8cc4ee;
  --red:         #e4737a;
  --ink:         #e9eef4;
  --muted:       #93a3b5;
  --ground:      #0d1826;
  --panel:       #14243a;
  --rule:        rgba(140, 196, 238, 0.18);
  --rule-strong: rgba(140, 196, 238, 0.45);
  --soft:        rgba(88, 167, 229, 0.10);
  --soft-red:    rgba(228, 115, 122, 0.10);
  --rail:        rgba(140, 196, 238, 0.16);
  --shadow:      0 1px 2px rgba(0, 0, 0, .35), 0 10px 30px rgba(0, 0, 0, .30);
  --fig-far:     #1d3350;
  --fig-line:    #93a3b5;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--step-0);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ---- the scroller --------------------------------------------------- */
.deck {
  height: 100dvh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
}
.deck::-webkit-scrollbar { display: none; }
@media (prefers-reduced-motion: reduce) { .deck { scroll-behavior: auto; } }

.frame {
  min-height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: grid;
  align-content: center;
  padding: clamp(3rem, 7vh, 6rem) clamp(1.4rem, 6vw, 5rem) clamp(4.5rem, 9vh, 7rem);
}
.wrap {
  width: 100%;
  max-width: 62rem;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: clamp(.9rem, 2.2vh, 1.5rem);
}
.wrap.narrow { max-width: 46rem; }

/* ---- type ----------------------------------------------------------- */
.eyebrow {
  font-size: var(--step--1);
  letter-spacing: .13em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--muted);
  margin: 0;
}
h1 {
  font-size: var(--step-3);
  line-height: 1.02;
  letter-spacing: -.02em;
  font-weight: 700;
  color: var(--blue-dark);
  margin: 0;
  text-wrap: balance;
}
h2 {
  font-size: var(--step-2);
  line-height: 1.08;
  letter-spacing: -.015em;
  font-weight: 700;
  color: var(--blue-dark);
  margin: 0 0 .2em;
  text-wrap: balance;
  padding-bottom: .3em;
  border-bottom: 2px solid var(--rule-strong);
}
p { margin: 0; max-width: 62ch; }
.lede { font-size: var(--step-1); line-height: 1.35; max-width: 34ch; }
strong { font-weight: 700; color: var(--blue-dark); }
em.term { font-style: italic; color: var(--ink); }

ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: .55em; max-width: 62ch; }
li::marker { color: var(--blue); }


/* ---- callout -------------------------------------------------------- */
.callout {
  background: var(--soft);
  border-left: 4px solid var(--blue);
  border-radius: 3px;
  padding: clamp(.8rem, 2vh, 1.15rem) clamp(1rem, 2.4vw, 1.5rem);
  display: flex; flex-direction: column; gap: .6em;
}
.callout p { max-width: 58ch; }

/* ---- hand-set math -------------------------------------------------- */
.eq {
  font-family: var(--math);
  font-size: clamp(1.05rem, .9rem + .7vw, 1.5rem);
  line-height: 1.35;
  text-align: center;
  padding: clamp(.7rem, 2vh, 1.3rem) 0;
  overflow-x: auto;
  color: var(--ink);
}
.eq i, .var { font-style: italic; font-family: var(--math); }

/* A fraction is ONE inline-block with two block children. Both children then
   take the box width, so the rule spans the wider of numerator and
   denominator -- not just the denominator, which is what a border on the
   lower half gives you. Equal line-heights and mirrored padding put the rule
   exactly at the box's vertical center, which is what makes
   `vertical-align: middle` land it on the math axis, level with the `=`.
   No magic offset. */
.frac {
  display: inline-block;
  vertical-align: middle;
  text-align: center;
  margin: 0 .08em;
}
.frac > span { display: block; line-height: 1.2; padding-left: .22em; padding-right: .22em; }
.frac > span:first-child { padding-bottom: .1em; border-bottom: 1px solid currentColor; }
.frac > span:last-child  { padding-top: .1em; }

/* parens around a fraction: centerd on the same axis, and kept out of the
   line box so they do not stretch the row */
.paren {
  display: inline-block; vertical-align: middle;
  font-size: 2.05em; line-height: .62; font-family: var(--math);
  margin: 0 .02em;
}
sub, sup { font-size: .7em; line-height: 0; }
sub { vertical-align: -.28em; }
sup { vertical-align: .5em; }

/* ---- table ---------------------------------------------------------- */
.tablewrap { overflow-x: auto; }
table {
  border-collapse: collapse;
  width: 100%;
  font-size: clamp(.86rem, .8rem + .32vw, 1.06rem);
  font-variant-numeric: tabular-nums;
}
caption {
  text-align: left; color: var(--muted); font-size: var(--step--1);
  padding-bottom: .5em;
}
th {
  text-align: left; font-weight: 700; color: var(--blue-dark);
  border-bottom: 2px solid var(--rule-strong);
  padding: .45em .8em .45em 0;
  font-size: var(--step--1); letter-spacing: .05em; text-transform: uppercase;
}
td { padding: .5em .8em .5em 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.res { font-weight: 700; color: var(--blue-dark); }
td .m { font-family: var(--math); font-style: italic; }

/* ---- figure --------------------------------------------------------- */
figure { margin: 0; display: flex; flex-direction: column; gap: .6em; }
figure svg { width: 100%; height: auto; max-height: 58vh; display: block; }
figcaption { color: var(--muted); font-size: var(--step--1); max-width: 62ch; }
.f-far   { fill: var(--fig-far); }
.f-line  { fill: var(--fig-line); }
.s-line  { stroke: var(--fig-line); }
.f-blue  { fill: var(--blue); }
.f-navy  { fill: var(--blue-dark); }
.s-navy  { stroke: var(--blue-dark); }
.f-red   { fill: var(--red); }
.s-red   { stroke: var(--red); }
.fig-t   { font-family: var(--sans); }

/* ---- progress rail -------------------------------------------------- */
.rail {
  position: fixed; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--rail); z-index: 40; pointer-events: none;
}
.rail span {
  display: block; width: 100%; background: var(--blue);
  height: 0; transition: height .25s ease;
}
@media (prefers-reduced-motion: reduce) { .rail span { transition: none; } }

/* ---- HUD ------------------------------------------------------------ */
.hud {
  position: fixed; right: clamp(.7rem, 2vw, 1.6rem); bottom: clamp(.7rem, 2vh, 1.4rem);
  z-index: 45; display: flex; align-items: center; gap: .55rem;
  font-family: var(--mono); font-size: .74rem; color: var(--muted);
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  border: 1px solid var(--rule); border-radius: 999px;
  padding: .32rem .72rem; box-shadow: var(--shadow);
  backdrop-filter: blur(6px);
}
.hud b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.hud .sep { width: 1px; height: .95em; background: var(--rule-strong); }
.hud button {
  font: inherit; color: var(--muted); background: none; border: none;
  cursor: pointer; padding: .1rem .3rem; border-radius: 4px; letter-spacing: .04em;
}
.hud button:hover { color: var(--ink); background: var(--soft); }
.hud button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.hud button[aria-pressed="true"] { color: var(--red); background: var(--soft-red); font-weight: 700; }

/* ---- laser + spotlight ---------------------------------------------- */
.laser {
  position: fixed; z-index: 60; pointer-events: none;
  width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
  background: radial-gradient(circle, #ff3b30 0 28%, rgba(255,59,48,.85) 45%, rgba(255,59,48,0) 72%);
  box-shadow: 0 0 14px 5px rgba(255,59,48,.42);
  opacity: 0; transition: opacity .12s linear;
}
.laser.on { opacity: 1; }
.spot {
  position: fixed; inset: 0; z-index: 55; pointer-events: none;
  opacity: 0; transition: opacity .18s linear;
}
.spot.on { opacity: 1; }
body.pointing, body.pointing * { cursor: none !important; }
@media (prefers-reduced-motion: reduce) {
  .laser, .spot { transition: none; }
}

/* ---- title frame ---------------------------------------------------- */
.title-frame .wrap { gap: clamp(1rem, 3vh, 2rem); }
.course-mark {
  font-family: var(--mono); font-size: var(--step--1);
  letter-spacing: .22em; text-transform: uppercase; color: var(--blue);
}
.title-rule { height: 3px; background: var(--blue-dark); width: 5.5rem; border-radius: 2px; }
.meta { color: var(--muted); font-size: var(--step--1); }

/* ---- notes frame ---------------------------------------------------- */
.grid2 {
  display: grid; gap: clamp(.9rem, 2.4vw, 1.6rem);
  grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
}
.card {
  background: var(--panel); border: 1px solid var(--rule); border-radius: 6px;
  padding: clamp(.9rem, 2.2vh, 1.25rem); box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: .45em;
}
.card h3 {
  margin: 0; font-size: var(--step-0); color: var(--blue-dark); font-weight: 700;
}
.card p { font-size: var(--step--1); color: var(--muted); max-width: none; line-height: 1.5; }
kbd {
  font-family: var(--mono); font-size: .82em; background: var(--soft);
  border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px;
  padding: .08em .4em; color: var(--ink); white-space: nowrap;
}

/* ---- additions for the full lecture -------------------------------- */
:root { --green: #1d7a4d; --fig-grid: rgba(0,74,133,.18); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --green: #5fc08c; --fig-grid: rgba(140,196,238,.20); }
}
:root[data-theme="dark"] { --green: #5fc08c; --fig-grid: rgba(140,196,238,.20); }

<!--FIGCSS-->

/* ---- two modes, one document --------------------------------------- */
/* The lesson-page depth is ALWAYS in the DOM. Present mode hides it; it is
   never deleted, so nothing the lesson text carries can be lost by the
   deck view. */
.depth { display: flex; flex-direction: column; gap: .8em; max-width: 62ch; }

/* In READ mode the depth is not an aside -- it is the lesson continuing.
   No rule, no label, no size drop: the frame line is the topic sentence and
   this is the paragraph after it. Anything that marks a boundary here just
   rebuilds the seam between deck and page that merging them removed. */
[data-mode="read"] .depth { gap: inherit; }

/* In PRESENT mode it IS an aside -- you pulled it up mid-lecture, so a quiet
   rule earns its place by showing what just appeared. */
[data-mode="present"] .frame.open .depth {
  border-left: 3px solid var(--rule);
  padding-left: clamp(.9rem, 2vw, 1.4rem);
}
[data-mode="present"] .frame.open .depth .eq { padding: .3rem 0; }

.more {
  align-self: flex-start; font: inherit; font-size: var(--step--1);
  font-weight: 600; letter-spacing: .02em;
  color: var(--blue); background: var(--soft);
  border: 1px solid var(--rule); border-radius: 999px;
  padding: .3em .9em; cursor: pointer;
}
.more:hover { background: var(--soft-red); color: var(--red); border-color: var(--red); }
.more:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* present: a deck. depth collapsed behind an affordance. */
[data-mode="present"] .deck  { scroll-snap-type: y mandatory; }
[data-mode="present"] .frame { min-height: 100dvh; }
[data-mode="present"] .depth { display: none; }
[data-mode="present"] .frame.open .depth { display: flex; }
[data-mode="present"] .frame.open .more { display: none; }

/* read: a lesson page. no snapping, everything visible, frames sized to
   their content so the document scrolls continuously. */
[data-mode="read"] .deck  { scroll-snap-type: none; }
[data-mode="read"] .frame {
  min-height: 0;
  padding-top: clamp(2rem, 5vh, 3.2rem);
  padding-bottom: clamp(2rem, 5vh, 3.2rem);
  border-bottom: 1px solid var(--rule);
}
[data-mode="read"] .frame:last-child { border-bottom: none; }
[data-mode="read"] .more  { display: none; }
[data-mode="read"] .depth { display: flex; }
[data-mode="read"] iframe.viz { max-width: 54rem; }


/* a claim that carries the frame, rather than a bullet among bullets */
.pull {
  font-size: var(--step-1); line-height: 1.28; font-weight: 600;
  color: var(--blue-dark); max-width: 44ch;
  border-left: 4px solid var(--red); padding-left: .7em;
}
ol.plan { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: .5em; max-width: 58ch; }
ol.plan li::marker { color: var(--blue); font-weight: 700; }

/* widgets sit in a light instrument panel in both themes -- the course
   viz tools are not theme-aware, so framing them is honest */
.viz-frame .wrap { gap: .8rem; }
iframe.viz {
  width: 100%; border: 1px solid var(--rule); border-radius: 6px;
  background: #ffffff; display: block; box-shadow: var(--shadow);
  color-scheme: light;
}

/* jump index */
.index {
  position: fixed; inset: 0; z-index: 70; display: none;
  background: color-mix(in srgb, var(--ground) 94%, transparent);
  backdrop-filter: blur(10px); overflow-y: auto;
  padding: clamp(2rem, 6vh, 4rem) clamp(1.2rem, 5vw, 4rem);
}
.index.on { display: block; }
.index h2 { margin-bottom: .8em; }
.index ol {
  list-style: none; margin: 0; padding: 0;
  display: grid; gap: .3rem 1.6rem;
  grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr));
  max-width: 72rem;
}
.index button {
  font: inherit; text-align: left; width: 100%; cursor: pointer;
  background: none; border: none; border-radius: 4px;
  padding: .38rem .5rem; color: var(--ink);
  display: flex; gap: .7rem; align-items: baseline;
}
.index button:hover { background: var(--soft); }
.index button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.index button[aria-current="true"] { color: var(--blue-dark); font-weight: 700; }
.index .n {
  font-family: var(--mono); font-size: .78em; color: var(--muted);
  min-width: 1.8em; font-variant-numeric: tabular-nums;
}
</style>

  <div class="wrap"><h2>Jump to</h2><ol id="indexlist"></ol></div>

  <span><b id="cur">1</b>/<span id="tot"><!--TOTAL--></span></span>

  <span class="sep"></span>
  <button id="btnIndex" type="button" aria-pressed="false" title="Jump to a frame (G)">index</button>
  <button id="btnLaser" type="button" aria-pressed="false" title="Laser pointer (L)">laser</button>
  <button id="btnSpot" type="button" aria-pressed="false" title="Spotlight (S)">spot</button>
  <button id="btnFull" type="button" title="Fullscreen (F)">full</button>

<script>
(function () {
  var deck   = document.getElementById('deck');
  var frames = Array.prototype.slice.call(deck.querySelectorAll('.frame'));
  var laser  = document.getElementById('laser');
  var spot   = document.getElementById('spot');
  var railfill = document.getElementById('railfill');
  var curEl  = document.getElementById('cur');
  var idx = 0, pointing = false, spotting = false;
  var px = window.innerWidth / 2, py = window.innerHeight / 2;

  document.getElementById('tot').textContent = frames.length;

  /* ---- position ----------------------------------------------------- */
  function setIndex(i, push) {
    i = Math.max(0, Math.min(frames.length - 1, i));
    if (i === idx && !push) return;
    idx = i;
    curEl.textContent = i + 1;
    railfill.style.height = ((i + 1) / frames.length * 100) + '%';
    var id = '#' + frames[i].id;
    if (location.hash !== id) history.replaceState(null, '', id);
  }

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting && e.intersectionRatio > 0.5) {
        setIndex(frames.indexOf(e.target));
      }
    });
  }, { root: deck, threshold: [0.5] });
  frames.forEach(function (f) { io.observe(f); });

  function go(i) {
    i = Math.max(0, Math.min(frames.length - 1, i));
    frames[i].scrollIntoView({ block: 'start' });
    setIndex(i, true);
  }

  /* ---- pointer ------------------------------------------------------- */
  function paint() {
    laser.style.transform = 'translate(' + px + 'px,' + py + 'px)';
    if (spotting) {
      spot.style.background =
        'radial-gradient(circle at ' + px + 'px ' + py + 'px, ' +
        'rgba(0,0,0,0) 0 84px, rgba(0,0,0,.30) 132px, rgba(0,0,0,.66) 230px)';
    }
  }
  window.addEventListener('pointermove', function (e) {
    px = e.clientX; py = e.clientY;
    if (pointing || spotting) paint();
  }, { passive: true });

  function sync() {
    laser.classList.toggle('on', pointing);
    spot.classList.toggle('on', spotting);
    document.body.classList.toggle('pointing', pointing || spotting);
    document.getElementById('btnLaser').setAttribute('aria-pressed', pointing);
    document.getElementById('btnSpot').setAttribute('aria-pressed', spotting);
    paint();
  }
  function toggleLaser() { pointing = !pointing; sync(); }
  function toggleSpot()  { spotting = !spotting; sync(); }

  /* ---- jump index --------------------------------------------------- */
  var indexEl = document.getElementById('index');
  var listEl  = document.getElementById('indexlist');
  var showing = false;
  frames.forEach(function (f, i) {
    var h = f.querySelector('h1, h2');
    var li = document.createElement('li');
    var b  = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '<span class="n">' + (i + 1) + '</span><span>' +
                  (h ? h.textContent.trim() : 'Frame ' + (i + 1)) + '</span>';
    b.addEventListener('click', function () { toggleIndex(false); go(i); });
    li.appendChild(b); listEl.appendChild(li);
  });
  function toggleIndex(force) {
    showing = (force === undefined) ? !showing : force;
    indexEl.classList.toggle('on', showing);
    document.getElementById('btnIndex').setAttribute('aria-pressed', showing);
    if (showing) {
      var btns = listEl.querySelectorAll('button');
      for (var i = 0; i < btns.length; i++)
        btns[i].setAttribute('aria-current', i === idx);
      btns[idx] && btns[idx].focus();
    }
  }
  document.getElementById('btnIndex').addEventListener('click', function () { toggleIndex(); });

  document.getElementById('btnLaser').addEventListener('click', toggleLaser);
  document.getElementById('btnSpot').addEventListener('click', toggleSpot);
  document.getElementById('btnFull').addEventListener('click', fullscreen);

  function fullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  /* ---- keys ---------------------------------------------------------- */
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (showing && e.key !== 'Escape' && e.key !== 'g' && e.key !== 'G') return;
    switch (e.key) {
      case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ':
        e.preventDefault(); go(idx + 1); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp':
        e.preventDefault(); go(idx - 1); break;
      case 'Home': e.preventDefault(); go(0); break;
      case 'End':  e.preventDefault(); go(frames.length - 1); break;
      case 'l': case 'L': e.preventDefault(); toggleLaser(); break;
      case 's': case 'S': e.preventDefault(); toggleSpot(); break;
      case 'f': case 'F': e.preventDefault(); fullscreen(); break;
      case 'g': case 'G': e.preventDefault(); toggleIndex(); break;
      case 'p': case 'P':
        e.preventDefault();
        setMode(document.documentElement.getAttribute('data-mode') === 'read' ? 'present' : 'read');
        break;
      case 'd': case 'D':
        e.preventDefault();
        frames[idx] && frames[idx].classList.toggle('open');
        break;
      case 'Escape':
        if (showing) { toggleIndex(false); }
        else if (pointing || spotting) { pointing = spotting = false; sync(); }
        break;
    }
  });

  /* ---- open on the hash the URL asked for ---------------------------- */
  var start = frames.findIndex(function (f) { return '#' + f.id === location.hash; });
  if (start > 0) { frames[start].scrollIntoView({ block: 'start' }); setIndex(start, true); }
  else setIndex(0, true);

  /* ---- size widget iframes from their own content -------------------- */
  function autosize(f) {
    try {
      var d = f.contentDocument;
      if (!d || !d.documentElement) return;
      var h = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0);
      if (h > 40) f.style.height = h + 'px';
    } catch (err) { /* leave the fallback height in place */ }
  }
  Array.prototype.forEach.call(
    document.querySelectorAll('iframe.viz[data-autosize]'), function (f) {
      if (f.contentDocument && f.contentDocument.readyState === 'complete') autosize(f);
      f.addEventListener('load', function () { autosize(f); });
      setTimeout(function () { autosize(f); }, 400);
    });

  /* ---- present / read ------------------------------------------------ */
  var modeBtn = document.getElementById('btnMode');
  function setMode(m) {
    document.documentElement.setAttribute('data-mode', m);
    modeBtn.textContent = m;
    modeBtn.setAttribute('aria-label', 'Mode: ' + m + '. Press P to switch.');
    try { localStorage.setItem('ece444-frames-mode', m); } catch (err) {}
    if (m === 'present') frames[idx] && frames[idx].scrollIntoView({ block: 'start' });
  }
  var startMode = 'present';
  try { startMode = localStorage.getItem('ece444-frames-mode') || 'present'; } catch (err) {}
  setMode(startMode === 'read' ? 'read' : 'present');
  modeBtn.addEventListener('click', function () {
    setMode(document.documentElement.getAttribute('data-mode') === 'read' ? 'present' : 'read');
  });

  /* an inline expander, so a question mid-lecture does not cost you the deck */
  Array.prototype.forEach.call(document.querySelectorAll('.depth'), function (d) {
    var f = d.closest('.frame');
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'more';
    b.textContent = 'More detail  +';
    b.addEventListener('click', function () { f.classList.add('open'); d.focus && d.focus(); });
    d.parentNode.insertBefore(b, d);
  });

  deck.focus({ preventScroll: true });
})();
</script>
